<!doctype html>
<meta charset="utf-8">
<title>RCN Table — Map</title>
<!--
═══════════════════════════════════════════════════════════════════════
RCN TABLE MAP — decisions log. Read this before editing.

WHAT THIS IS. The map view of a table. In Tom Sawyer Perspectives the
Retail Network demo puts "Geographical View" and "Logical View" as two tabs
of the same main area: same model, same table underneath, only the rule for
where a node sits differs — coordinates instead of a layout algorithm. We
have no docked panes, so ours is a callout beside Neighbourhood, opened from
the same selection.

A DERIVATIVE, NOT maps/rcn_map.html. That tool is four thousand lines about
NDCs, issues and regions, and it loads its own rcn_static_data.js. Bending it
to accept arbitrary rows would put a second, conditional personality inside
it. This is the small thing instead: Leaflet 1.9.4 from the same CDN pin, one
marker per row, and nothing that knows what an NDC is.

THE SLUG IS STILL THE JOIN. A marker's name links to the same page a table
row and a graph node link to. That is what makes this a view of the model
rather than a picture of some coordinates, and asSlug() below MUST stay
byte-identical to wiki-client lib/page.js, graph-tool's enrichSVGLinks(), and
rcn-table.html.

ROWS WITHOUT COORDINATES ARE COUNTED, NOT DROPPED. Real records are patchy —
in the 2017 Whatcom survey no organisation has a lat/long at all — and a map
that silently shows nine of two hundred rows is worse than one that says so.
═══════════════════════════════════════════════════════════════════════
-->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root{--bg:#f7f8fa;--panel:#fff;--line:#dfe3e8;--ink:#16233b;--dim:#64748b;--accent:#0f766e;--sel:#b45309}
*{box-sizing:border-box}
body{margin:0;font:13px/1.5 system-ui,sans-serif;color:var(--ink);background:var(--bg);
     height:100vh;display:flex;flex-direction:column;overflow:hidden}
header{display:flex;gap:10px;align-items:center;padding:8px 12px;background:var(--panel);
       border-bottom:1px solid var(--line);flex-wrap:wrap}
h1{font-size:13px;margin:0 8px 0 0;font-weight:700;letter-spacing:.02em}
.count{color:var(--dim);font-size:12px;white-space:nowrap}
.warn{color:#92400e;background:#fffbeb;border:1px solid #fde68a;border-radius:5px;
      padding:2px 8px;font-size:11px}
button{font:inherit;color:inherit;border:1px solid var(--line);border-radius:5px;
       padding:4px 7px;background:#fff;cursor:pointer}
button:hover{background:#eef6f5;border-color:var(--accent)}
#map{flex:1;min-height:0}
.leaflet-popup-content{margin:10px 12px;font:13px/1.5 system-ui,sans-serif}
.pop-name{font-weight:700;color:var(--accent);font-size:14px;margin-bottom:2px}
.pop-kind{font-size:11px;color:var(--dim);margin-bottom:6px;text-transform:uppercase;letter-spacing:.05em}
.legend{display:flex;gap:10px;flex-wrap:wrap}
.lg{font-size:11px;color:var(--dim);display:inline-flex;align-items:center;gap:4px}
.lg i{width:11px;height:11px;border-radius:3px;border:1.5px solid;display:inline-block}
.pop-kv{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:12px;margin-bottom:8px}
.pop-kv b{font-weight:500;color:var(--dim)}
.pop-open{font-size:12px;color:var(--accent);cursor:pointer;text-decoration:underline;
          background:none;border:none;padding:0}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#16233b;
       color:#fff;padding:8px 15px;border-radius:6px;font-size:12px;display:none;z-index:9999}
.empty{padding:40px;text-align:center;color:var(--dim)}
</style>

<header>
  <h1>RCN Map</h1>
  <span class="count" id="count">Waiting for rows…</span>
  <span id="missing"></span>
  <span id="legend" class="legend"></span>
  <span style="flex:1"></span>
  <button id="fit">Fit to points</button>
</header>
<div id="map"></div>
<div id="toast"></div>

<script>
'use strict';

// MUST match wiki-client lib/page.js, graph-tool's enrichSVGLinks(), rcn-table.html.
function asSlug(name){
  return String(name).replace(/\s/g,'-').replace(/[^A-Za-z0-9-]/g,'').toLowerCase();
}
var SUBSTRATE_BASE = (function(){
  var q = new URLSearchParams(location.search).get('substrate');
  if(q) return q.replace(/\/+$/,'');
  if(location.port === '8768') return '';
  if(location.protocol === 'file:') return 'http://127.0.0.1:8768';
  if(/(^|\.)localhost$/.test(location.hostname) || location.hostname === '127.0.0.1')
    return 'http://127.0.0.1:8768';
  return '';
})();

var HOST = null;   // set at the handshake below
var $ = function(id){ return document.getElementById(id); };
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function toast(m){ var t=$('toast'); t.textContent=m; t.style.display='block';
  clearTimeout(toast._t); toast._t=setTimeout(function(){t.style.display='none';},2600); }

var map = L.map('map', {zoomControl:true}).setView([48.75, -122.48], 9);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19, attribution: '© OpenStreetMap contributors'
}).addTo(map);

// Three panes, so a point is never buried under an area it sits inside and a
// link is never hidden under either.
var shapes = L.layerGroup().addTo(map);
var lines  = L.layerGroup().addTo(map);
var marks  = L.layerGroup().addTo(map);
var state = {nodes:[], edges:[], selected:[], db:'', kind:''};

// Colour by kind, declared once and shown in the legend, so the picture can be
// read without being explained. Same principle as the graph tool's legend.
var KIND = {
  NDC:   {stroke:'#b45309', fill:'#fbbf24'},
  Place: {stroke:'#0f766e', fill:'#5eead4'},
  Entity:{stroke:'#2563eb', fill:'#bfdbfe'},
  Person:{stroke:'#16a34a', fill:'#bbf7d0'}
};
function paint(k){ return KIND[k] || {stroke:'#64748b', fill:'#e2e8f0'}; }

function openSubject(name){
  if(HOST){
    HOST.postMessage({toolType:'rcn-table-map', action:'doInternalLink', title:name}, '*');
    if(HOST.focus) HOST.focus();
    toast('→ ' + name);
  } else {
    toast('No wiki behind this map — would open /' + asSlug(name) + '.html');
  }
}
window.openSubject = openSubject;

function popupFor(n){
  var kv = '';
  Object.keys(n).forEach(function(k){
    if(['key','name','kind','anchor','boundary'].indexOf(k) >= 0) return;
    if(!String(n[k]||'').trim()) return;
    kv += '<b>' + esc(k) + '</b><span>' + esc(n[k]) + '</span>';
  });
  return '<div class="pop-name">' + esc(n.name) + '</div>'
    + '<div class="pop-kind">' + esc(n.kind) + (n.boundary ? ' · area' : ' · point') + '</div>'
    + (kv ? '<div class="pop-kv">' + kv + '</div>' : '')
    + '<button class="pop-open" onclick="openSubject('
    + JSON.stringify(n.name).replace(/"/g,'&quot;') + ')">Open its page ↗</button>';
}

function draw(){
  shapes.clearLayers(); lines.clearLayers(); marks.clearLayers();
  var sel = {}; state.selected.forEach(function(n){ sel[n] = true; });
  var at = {}, pts = [], areas = 0, points = 0;

  // BIGGEST FIRST, so the small shapes end up on top. A county drawn after the
  // town inside it hides the town completely, and the reading you want is
  // usually the small thing — which watershed, which neighbourhood — seen
  // against the large one.
  var ordered = state.nodes.slice().sort(function(a, b){
    var aa = parseFloat(a.area_mi2) || 0, bb = parseFloat(b.area_mi2) || 0;
    return bb - aa;
  });
  ordered.forEach(function(n){
    var isSel = sel[n.name] || sel[n.key];
    var c = paint(n.kind);
    at[n.key] = n.anchor;
    pts.push(n.anchor);
    var lyr;
    if(n.boundary && n.boundary.length){
      // A NAMED AREA IS DRAWN AS ITS AREA. The whole point of asking for
      // polygons: a watershed is a shape, and shrinking it to a dot throws away
      // the only thing that made it a place rather than a coordinate.
      areas++;
      // Areas nest, so several fills stack on the same pixel and the map turns
      // into one flat colour. Keep the fill faint and let the OUTLINE carry the
      // shape; hovering brings one area forward on its own.
      lyr = L.polygon(n.boundary, {
        color: c.stroke, weight: isSel ? 3 : 1.6, opacity: 0.95,
        fillColor: c.fill, fillOpacity: isSel ? 0.28 : 0.08
      });
      lyr.bindTooltip(n.name + (n.area_mi2 ? ' · ' + n.area_mi2 + ' mi²' : ''),
                      {sticky:true});
      lyr.on('mouseover', function(){ this.setStyle({fillOpacity: 0.4, weight: 3}); });
      lyr.on('mouseout',  function(){ this.setStyle({fillOpacity: isSel ? 0.28 : 0.08,
                                                     weight: isSel ? 3 : 1.6}); });
    } else {
      points++;
      lyr = L.circleMarker(n.anchor, {
        radius: isSel ? 9 : 6, color: c.stroke, weight: isSel ? 3 : 2,
        fillColor: c.fill, fillOpacity: 0.9
      });
      lyr.bindTooltip(n.name, {direction:'top'});
    }
    lyr.bindPopup(popupFor(n));
    lyr.addTo(n.boundary && n.boundary.length ? shapes : marks);

    // AN AREA NEEDS A VISIBLE ANCHOR. Edges meet a shape at its bounding-box
    // centre, and with nothing drawn there the line just stops in open ground
    // and the reader cannot tell what it reached. A small hollow dot says
    // "this line arrives at this area" without pretending to be its location.
    if(n.boundary && n.boundary.length){
      var dot = L.circleMarker(n.anchor, {
        radius: 4, color: c.stroke, weight: 2, opacity: 0.9,
        fillColor: '#ffffff', fillOpacity: 0.95
      });
      dot.bindTooltip(n.name, {direction:'top'});
      dot.bindPopup(popupFor(n));
      dot.addTo(marks);
    }
  });

  // EDGES MEET THE SHAPE AT ITS ANCHOR. For an area that is the bounding-box
  // centre, which is where the marker would have been — so a line to a watershed
  // ends inside the watershed rather than at some arbitrary vertex.
  var drawn = 0;
  state.edges.forEach(function(e){
    var a = at[e.src], b = at[e.tgt];
    if(!a || !b) return;
    drawn++;
    var pl = L.polyline([a, b], {color:'#334155', weight:1.6, opacity:0.75, dashArray:'5,4'});
    if(e.label) pl.bindTooltip(e.label, {sticky:true});
    pl.addTo(lines);
  });

  $('count').textContent = state.nodes.length + ' located  ·  ' + areas + ' area'
    + (areas===1?'':'s') + ', ' + points + ' point' + (points===1?'':'s')
    + '  ·  ' + drawn + ' link' + (drawn===1?'':'s')
    + (state.db ? '  ·  ' + state.db : '');
  $('missing').innerHTML = state.skipped
    ? '<span class="warn">' + state.skipped + ' row' + (state.skipped===1?'':'s')
      + ' without coordinates</span>' : '';
  var kinds = {};
  state.nodes.forEach(function(n){ kinds[n.kind] = (kinds[n.kind]||0)+1; });
  $('legend').innerHTML = Object.keys(kinds).sort().map(function(k){
    var c = paint(k);
    return '<span class="lg"><i style="background:' + c.fill + ';border-color:'
         + c.stroke + '"></i>' + esc(k) + ' ' + kinds[k] + '</span>';
  }).join('');
  if(pts.length) map.fitBounds(L.latLngBounds(pts).pad(0.15), {maxZoom: 13});
  else toast('Nothing here carries a location');
  window._pts = pts;
}

$('fit').addEventListener('click', function(){
  if(window._pts && window._pts.length)
    map.fitBounds(L.latLngBounds(window._pts).pad(0.15), {maxZoom:13});
});

// ONE SOURCE. Geometry, attributes and edges all come from Neo4j through
// /projection/geo — the table hands over which rows it is showing and which are
// selected, never the coordinates themselves. So the map cannot drift from the
// substrate, and a link to it works with no table open at all.
function load(opts){
  state.db = opts.db || state.db;
  state.kind = opts.kind || '';
  state.selected = opts.selected || [];
  var q = '/projection/geo?db=' + encodeURIComponent(state.db);
  if(opts.kind) q += '&kind=' + encodeURIComponent(opts.kind);
  if(opts.names && opts.names.length && opts.names.length <= 400)
    q += '&names=' + encodeURIComponent(opts.names.join('|'));
  $('count').textContent = 'Loading…';
  return fetch(SUBSTRATE_BASE + q).then(function(r){ return r.json(); })
    .then(function(j){
      if(j.error) throw new Error(j.error);
      state.nodes = j.nodes || []; state.edges = j.edges || [];
      state.skipped = opts.names ? Math.max(0, opts.names.length - state.nodes.length) : 0;
      document.title = 'RCN Map — ' + (state.kind || state.db);
      draw();
    })
    .catch(function(e){ $('count').textContent = 'Could not load: ' + e.message; });
}

// ── how the rows arrive ───────────────────────────────────────────────
// Two ways, because a map opened from a selection and a map someone was sent
// a link to are different situations. postMessage carries whatever the table
// is showing, however much of it; the URL carries enough to stand alone.
// opener when called out of the table, parent when embedded in a page — a map
// is a reasonable thing to put in a wiki Frame, and the handshake is the same.
HOST = (window.opener && !window.opener.closed) ? window.opener
         : (window.parent !== window ? window.parent : null);
if(HOST){
  HOST.postMessage({toolType:'rcn-table-map', action:'mapReady'}, '*');
  window.addEventListener('message', function(ev){
    if(!ev.source || ev.source !== HOST) return;
    if(ev.data && ev.data.action === 'loadPoints'){
      load({db: ev.data.database, kind: ev.data.kind,
            names: ev.data.names, selected: ev.data.selected});
    }
  });
}

(function bootFromUrl(){
  var p = new URLSearchParams(location.search);
  var db = p.get('db');
  if(!db) return;                          // a postMessage is coming instead
  var names = p.get('names');
  load({db: db, kind: p.get('kind') || '',
        names: names ? names.split('|') : null,
        selected: names ? names.split('|') : []});
})();
</script>
