<!doctype html>
<meta charset="utf-8">
<title>RCN Table — Map</title>
<!--
═══════════════════════════════════════════════════════════════════════
RCN TABLE MAP — decisions log. Read this before editing.

WHAT THIS IS. The map view of a table. In Tom Sawyer Perspectives the
Retail Network demo puts "Geographical View" and "Logical View" as two tabs
of the same main area: same model, same table underneath, only the rule for
where a node sits differs — coordinates instead of a layout algorithm. We
have no docked panes, so ours is a callout beside Neighbourhood, opened from
the same selection.

A DERIVATIVE, NOT maps/rcn_map.html. That tool is four thousand lines about
NDCs, issues and regions, and it loads its own rcn_static_data.js. Bending it
to accept arbitrary rows would put a second, conditional personality inside
it. This is the small thing instead: Leaflet 1.9.4 from the same CDN pin, one
marker per row, and nothing that knows what an NDC is.

THE SLUG IS STILL THE JOIN. A marker's name links to the same page a table
row and a graph node link to. That is what makes this a view of the model
rather than a picture of some coordinates, and asSlug() below MUST stay
byte-identical to wiki-client lib/page.js, graph-tool's enrichSVGLinks(), and
rcn-table.html.

ROWS WITHOUT COORDINATES ARE COUNTED, NOT DROPPED. Real records are patchy —
in the 2017 Whatcom survey no organisation has a lat/long at all — and a map
that silently shows nine of two hundred rows is worse than one that says so.
═══════════════════════════════════════════════════════════════════════
-->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root{--bg:#f7f8fa;--panel:#fff;--line:#dfe3e8;--ink:#16233b;--dim:#64748b;--accent:#0f766e;--sel:#b45309}
*{box-sizing:border-box}
body{margin:0;font:13px/1.5 system-ui,sans-serif;color:var(--ink);background:var(--bg);
     height:100vh;display:flex;flex-direction:column;overflow:hidden}
header{display:flex;gap:10px;align-items:center;padding:8px 12px;background:var(--panel);
       border-bottom:1px solid var(--line);flex-wrap:wrap}
h1{font-size:13px;margin:0 8px 0 0;font-weight:700;letter-spacing:.02em}
.count{color:var(--dim);font-size:12px;white-space:nowrap}
.warn{color:#92400e;background:#fffbeb;border:1px solid #fde68a;border-radius:5px;
      padding:2px 8px;font-size:11px}
button{font:inherit;color:inherit;border:1px solid var(--line);border-radius:5px;
       padding:4px 7px;background:#fff;cursor:pointer}
button:hover{background:#eef6f5;border-color:var(--accent)}
#map{flex:1;min-height:0}
.leaflet-popup-content{margin:10px 12px;font:13px/1.5 system-ui,sans-serif}
.pop-name{font-weight:700;color:var(--accent);font-size:14px;margin-bottom:5px}
.pop-kv{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:12px;margin-bottom:8px}
.pop-kv b{font-weight:500;color:var(--dim)}
.pop-open{font-size:12px;color:var(--accent);cursor:pointer;text-decoration:underline;
          background:none;border:none;padding:0}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#16233b;
       color:#fff;padding:8px 15px;border-radius:6px;font-size:12px;display:none;z-index:9999}
.empty{padding:40px;text-align:center;color:var(--dim)}
</style>

<header>
  <h1>RCN Map</h1>
  <span class="count" id="count">Waiting for rows…</span>
  <span id="missing"></span>
  <span style="flex:1"></span>
  <button id="fit">Fit to points</button>
</header>
<div id="map"></div>
<div id="toast"></div>

<script>
'use strict';

// MUST match wiki-client lib/page.js, graph-tool's enrichSVGLinks(), rcn-table.html.
function asSlug(name){
  return String(name).replace(/\s/g,'-').replace(/[^A-Za-z0-9-]/g,'').toLowerCase();
}
var SUBSTRATE_BASE = (function(){
  var q = new URLSearchParams(location.search).get('substrate');
  if(q) return q.replace(/\/+$/,'');
  if(location.port === '8768') return '';
  if(location.protocol === 'file:') return 'http://127.0.0.1:8768';
  if(/(^|\.)localhost$/.test(location.hostname) || location.hostname === '127.0.0.1')
    return 'http://127.0.0.1:8768';
  return '';
})();

var HOST = null;   // set at the handshake below
var $ = function(id){ return document.getElementById(id); };
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function toast(m){ var t=$('toast'); t.textContent=m; t.style.display='block';
  clearTimeout(toast._t); toast._t=setTimeout(function(){t.style.display='none';},2600); }

var map = L.map('map', {zoomControl:true}).setView([48.75, -122.48], 9);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19, attribution: '© OpenStreetMap contributors'
}).addTo(map);

var layer = L.layerGroup().addTo(map);
var state = {rows:[], subject:'Name', selected:[], db:'', kind:''};

// LAT AND LONG ARRIVE AS STRINGS. They come from a spreadsheet by way of Neo4j,
// so anything that is not a finite number in range is treated as absent rather
// than plotted at the wrong place or at (0,0) off West Africa.
function coordOf(r){
  var la = parseFloat(String(r.lat != null ? r.lat : r.latitude || '').trim());
  var lo = parseFloat(String(r.long != null ? r.long : (r.lng != null ? r.lng : r.longitude || '')).trim());
  if(!isFinite(la) || !isFinite(lo)) return null;
  if(la < -90 || la > 90 || lo < -180 || lo > 180) return null;
  if(la === 0 && lo === 0) return null;
  return [la, lo];
}

function openSubject(name){
  // Up the chain: map -> table -> wiki. The table forwards it, and if nothing is
  // listening we say what would have happened rather than doing nothing.
  if(HOST){
    HOST.postMessage({toolType:'rcn-table-map', action:'doInternalLink',
      title:name}, '*');
    if(HOST.focus) HOST.focus();
    toast('→ ' + name);
  } else {
    toast('No wiki behind this map — would open /' + asSlug(name) + '.html');
  }
}
window.openSubject = openSubject;

function draw(){
  layer.clearLayers();
  var pts = [], missing = 0, sel = {};
  state.selected.forEach(function(n){ sel[n] = true; });

  state.rows.forEach(function(r){
    var c = coordOf(r);
    var name = String(r[state.subject] || '');
    if(!c){ missing++; return; }
    var isSel = sel[name];
    var m = L.circleMarker(c, {
      radius: isSel ? 9 : 6,
      color: isSel ? '#b45309' : '#0f766e',
      weight: isSel ? 3 : 2,
      fillColor: isSel ? '#fbbf24' : '#5eead4',
      fillOpacity: 0.85
    });
    var kv = '';
    Object.keys(r).forEach(function(k){
      if(k === state.subject || !String(r[k]||'').trim()) return;
      if(k === 'lat' || k === 'long') return;
      kv += '<b>' + esc(k) + '</b><span>' + esc(r[k]) + '</span>';
    });
    m.bindPopup('<div class="pop-name">' + esc(name) + '</div>'
      + (kv ? '<div class="pop-kv">' + kv + '</div>' : '')
      + '<button class="pop-open" onclick="openSubject(' + JSON.stringify(name).replace(/"/g,'&quot;') + ')">Open its page ↗</button>');
    m.bindTooltip(name, {direction:'top'});
    m.addTo(layer);
    pts.push(c);
  });

  $('count').textContent = pts.length + ' of ' + state.rows.length + ' rows mapped'
    + (state.db ? '  ·  ' + state.db + ' · ' + state.kind : '');
  $('missing').innerHTML = missing
    ? '<span class="warn">' + missing + ' row' + (missing===1?'':'s') + ' without coordinates</span>'
    : '';
  if(pts.length){
    map.fitBounds(L.latLngBounds(pts).pad(0.25), {maxZoom: 14});
  } else {
    toast('None of these rows carry a lat/long');
  }
  window._pts = pts;
}

$('fit').addEventListener('click', function(){
  if(window._pts && window._pts.length) map.fitBounds(L.latLngBounds(window._pts).pad(0.25), {maxZoom:14});
});

// ── how the rows arrive ───────────────────────────────────────────────
// Two ways, because a map opened from a selection and a map someone was sent
// a link to are different situations. postMessage carries whatever the table
// is showing, however much of it; the URL carries enough to stand alone.
// opener when called out of the table, parent when embedded in a page — a map
// is a reasonable thing to put in a wiki Frame, and the handshake is the same.
HOST = (window.opener && !window.opener.closed) ? window.opener
         : (window.parent !== window ? window.parent : null);
if(HOST){
  HOST.postMessage({toolType:'rcn-table-map', action:'mapReady'}, '*');
  window.addEventListener('message', function(ev){
    if(!ev.source || ev.source !== HOST) return;
    if(ev.data && ev.data.action === 'loadPoints'){
      state.rows = ev.data.rows || [];
      state.subject = ev.data.subject || 'Name';
      state.selected = ev.data.selected || [];
      state.db = ev.data.database || ''; state.kind = ev.data.kind || '';
      document.title = 'RCN Map — ' + (state.kind || 'points');
      draw();
    }
  });
}

(function bootFromUrl(){
  var p = new URLSearchParams(location.search);
  var db = p.get('db'), kind = p.get('kind');
  if(!db || !kind) return;                 // a postMessage is coming instead
  fetch(SUBSTRATE_BASE + '/projection/table/' + encodeURIComponent(kind)
        + '?db=' + encodeURIComponent(db))
    .then(function(r){ return r.json(); })
    .then(function(j){
      if(state.rows.length) return;        // the opener already sent rows
      state.rows = j.data || []; state.subject = j.subject || 'Name';
      state.db = db; state.kind = kind;
      var names = p.get('names');
      state.selected = names ? names.split('|') : [];
      document.title = 'RCN Map — ' + kind;
      draw();
    })
    .catch(function(e){
      $('count').textContent = 'Could not load: ' + e.message;
    });
})();
</script>
