<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Checklist Layout Test</title>
<style>
  body { font-family: system-ui, sans-serif; padding: 20px; max-width: 500px; }
  h2 { font-size: 1rem; color: #555; }

  /* SCP classes exactly as defined in scp-medication.js */
  .scp-row { display:flex; align-items:baseline; gap:8px; padding:2px 0; }
  .scp-lbl { flex:0 0 110px; font-size:.7rem; color:#888; text-transform:uppercase;
    letter-spacing:.04em; padding-top:3px; line-height:1.3; }
  .scp-val { flex:1; min-width:0; }
  .scp-checks { display:flex; flex-wrap:wrap; gap:3px 14px; padding:3px 0; }
  .scp-chk { display:flex; align-items:center; gap:4px; font-size:.84rem; cursor:pointer; }
</style>
</head>
<body>

<h2>A — Current code (column + nowrap + align-start inline override)</h2>
<div class="scp-row">
  <span class="scp-lbl">Visit Topics</span>
  <div class="scp-val">
    <div class="scp-checks" style="flex-direction:column;flex-wrap:nowrap;align-items:flex-start;gap:4px">
      <label class="scp-chk"><input type="checkbox"><span>Follow-up / Check-up</span></label>
      <label class="scp-chk"><input type="checkbox"><span>Review Test Results</span></label>
      <label class="scp-chk"><input type="checkbox"><span>New Problem or Symptoms</span></label>
      <label class="scp-chk"><input type="checkbox"><span>Medication Adjustment or Refill</span></label>
      <label class="scp-chk"><input type="checkbox"><span>Chronic Disease Management</span></label>
      <label class="scp-chk"><input type="checkbox"><span>Mental / Emotional Health</span></label>
      <label class="scp-chk"><input type="checkbox"><span>Other</span></label>
    </div>
  </div>
</div>

<hr>

<h2>B — Pure inline styles, no class on container or labels</h2>
<div class="scp-row">
  <span class="scp-lbl">Visit Topics</span>
  <div class="scp-val">
    <div style="display:flex;flex-direction:column;gap:4px;padding:3px 0">
      <label style="display:flex;align-items:center;gap:6px;cursor:pointer;font-size:.84rem"><input type="checkbox" style="flex:0 0 auto;margin:0"><span>Follow-up / Check-up</span></label>
      <label style="display:flex;align-items:center;gap:6px;cursor:pointer;font-size:.84rem"><input type="checkbox" style="flex:0 0 auto;margin:0"><span>Review Test Results</span></label>
      <label style="display:flex;align-items:center;gap:6px;cursor:pointer;font-size:.84rem"><input type="checkbox" style="flex:0 0 auto;margin:0"><span>New Problem or Symptoms</span></label>
      <label style="display:flex;align-items:center;gap:6px;cursor:pointer;font-size:.84rem"><input type="checkbox" style="flex:0 0 auto;margin:0"><span>Medication Adjustment or Refill</span></label>
      <label style="display:flex;align-items:center;gap:6px;cursor:pointer;font-size:.84rem"><input type="checkbox" style="flex:0 0 auto;margin:0"><span>Chronic Disease Management</span></label>
      <label style="display:flex;align-items:center;gap:6px;cursor:pointer;font-size:.84rem"><input type="checkbox" style="flex:0 0 auto;margin:0"><span>Mental / Emotional Health</span></label>
      <label style="display:flex;align-items:center;gap:6px;cursor:pointer;font-size:.84rem"><input type="checkbox" style="flex:0 0 auto;margin:0"><span>Other</span></label>
    </div>
  </div>
</div>

</body>
</html>
