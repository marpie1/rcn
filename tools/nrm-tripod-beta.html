<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NRM — Neighborhood Risk Management (Tripod Beta)</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'IBM Plex Sans', sans-serif; overflow: hidden; }
        button { transition: all 0.2s; }
        button:hover { opacity: 0.9; transform: translateY(-1px); }
        .connection-port { cursor: crosshair; transition: all 0.2s; }
        .connection-port:hover circle { r: 8; }
        @keyframes slideIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
        .modal { animation: slideIn 0.2s ease-out; }
        .card:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,0.12); }
        @keyframes spin { to { transform: rotate(360deg); } }
        .spinner { animation: spin 1s linear infinite; }
        .barrier-hover { cursor: move; }
        .barrier-hover:hover { filter: brightness(1.15); transform: scale(1.05); }
        .barrier-attaching { opacity: 0.6; cursor: crosshair; }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useRef, useEffect } = React;
        
        const Icon = ({ name, size = 24, className }) => {
            const paths = {
                plus: "M12 5v14M5 12h14", save: "M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z M17 21v-8H7v8 M7 3v5h8",
                folder: "M22 19a2 2 0 01-2 2H4a2 2 0 01-2-2V5a2 2 0 012-2h5l2 3h9a2 2 0 012 2z", layout: "M3 3h18v18H3z M3 9h18 M9 9v12",
                wand: "M15 4V2M15 16v-2M23 9h-2M5 9H3M16.36 2.64l-1.42 1.42M8.05 16.95l-1.41 1.42M16.95 16.95l1.42 1.42M7.64 7.64L6.22 6.22 M12 12m-3 0a3 3 0 106 0 3 3 0 10-6 0",
                download: "M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4 M7 10l5 5 5-5 M12 15V3", x: "M18 6L6 18M6 6l12 12",
                trash: "M3 6h18 M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2 M10 11v6 M14 11v6",
                file: "M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z M14 2v6h6 M16 13H8 M16 17H8 M10 9H8",
                loader: "M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83",
                messageSquare: "M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z",
                shield: "M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z",
                shieldOff: "M19.69 14a6.9 6.9 0 00.31-2V5l-8-3-3.16 1.18 M4.73 4.73L4 5v7c0 6 8 10 8 10a20.3 20.3 0 005.62-4.38 M1 1l22 22",
                shieldCheck: "M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z M9 12l2 2 4-4"
            };
            return <svg width={size} height={size} className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d={paths[name]}/></svg>;
        };

        const TEMPLATES = [{
            id: 'equipment', name: 'Equipment Failure', desc: 'Winch mechanic with barriers', difficulty: 'Beginner',
            nodes: [
                { id: 1, type: 'agent', x: 100, y: 200, text: 'Rotating winch machinery', comments: '', width: 160, height: 80 },
                { id: 2, type: 'object', x: 100, y: 350, text: "Mechanic's foot", comments: '', width: 160, height: 80 },
                { id: 3, type: 'event', x: 1000, y: 275, text: 'Foot caught in rotating winch', comments: '', width: 160, height: 80 },
                { id: 7, type: 'underlyingCause', x: 300, y: 200, text: 'Inadequate safety training', comments: '', width: 160, height: 80 },
                { id: 6, type: 'precondition', x: 520, y: 200, text: 'Time pressure for repair', comments: '', width: 160, height: 80 },
                { id: 5, type: 'immediateCause', x: 740, y: 275, text: 'Worked on energized equipment', comments: '', width: 160, height: 80 }
            ],
            connections: [
                { id: 101, from: 1, to: 3 },  // Agent → Event (Safety Shoes missing barrier)
                { id: 102, from: 2, to: 3 },  // Object → Event (Machine Guard and Lockout/Tagout barriers)
                { id: 106, from: 7, to: 6 },  // Underlying Cause → Precondition
                { id: 105, from: 6, to: 5 },  // Precondition → Immediate Cause
                { id: 103, from: 5, toBarrier: 203 }  // Immediate Cause → Lockout/Tagout barrier (on line 102)
            ],
            barriers: [
                { id: 201, connectionId: 101, type: 'missing', label: 'Safety Shoes', comments: 'PPE not worn', linePosition: 0.5 },
                { id: 202, connectionId: 102, type: 'failed', label: 'Machine Guard', comments: 'Guard removed for maintenance', linePosition: 0.4 },
                { id: 203, connectionId: 102, type: 'failed', label: 'Lockout/Tagout', comments: 'Procedure not followed', linePosition: 0.6 }
            ]
        }, { 
            id: 'blank', name: 'Blank Canvas', desc: 'Start from scratch', difficulty: 'All', 
            nodes: [], connections: [], barriers: []
        }];

        const nodeTypes = {
            agent: { label: 'Agent', color: '#FFD966', shape: 'para', canConnectTo: ['event'] },
            object: { label: 'Object', color: '#B4D7A8', shape: 'para', canConnectTo: ['event'] },
            event: { label: 'Event', color: '#EA9999', shape: 'rect', canConnectTo: [] },
            immediateCause: { label: 'Immediate Cause', color: '#E06666', shape: 'rect', canConnectTo: ['event'] },
            precondition: { label: 'Precondition', color: '#F6B26B', shape: 'ellipse', canConnectTo: ['immediateCause'] },
            underlyingCause: { label: 'Underlying Cause', color: '#CC4125', shape: 'round', canConnectTo: ['precondition'] }
        };

        const barrierTypes = {
            failed: { label: 'Failed Barrier', color: '#9FC5E8', icon: 'shieldOff', description: 'Barrier defeated/breached' },
            intact: { label: 'Intact Barrier', color: '#6FA8DC', icon: 'shieldCheck', description: 'Barrier that worked' },
            missing: { label: 'Missing Barrier', color: '#B4A7D6', icon: 'shield', description: 'Barrier not established' }
        };

        const App = () => {
            const [nodes, setNodes] = useState([]);
            const [connections, setConnections] = useState([]);
            const [barriers, setBarriers] = useState([]);
            const [selected, setSelected] = useState(null);
            const [selectedType, setSelectedType] = useState(null);
            const [dragging, setDragging] = useState(null);
            const [draggingBarrier, setDraggingBarrier] = useState(null);
            const [draggingExistingBarrier, setDraggingExistingBarrier] = useState(null);
            const [offset, setOffset] = useState({ x: 0, y: 0 });
            const [connecting, setConnecting] = useState(null);
            const [tempConn, setTempConn] = useState(null);
            const [showModal, setShowModal] = useState(null);
            const [saveName, setSaveName] = useState('');
            const [saved, setSaved] = useState([]);
            const [exporting, setExporting] = useState(false);
            const [hoveredConnection, setHoveredConnection] = useState(null);
            const [welcomeDismissed, setWelcomeDismissed] = useState(false);
            const [mouseDownPos, setMouseDownPos] = useState(null);
            const [isDraggingNode, setIsDraggingNode] = useState(false);
            const [selectingRegion, setSelectingRegion] = useState(false);
            const [selectionRect, setSelectionRect] = useState(null);
            const canvasRef = useRef(null);

            useEffect(() => {
                const s = localStorage.getItem('tripodAnalyses');
                if (s) setSaved(JSON.parse(s));
            }, []);

            const addNode = (type, x = 400, y = 200) => {
                setNodes([...nodes, { id: Date.now(), type, x, y, text: '', comments: '', width: 160, height: 80 }]);
                setWelcomeDismissed(true);
            };

            const startAddingBarrier = (type) => {
                setDraggingBarrier({ type, id: Date.now() });
            };

            const save = () => {
                const analysis = { 
                    id: Date.now(), 
                    name: saveName || 'Analysis', 
                    nodes, 
                    connections, 
                    barriers,
                    date: new Date().toISOString() 
                };
                const all = [...saved, analysis];
                localStorage.setItem('tripodAnalyses', JSON.stringify(all));
                setSaved(all);
                setShowModal(null);
            };

            const load = (id) => {
                const a = saved.find(s => s.id === id);
                if (a) { 
                    setNodes(a.nodes); 
                    setConnections(a.connections); 
                    setBarriers(a.barriers || []);
                    setSaveName(a.name); 
                    setShowModal(null); 
                }
            };

            const loadTemplate = (id) => {
                const t = TEMPLATES.find(t => t.id === id);
                if (t) { 
                    setNodes(t.nodes); 
                    setConnections(t.connections); 
                    setBarriers(t.barriers || []);
                    setSelected(null);
                    setSelectedType(null);
                    setShowModal(null);
                    setWelcomeDismissed(true);
                }
            };

            const autoLayout = () => {
                const tiers = { underlyingCause: 0, precondition: 1, immediateCause: 2, agent: 3, object: 3, event: 4 };
                const grouped = {};
                nodes.forEach(n => {
                    const t = tiers[n.type] || 0;
                    if (!grouped[t]) grouped[t] = [];
                    grouped[t].push(n);
                });
                const positioned = [];
                Object.keys(grouped).forEach((tier, i) => {
                    grouped[tier].forEach((n, j) => {
                        positioned.push({ ...n, x: 100 + (tier * 240), y: 100 + (j * 120) });
                    });
                });
                setNodes(positioned);
            };

            const deleteSelected = () => {
                if (selectedType === 'node') {
                    setNodes(nodes.filter(n => n.id !== selected.id));
                    setConnections(connections.filter(c => c.from !== selected.id && c.to !== selected.id));
                    const connIdsToRemove = connections.filter(c => c.from === selected.id || c.to === selected.id).map(c => c.id);
                    setBarriers(barriers.filter(b => !connIdsToRemove.includes(b.connectionId)));
                } else if (selectedType === 'connection') {
                    setConnections(connections.filter(c => c.id !== selected.id));
                    setBarriers(barriers.filter(b => b.connectionId !== selected.id));
                } else if (selectedType === 'barrier') {
                    setBarriers(barriers.filter(b => b.id !== selected.id));
                }
                setSelected(null);
                setSelectedType(null);
            };

            const updateSelected = (field, value) => {
                if (selectedType === 'node') {
                    setNodes(nodes.map(n => n.id === selected.id ? { ...n, [field]: value } : n));
                    setSelected({ ...selected, [field]: value });
                } else if (selectedType === 'barrier') {
                    setBarriers(barriers.map(b => b.id === selected.id ? { ...b, [field]: value } : b));
                    setSelected({ ...selected, [field]: value });
                }
            };

            const getConnectionPath = (conn) => {
                const from = nodes.find(n => n.id === conn.from);
                
                // Check if target is a barrier or a node
                let toX, toY;
                if (conn.toBarrier) {
                    // Find the barrier
                    const barrier = barriers.find(b => b.id === conn.toBarrier);
                    if (!barrier) return null;
                    
                    // Find the connection that barrier is on
                    const barrierConn = connections.find(c => c.id === barrier.connectionId);
                    if (!barrierConn) return null;
                    
                    // Get the barrier's parent connection endpoints
                    const barrierFrom = nodes.find(n => n.id === barrierConn.from);
                    const barrierTo = nodes.find(n => n.id === barrierConn.to);
                    if (!barrierFrom || !barrierTo) return null;
                    
                    // Calculate barrier CENTER position on its line
                    const bx1 = barrierFrom.x + barrierFrom.width;
                    const by1 = barrierFrom.y + barrierFrom.height / 2;
                    const bx2 = barrierTo.x;
                    const by2 = barrierTo.y + barrierTo.height / 2;
                    const bmx = (bx1 + bx2) / 2;
                    const t = barrier.linePosition || 0.5;
                    const barrierCenterX = (1-t)*(1-t)*(1-t)*bx1 + 3*(1-t)*(1-t)*t*bmx + 3*(1-t)*t*t*bmx + t*t*t*bx2;
                    const barrierCenterY = (1-t)*(1-t)*(1-t)*by1 + 3*(1-t)*(1-t)*t*by1 + 3*(1-t)*t*t*by2 + t*t*t*by2;
                    
                    // Determine connection point on barrier edge
                    const barrierHeight = 60;
                    const fromY = from.y + from.height / 2;
                    
                    // Connect to top or bottom edge based on source position
                    if (fromY < barrierCenterY) {
                        toX = barrierCenterX;
                        toY = barrierCenterY - barrierHeight/2; // Top edge
                    } else {
                        toX = barrierCenterX;
                        toY = barrierCenterY + barrierHeight/2; // Bottom edge
                    }
                } else {
                    // Normal node target
                    const to = nodes.find(n => n.id === conn.to);
                    if (!to) return null;
                    toX = to.x;
                    toY = to.y + to.height / 2;
                }
                
                if (!from) return null;

                const x1 = from.x + from.width;
                const y1 = from.y + from.height / 2;
                const x2 = toX;
                const y2 = toY;
                const mx = (x1 + x2) / 2;

                return { x1, y1, x2, y2, mx };
            };

            const findClosestConnection = (x, y) => {
                let closest = null;
                let minDist = 50; // Max distance to snap

                connections.forEach(conn => {
                    const from = nodes.find(n => n.id === conn.from);
                    const to = nodes.find(n => n.id === conn.to);
                    if (!from || !to) return;

                    // Check if this is Agent/Object -> Event connection
                    const fromType = from.type;
                    const toType = to.type;
                    if (!((fromType === 'agent' || fromType === 'object') && toType === 'event')) {
                        return;
                    }

                    const path = getConnectionPath(conn);
                    if (!path) return;

                    // Calculate point on bezier curve at t=0.5 (midpoint)
                    const t = 0.5;
                    const bx = (1-t)*(1-t)*(1-t)*path.x1 + 3*(1-t)*(1-t)*t*path.mx + 3*(1-t)*t*t*path.mx + t*t*t*path.x2;
                    const by = (1-t)*(1-t)*(1-t)*path.y1 + 3*(1-t)*(1-t)*t*path.y1 + 3*(1-t)*t*t*path.y2 + t*t*t*path.y2;

                    const dist = Math.sqrt((x - bx) ** 2 + (y - by) ** 2);
                    if (dist < minDist) {
                        minDist = dist;
                        closest = conn.id;
                    }
                });

                return closest;
            };

            const exportPDF = async () => {
                setExporting(true);
                try {
                    const svgElement = canvasRef.current;
                    if (!svgElement || nodes.length === 0) {
                        alert('No diagram to export');
                        setExporting(false);
                        return;
                    }

                    // Calculate diagram bounds
                    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
                    nodes.forEach(n => {
                        minX = Math.min(minX, n.x);
                        minY = Math.min(minY, n.y);
                        maxX = Math.max(maxX, n.x + n.width);
                        maxY = Math.max(maxY, n.y + n.height);
                    });
                    
                    const padding = 50;
                    minX -= padding;
                    minY -= padding;
                    maxX += padding;
                    maxY += padding;
                    const width = maxX - minX;
                    const height = maxY - minY;

                    // Create a temporary container with the SVG
                    const tempDiv = document.createElement('div');
                    tempDiv.style.position = 'absolute';
                    tempDiv.style.left = '-9999px';
                    tempDiv.style.top = '0';
                    tempDiv.style.width = width + 'px';
                    tempDiv.style.height = height + 'px';
                    tempDiv.style.background = 'white';
                    document.body.appendChild(tempDiv);

                    // Clone SVG
                    const svgClone = svgElement.cloneNode(true);
                    svgClone.setAttribute('viewBox', `${minX} ${minY} ${width} ${height}`);
                    svgClone.setAttribute('width', width);
                    svgClone.setAttribute('height', height);
                    svgClone.style.display = 'block';
                    
                    tempDiv.appendChild(svgClone);

                    // Use html2canvas to capture
                    if (!window.html2canvas) {
                        // Load html2canvas dynamically
                        const script = document.createElement('script');
                        script.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';
                        script.onload = () => {
                            captureAndCreatePDF();
                        };
                        script.onerror = () => {
                            document.body.removeChild(tempDiv);
                            alert('Failed to load html2canvas library');
                            setExporting(false);
                        };
                        document.head.appendChild(script);
                    } else {
                        captureAndCreatePDF();
                    }

                    function captureAndCreatePDF() {
                        window.html2canvas(tempDiv, {
                            backgroundColor: '#ffffff',
                            scale: 2,
                            logging: false,
                            allowTaint: true,
                            useCORS: true
                        }).then(canvas => {
                            try {
                                document.body.removeChild(tempDiv);
                                
                                const imgData = canvas.toDataURL('image/png');
                                const { jsPDF } = window.jspdf;
                                const doc = new jsPDF('landscape', 'mm', 'a4');
                                
                                // Header
                                doc.setFillColor(8, 145, 178);
                                doc.rect(0, 0, 297, 35, 'F');
                                doc.setTextColor(255, 255, 255);
                                doc.setFontSize(24);
                                doc.setFont('helvetica', 'bold');
                                doc.text('Tripod Beta Analysis', 148.5, 15, { align: 'center' });
                                doc.setFontSize(14);
                                doc.text(saveName || 'Incident Investigation', 148.5, 25, { align: 'center' });
                                
                                // Calculate size
                                const aspectRatio = width / height;
                                let imgWidth = 257;
                                let imgHeight = imgWidth / aspectRatio;
                                
                                if (imgHeight > 130) {
                                    imgHeight = 130;
                                    imgWidth = imgHeight * aspectRatio;
                                }
                                
                                const xPos = (297 - imgWidth) / 2;
                                const yPos = 45;
                                
                                doc.addImage(imgData, 'PNG', xPos, yPos, imgWidth, imgHeight);
                                
                                // Footer
                                doc.setFontSize(9);
                                doc.setTextColor(100, 116, 139);
                                doc.text(`Date: ${new Date().toLocaleDateString()} | Nodes: ${nodes.length} | Barriers: ${barriers.length}`, 148.5, 190, { align: 'center' });
                                
                                doc.save(`${saveName || 'tripod-analysis'}.pdf`);
                                setExporting(false);
                            } catch (err) {
                                console.error('PDF creation failed:', err);
                                alert('PDF export failed: ' + err.message);
                                setExporting(false);
                            }
                        }).catch(err => {
                            document.body.removeChild(tempDiv);
                            console.error('Canvas capture failed:', err);
                            alert('Failed to capture diagram: ' + err.message);
                            setExporting(false);
                        });
                    }
                } catch (err) {
                    console.error('PDF export failed:', err);
                    alert('PDF export failed: ' + err.message);
                    setExporting(false);
                }
            };

            const exportSVG = () => {
                try {
                    // Get the SVG element directly from the ref
                    const svgElement = canvasRef.current;
                    if (!svgElement || nodes.length === 0) {
                        alert('No diagram to export');
                        return;
                    }

                    // Clone the SVG to avoid modifying the original
                    const svgClone = svgElement.cloneNode(true);
                    
                    // Calculate bounding box of all elements
                    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
                    
                    nodes.forEach(n => {
                        minX = Math.min(minX, n.x);
                        minY = Math.min(minY, n.y);
                        maxX = Math.max(maxX, n.x + n.width);
                        maxY = Math.max(maxY, n.y + n.height);
                    });
                    
                    // Add padding
                    const padding = 50;
                    minX -= padding;
                    minY -= padding;
                    maxX += padding;
                    maxY += padding;
                    
                    const width = maxX - minX;
                    const height = maxY - minY;
                    
                    // Set viewBox to show only the content area
                    svgClone.setAttribute('viewBox', `${minX} ${minY} ${width} ${height}`);
                    svgClone.setAttribute('width', width);
                    svgClone.setAttribute('height', height);
                    
                    // Remove existing style attribute if any
                    svgClone.removeAttribute('style');
                    
                    // Add white background
                    const background = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
                    background.setAttribute('x', minX);
                    background.setAttribute('y', minY);
                    background.setAttribute('width', width);
                    background.setAttribute('height', height);
                    background.setAttribute('fill', 'white');
                    svgClone.insertBefore(background, svgClone.firstChild);
                    
                    // Serialize the SVG
                    const serializer = new XMLSerializer();
                    let svgString = serializer.serializeToString(svgClone);
                    
                    // Add XML declaration
                    svgString = '<?xml version="1.0" encoding="UTF-8" standalone="no"?>\n' + svgString;
                    
                    // Create blob and download
                    const blob = new Blob([svgString], { type: 'image/svg+xml;charset=utf-8' });
                    const url = URL.createObjectURL(blob);
                    const link = document.createElement('a');
                    link.href = url;
                    link.download = `${saveName || 'tripod-analysis'}.svg`;
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                    URL.revokeObjectURL(url);
                } catch (err) {
                    console.error('SVG export failed:', err);
                    alert('SVG export failed: ' + err.message);
                }
            };

            const printDiagram = (mode) => {
                try {
                    const svgElement = canvasRef.current;
                    if (!svgElement || nodes.length === 0) {
                        alert('No diagram to print');
                        return;
                    }

                    // Create a new window for printing
                    const printWindow = window.open('', '_blank');
                    if (!printWindow) {
                        alert('Please allow popups to enable printing');
                        return;
                    }

                    // Calculate diagram bounds based on mode
                    let minX, minY, maxX, maxY;
                    
                    if (mode === 'selected' && selectionRect) {
                        // Use selection rectangle bounds
                        minX = Math.min(selectionRect.x, selectionRect.x + selectionRect.width);
                        minY = Math.min(selectionRect.y, selectionRect.y + selectionRect.height);
                        maxX = Math.max(selectionRect.x, selectionRect.x + selectionRect.width);
                        maxY = Math.max(selectionRect.y, selectionRect.y + selectionRect.height);
                    } else {
                        // Calculate from all nodes
                        minX = Infinity;
                        minY = Infinity;
                        maxX = -Infinity;
                        maxY = -Infinity;
                        
                        nodes.forEach(n => {
                            minX = Math.min(minX, n.x);
                            minY = Math.min(minY, n.y);
                            maxX = Math.max(maxX, n.x + n.width);
                            maxY = Math.max(maxY, n.y + n.height);
                        });
                    }
                    
                    const padding = 50;
                    minX -= padding;
                    minY -= padding;
                    maxX += padding;
                    maxY += padding;
                    const width = maxX - minX;
                    const height = maxY - minY;

                    // Clone and prepare SVG
                    const svgClone = svgElement.cloneNode(true);
                    svgClone.setAttribute('viewBox', `${minX} ${minY} ${width} ${height}`);
                    svgClone.style.width = '100%';
                    svgClone.style.height = 'auto';

                    // Add white background
                    const background = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
                    background.setAttribute('x', minX);
                    background.setAttribute('y', minY);
                    background.setAttribute('width', width);
                    background.setAttribute('height', height);
                    background.setAttribute('fill', 'white');
                    svgClone.insertBefore(background, svgClone.firstChild);

                    const serializer = new XMLSerializer();
                    const svgString = serializer.serializeToString(svgClone);

                    // Write HTML to print window
                    printWindow.document.write(`
                        <!DOCTYPE html>
                        <html>
                        <head>
                            <title>${saveName || 'Tripod Beta Analysis'}</title>
                            <style>
                                @page {
                                    size: landscape;
                                    margin: 0.5in;
                                }
                                body {
                                    margin: 0;
                                    padding: 20px;

                                }
                                .header {
                                    text-align: center;

                                }
