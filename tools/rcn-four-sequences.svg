      <g id="edges-layer" transform="translate(-24.475903614457934,22.144578313252964) scale(1.1722891566265061)"><g id="edge-c1" style="cursor: grab; opacity: 1;"><title>📌 A diagnostic run that passes its own steps but fails Beauty, Good, Truth or Economy has not succeeded.</title><path d="M340,126.93629929221436 Q272.2,146.2 204.0783460282916,282" fill="none" stroke="#6B4C9A" stroke-width="2.6" marker-end="url(#mk6B4C9A)" pointer-events="none"/><text text-anchor="middle" pointer-events="none" transform="rotate(-48.8,272.2,157.3)"><tspan x="272.1692684471385" y="157.33414338693885" font-size="10" font-style="italic" fill="#6B4C9A">checks</tspan></text><circle cx="272.20238974051557" cy="145.3341890961957" r="4" fill="#f59e0b" stroke="#fff" stroke-width="1" pointer-events="none"/></g><g id="edge-c2" style="cursor: grab; opacity: 1;"><title>📌 Production work that is efficient and ugly, or effective and untrue to its ecology, fails here regardless of delivery.</title><path d="M494.07834602829166,138 Q562.2,273.8 635,294.48432760364005" fill="none" stroke="#6B4C9A" stroke-width="2.6" marker-end="url(#mk6B4C9A)" pointer-events="none"/><text text-anchor="middle" pointer-events="none" transform="rotate(48.0,562.6,263.0)"><tspan x="562.6386628176043" y="263.00623551604974" font-size="10" font-style="italic" fill="#6B4C9A">checks</tspan></text><circle cx="562.1513803579586" cy="274.9963379261429" r="4" fill="#f59e0b" stroke="#fff" stroke-width="1" pointer-events="none"/></g><g id="edge-c3" style="cursor: grab; opacity: 1;"><title>📌 What gets taught is what gets repeated. A curriculum that transmits skill without the governing models propagates harm faster.</title><path d="M448.88,138 Q364.4,330 448.88,522" fill="none" stroke="#6B4C9A" stroke-width="2.6" marker-end="url(#mk6B4C9A)" pointer-events="none"/><text text-anchor="middle" pointer-events="none" transform="rotate(90.0,388.6,330.0)"><tspan x="388.64" y="330" font-size="10" font-style="italic" fill="#6B4C9A">checks</tspan></text><circle cx="376.64" cy="330" r="4" fill="#f59e0b" stroke="#fff" stroke-width="1" pointer-events="none"/></g><g id="edge-r1" style="cursor: pointer; opacity: 1;"><title>📌 The conditional branch. Cynefin's typing selects which production sequence is entered — complicated goes one way, complex another. This is why ROUTES_TO is a third relation and not containment.</title><path d="M305,330 L635,330" fill="none" stroke="#8A5F10" stroke-width="3" marker-end="url(#mk8A5F10)" pointer-events="none"/><text text-anchor="middle" pointer-events="none"><tspan x="470" y="344" font-size="10" font-style="italic" fill="#8A5F10">ROUTES_TO</tspan></text><circle cx="470" cy="356" r="4" fill="#f59e0b" stroke="#fff" stroke-width="1" pointer-events="none"/></g><g id="edge-q1" style="cursor: grab; opacity: 1;"><title>📌 Transmissibility, not confidence. Whether anyone present is certified in the skills this pathway needs — read off the SODOTO registry's Active / Ready / Candidate.</title><path d="M445.9216539717084,522 Q377.8,386.2 305,365.51567239635995" fill="none" stroke="#2C5F8A" stroke-width="2.2" stroke-dasharray="8 5" marker-end="url(#mk2C5F8A)" pointer-events="none"/><text text-anchor="middle" pointer-events="none" transform="rotate(48.0,377.4,397.0)"><tspan x="377.3613371823957" y="396.9937644839503" font-size="10" font-style="italic" fill="#2C5F8A">qualifies</tspan></text><circle cx="377.84861964204146" cy="385.00366207385713" r="4" fill="#f59e0b" stroke="#fff" stroke-width="1" pointer-events="none"/></g><g id="edge-q2" style="cursor: grab; opacity: 1;"><title>📌 A production pathway whose skills have no mentor can be run by its author and nobody else. That is a skill, not a method.</title><path d="M600,533.0637007077856 Q667.8,513.8 735.9216539717083,378" fill="none" stroke="#2C5F8A" stroke-width="2.2" stroke-dasharray="8 5" marker-end="url(#mk2C5F8A)" pointer-events="none"/><text text-anchor="middle" pointer-events="none" transform="rotate(-48.8,667.8,502.7)"><tspan x="667.8307315528615" y="502.6658566130611" font-size="10" font-style="italic" fill="#2C5F8A">qualifies</tspan></text><circle cx="667.7976102594844" cy="514.6658109038043" r="4" fill="#f59e0b" stroke="#fff" stroke-width="1" pointer-events="none"/></g><g id="edge-y1" style="cursor: grab; opacity: 1;"><title>📌 Step 16 of the 15 Ps. A finished production run abstracts what is universal and publishes it, which adds a teachable skill back into the registry. This is how the shelf grows.</title><path d="M635,365.51567239635995 Q562.2,386.2 494.07834602829166,522" fill="none" stroke="#0E5A4B" stroke-width="2.2" stroke-dasharray="2 4" marker-end="url(#mk0E5A4B)" pointer-events="none"/><text text-anchor="middle" pointer-events="none" transform="rotate(-48.0,562.6,397.0)"><tspan x="562.6386628176043" y="396.99376448395026" font-size="10" font-style="italic" fill="#0E5A4B">Posterity → new pattern</tspan></text><circle cx="562.1513803579586" cy="385.0036620738571" r="4" fill="#f59e0b" stroke="#fff" stroke-width="1" pointer-events="none"/></g></g>
      <g id="nodes-layer" transform="translate(-24.475903614457934,22.144578313252964) scale(1.1722891566265061)"><g id="node-onto" transform="translate(470,90)" style="cursor: move; opacity: 1;"><title>📌 Social Action Tetrahedron · BGTE · Optimum Sequence · AIC.  —  Not performed. A claim about how persons, ideals, orgs and actions necessarily relate, and about what makes their relating come to good. You check yourself against it and find which relation has failed.</title><polygon points="112.6,24.0 0.0,48.0 -112.6,24.0 -112.6,-24.0 -0.0,-48.0 112.6,-24.0" fill="#F3EFFA" stroke="#6B4C9A" stroke-width="3.5"/><text text-anchor="middle" font-size="15" font-weight="500" fill="#2E1F4A" pointer-events="none"><tspan x="0" y="0.0">ONTOLOGICAL</tspan></text><circle cx="126" cy="-44" r="4" fill="#f59e0b" stroke="#fff" stroke-width="1" pointer-events="none"/></g><g id="node-diag" transform="translate(180,330)" style="cursor: move; opacity: 1;"><title>📌 Systemic Problem Solving · Cynefin · Six Nested Questions · Six Thinking Hats · DSRP.  —  A routing procedure. Takes an unclear situation and returns a type, a scale, and a decision about which production sequence to enter. The kind people most need and the kind least often written down.</title><rect x="-125" y="-48" width="250" height="96" rx="2" fill="#E2ECE7" stroke="#0E5A4B" stroke-width="3.5"/><text text-anchor="middle" font-size="15" font-weight="500" fill="#0B3B31" pointer-events="none"><tspan x="0" y="0.0">DIAGNOSTIC</tspan></text><circle cx="121" cy="-44" r="4" fill="#f59e0b" stroke="#fff" stroke-width="1" pointer-events="none"/></g><g id="node-prod" transform="translate(760,330)" style="cursor: move; opacity: 1;"><title>📌 15 Ps · Another Sequence of Tools · Vester SensiMod · System Discovery Process.  —  Ordered work with resources, handoffs and deliverables. Looks like conventional method documentation and is the least transferable — each is fitted to a domain.</title><rect x="-125" y="-48" width="250" height="96" rx="2" fill="#F3EBDA" stroke="#8A5F10" stroke-width="3"/><text text-anchor="middle" font-size="15" font-weight="500" fill="#513809" pointer-events="none"><tspan x="0" y="0.0">PRODUCTION</tspan></text><circle cx="121" cy="-44" r="4" fill="#f59e0b" stroke="#fff" stroke-width="1" pointer-events="none"/></g><g id="node-curr" transform="translate(470,570)" style="cursor: move; opacity: 1;"><title>📌 The six pathways already named in the SODOTO Skills Registry, plus the Systems Curriculum's four levels.  —  A learning progression is not a work progression. CLD then Stock Flow then System Dynamics then Vester is how you ACQUIRE the practice; nobody would run a project in that order. This is the kind SODOTO actually certifies.</title><rect x="-130" y="-48" width="260" height="96" rx="2" fill="#E7F0F7" stroke="#2C5F8A" stroke-width="3"/><text text-anchor="middle" font-size="15" font-weight="500" fill="#1B3B57" pointer-events="none"><tspan x="0" y="0.0">CURRICULAR</tspan></text><circle cx="126" cy="-44" r="4" fill="#f59e0b" stroke="#fff" stroke-width="1" pointer-events="none"/></g></g>
