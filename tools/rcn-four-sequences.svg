nt-family="system-ui,sans-serif" font-size="11" fill="#0f172a" dominant-baseline="central">checks</text><g transform="translate(12,0)"><line x1="0" y1="175" x2="36" y2="175" stroke="#8A5F10" stroke-width="3" marker-end="url(#mk8A5F10)"/></g><text x="58" y="175" font-family="system-ui,sans-serif" font-size="11" fill="#0f172a" dominant-baseline="central">ROUTES_TO</text><g transform="translate(12,0)"><line x1="0" y1="201" x2="36" y2="201" stroke="#2C5F8A" stroke-width="2.2" stroke-dasharray="8 5" marker-end="url(#mk2C5F8A)"/></g><text x="58" y="201" font-family="system-ui,sans-serif" font-size="11" fill="#0f172a" dominant-baseline="central">qualifies who may run it</text><g transform="translate(12,0)"><line x1="0" y1="227" x2="36" y2="227" stroke="#0E5A4B" stroke-width="2.2" stroke-dasharray="2 4" marker-end="url(#mk0E5A4B)"/></g><text x="58" y="227" font-family="system-ui,sans-serif" font-size="11" fill="#0f172a" dominant-baseline="central">yields a new pattern</text></g></g>
