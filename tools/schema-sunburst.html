<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RCN Schema Sunburst</title>
<!--
  schema-sunburst.html — the substrate's VOCABULARY as a ring diagram.

  Reads /projection/vocabulary from substrate/api.py (port 8768), which emits
  root → family → schemaLabel → variableLabel in graph-tool's native envelope,
  with `start` and `span` already computed. The renderer stays dumb: it turns
  fractions into arcs and knows nothing about the domain.

  WHAT THIS LENS CANNOT SHOW, BY CONSTRUCTION: the causal REL edges. A sunburst
  is a partition of a disc, so every child has exactly one parent and there is
  nowhere to draw a cycle. The fixes-that-fail loop lives in /projection/causal
  and graph-tool. Do not "improve" this by adding edges — the geometry will
  accept them and the picture will lie.

  Arc width is the WITNESS COUNT: how many of the drawings contain that
  concept. That is the gold test made visible — a fat arc is agreement, a
  sliver is one person's word. Toggle to equal slices to see the taxonomy
  alone, which is what the Python type-hierarchy diagram this borrows from does.

  Opened over file:// it falls back to a baked-in snapshot, so it works as a
  handout with no server. The snapshot says its own date in the footer; if it
  disagrees with the live database, the live database is right.
-->
<style>
  :root{
    --ink:#1a1a1a; --line:#1a1a1a; --surface:#f5f4f1; --panel:#fff;
    --muted:#5b5b57; --rule:#d8d6d0;
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--surface); color:var(--ink);
    font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;
  }
  header{
    display:flex; flex-wrap:wrap; gap:14px; align-items:center;
    padding:10px 16px; background:var(--panel); border-bottom:1px solid var(--rule);
    position:sticky; top:0; z-index:5;
  }
  header h1{font-size:15px; margin:0 8px 0 0; font-weight:650; letter-spacing:.01em}
  .ctl{display:flex; gap:6px; align-items:center; font-size:12.5px; color:var(--muted)}
  select,button{
    font:inherit; font-size:12.5px; padding:4px 9px; border-radius:6px;
    border:1px solid #bfbdb6; background:#fff; color:var(--ink); cursor:pointer;
  }
  button:hover{background:#eceae4}
  button.on{background:var(--ink); color:#fff; border-color:var(--ink)}
  #q{
    font:inherit; font-size:12.5px; padding:4px 9px; border-radius:6px;
    border:1px solid #bfbdb6; background:#fff; color:var(--ink); width:150px;
  }
  #q:focus{outline:none; border-color:#4338ca; box-shadow:0 0 0 2px rgba(67,56,202,.15)}
  #q.hit{border-color:#4338ca; background:#f5f3ff}
  #qn{font-size:11.5px; color:#4338ca; font-weight:600; min-width:52px}
  .docs a{font-size:12.5px; color:#4338ca; text-decoration:none;
          border-bottom:1px solid rgba(67,56,202,.35)}
  .docs a:hover{border-bottom-color:#4338ca}
  #status{margin-left:auto; font-size:12px; color:var(--muted)}
  #status.err{color:#b91c1c; font-weight:600}
  #wrap{display:flex; justify-content:center; padding:18px 12px 8px}
  svg{max-width:100%; height:auto; background:#fff; border-radius:10px;
      box-shadow:0 1px 3px rgba(0,0,0,.10)}
  .seg{cursor:default; transition:opacity .12s}
  .seg:hover{opacity:.78}
  text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif; fill:#1a1a1a;
       pointer-events:none; user-select:none}

  /* Near-transparent frosted glass, not an opaque card — the diagram has to
     stay readable underneath the thing describing it. */
  #tip{
    position:fixed; pointer-events:none; opacity:0; transition:opacity .12s;
    background:rgba(255,255,255,.55); backdrop-filter:blur(2px);
    -webkit-backdrop-filter:blur(2px);
    border:1px solid rgba(0,0,0,.14); border-radius:8px;
    padding:7px 10px; font-size:12.5px; color:#1a1a1a; max-width:290px;
    box-shadow:0 2px 10px rgba(0,0,0,.10); z-index:20; line-height:1.35;
  }
  #tip b{font-weight:650}
  #tip .k{color:#5b5b57}
  /* Which ring you are pointing at. Named, because the rings are LEVELS of the
     same idea and "which level am I looking at" is the question the geometry
     alone cannot answer. */
  #tip .r{display:block; font-size:10px; font-weight:700; letter-spacing:.07em;
          text-transform:uppercase; color:#4338ca; margin-bottom:3px}
  footer{padding:6px 18px 22px; font-size:11.5px; color:var(--muted); text-align:center}
  footer code{font-size:11px; background:#eceae4; padding:1px 4px; border-radius:3px}
</style>
</head>
<body>

<header>
  <h1>RCN Schema Sunburst</h1>
  <span class="ctl">graph
    <select id="db">
      <option value="aspects16">aspects16 — the 16 drawings</option>
      <option value="composite26">composite26 — signed EIP CLD</option>
      <option value="neo4j">neo4j — n=6 reference</option>
    </select>
  </span>
  <span class="ctl">arcs
    <button id="weighted" class="on" title="Arc width = in how many of this graph's source drawings the concept appears">sources</button>
    <button id="equal" title="Every concept gets the same slice">equal</button>
  </span>
  <span class="ctl">colour
    <button id="cfam" class="on" title="Fill by family — the vocabulary reading">family</button>
    <button id="copm" title="Fill by OPM Object / Process — things vs happenings">OPM</button>
  </span>
  <span class="ctl">rings
    <button id="r3" class="on" title="family → schema → variableLabel">3</button>
    <button id="r2" title="family → schema">2</button>
  </span>
  <span class="ctl">
    <input id="q" type="search" placeholder="find a concept…" autocomplete="off"
           title="Matches family, schema label and variable label. Esc clears.">
    <span id="qn"></span>
  </span>
  <button id="svg" title="Download as SVG">SVG</button>
  <button id="png" title="Download as PNG">PNG</button>
  <span class="ctl docs">
    <a href="schema-sunburst-intro.html">Intro</a>
    <a href="schema-sunburst-manual.html">Manual</a>
  </span>
  <span id="status">loading…</span>
</header>

<div id="wrap"></div>
<div id="tip"></div>
<footer id="foot"></footer>

c":"fam_person","tgt":"sch_Person","label":"","polarity":"none","width":1.5,"fontSize":10,"color":"#d55e00","curved":false,"props":{"rel":"CONTAINS"}},{"id":"v_sch_Person_var_Person_0","src":"sch_Person","tgt":"var_Person_0","label":"","polarity":"none","width":1.5,"fontSize":10,"color":"#d55e00","curved":false,"props":{"rel":"HAS_STATE"}}],"lines":[]}}/*__END__*/;
</script>

<script>
'use strict';

const CX = 500, CY = 500, PAD = 34;
const R0 = 96;                        // the hub
const BANDS = [[96,180],[180,306],[306,452]];   // family, schema, variable
const TAU = Math.PI * 2;

const S = { data:null, weighted:true, rings:3, db:'aspects16', live:false, stamp:'', q:'',
            colour:'family', sourceKind:'unknown' };

const $ = id => document.getElementById(id);
const status = (t, err) => { const e = $('status'); e.textContent = t; e.className = err ? 'err' : ''; };

// ── measuring, so radial labels wrap instead of running off the ring ──────
const MEAS = document.createElement('canvas').getContext('2d');
function width(txt, size, weight){
  MEAS.font = `${weight||400} ${size}px system-ui,-apple-system,"Segoe UI",sans-serif`;
  return MEAS.measureText(txt).width;
}
function clip(s, size, max, weight){           // a single word can outrun `max`
  if (width(s, size, weight) <= max) return s;
  let t = s;
  while (t.length > 1 && width(t + '…', size, weight) > max) t = t.slice(0, -1);
  return t + '…';
}
// Returns the lines, plus `cut` — true when the label had to be shortened.
// `cut` is what makes hover load-bearing instead of decorative: a shortened
// label MUST have somewhere to say the rest.
function wrap(txt, size, max, maxLines, weight){
  if (maxLines < 1) return Object.assign([], {cut:true});
  if (width(txt, size, weight) <= max) return Object.assign([txt], {cut:false});
  const words = txt.split(/\s+/), out = [];
  let line = '';
  for (const w of words){
    const t = line ? line + ' ' + w : w;
    if (line && width(t, size, weight) > max){ out.push(line); line = w; }
    else line = t;
  }
  if (line) out.push(line);
  let cut = false;
  if (out.length > maxLines){
    out.length = maxLines;
    out[maxLines - 1] = clip(out[maxLines - 1] + ' …', size, max, weight);
    cut = true;
  }
  for (let i = 0; i < out.length; i++){        // an unbreakable long word
    const c = clip(out[i], size, max, weight);
    if (c !== out[i]){ out[i] = c; cut = true; }
  }
  return Object.assign(out, {cut});
}

// OPM colours are graph-tool-v22's own (OPM_NODE_TYPES), so a Process looks
// the same in both tools. UNCLASSIFIED is deliberately NOT Object-coloured —
// "nobody has said yet" must not read as "we decided this is a thing".
const OPM = { Object:  {fill:'#bfdbfe', ring:'#1e3a8a'},
              Process: {fill:'#d1fae5', ring:'#064e3b'},
              null:    {fill:'#eceae4', ring:'#9a9890'} };
const opmOf = k => OPM[k] || OPM.null;

// ── geometry ─────────────────────────────────────────────────────────────
const ang = f => f * TAU - Math.PI / 2;       // 0 = twelve o'clock
const pt  = (r, a) => [CX + r * Math.cos(a), CY + r * Math.sin(a)];
const fx  = n => (Math.round(n * 100) / 100);

function arc(r0, r1, f0, f1){
  const a0 = ang(f0), a1 = ang(f1), big = (f1 - f0) > .5 ? 1 : 0;
  const [x0,y0] = pt(r1,a0), [x1,y1] = pt(r1,a1);
  const [x2,y2] = pt(r0,a1), [x3,y3] = pt(r0,a0);
  return `M${fx(x0)} ${fx(y0)}A${r1} ${r1} 0 ${big} 1 ${fx(x1)} ${fx(y1)}`
       + `L${fx(x2)} ${fx(y2)}A${r0} ${r0} 0 ${big} 0 ${fx(x3)} ${fx(y3)}Z`;
}
function ring(r, f0, f1, reverse){
  const a0 = ang(reverse ? f1 : f0), a1 = ang(reverse ? f0 : f1);
  const big = (f1 - f0) > .5 ? 1 : 0, sweep = reverse ? 0 : 1;
  const [x0,y0] = pt(r,a0), [x1,y1] = pt(r,a1);
  return `M${fx(x0)} ${fx(y0)}A${r} ${r} 0 ${big} ${sweep} ${fx(x1)} ${fx(y1)}`;
}
// Pale tints without a colour library: mix the family fill toward white.
function lighten(hex, amt){
  const n = parseInt(hex.slice(1), 16);
  const m = c => Math.round(c + (255 - c) * amt);
  return '#' + [m(n>>16 & 255), m(n>>8 & 255), m(n & 255)]
    .map(v => v.toString(16).padStart(2,'0')).join('');
}
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// ── the envelope → a tree ────────────────────────────────────────────────
function build(env){
  const by = {}; env.nodes.forEach(n => by[n.id] = n);
  const kids = {}; env.edges.forEach(e => (kids[e.src] = kids[e.src] || []).push(e.tgt));
  const fams = (kids.root || []).map(fid => {
    const f = by[fid];
    const cs = (kids[fid] || []).map(sid => {
      const s = by[sid];
      // Every ring-3 child is a STATE of this concept. One state is the common
      // case and looks exactly as it always did; several states split the arc.
      const states = (kids[sid] || []).map(v => by[v] && by[v].label).filter(Boolean);
      return { schema:s.props.schemaLabel || s.label,
               opmType: s.props.opmType || null,
               states: states.length ? states : [s.label],
               sources:s.props.sources, sourceList:s.props.sourceList || [],
               weight:s.props.weight };
    });
    return { name:f.label, color:f.props.color, fill:f.props.fill,
             weight:f.props.weight, kids:cs };
  });
  return { root:by.root, fams, note:env.modelNote, name:env.modelName };
}

// Recompute start/span. Weighted mode reproduces exactly what the server sent;
// equal mode gives every concept the same arc. Both are one loop, so the two
// readings can never drift apart.
function lay(fams, weighted){
  const w = k => weighted ? Math.max(k.weight, 1) : 1;
  const fw = f => f.kids.reduce((a,k) => a + w(k), 0);
  const total = fams.reduce((a,f) => a + fw(f), 0) || 1;
  let cur = 0;
  return fams.map(f => {
    const span = fw(f) / total, start = cur; cur += span;
    let inner = start;
    const kids = f.kids.map(k => {
      const ks = span * w(k) / (fw(f) || 1), s = inner; inner += ks;
      return Object.assign({}, k, { start:s, span:ks });
    });
    return Object.assign({}, f, { start, span, kids });
  });
}

// ── draw ─────────────────────────────────────────────────────────────────
function render(){
  const wrapEl = $('wrap');
  if (!S.data){ wrapEl.innerHTML = ''; return; }
  const outer = BANDS[S.rings - 1][1];
  const size = (outer + PAD) * 2, off = CX - outer - PAD;
  const fams = lay(S.data.fams, S.weighted);
  const parts = [];

  parts.push(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="${off} ${off} ${size} ${size}" `
    + `width="${size}" height="${size}" font-family="system-ui,-apple-system,&quot;Segoe UI&quot;,sans-serif">`);
  parts.push('<rect x="'+off+'" y="'+off+'" width="'+size+'" height="'+size+'" fill="#ffffff"/>');
  const defs = [];

  const seg = (d, fill, stroke, sw, meta, op) =>
    `<path class="seg" d="${d}" fill="${fill}" stroke="${stroke}" stroke-width="${sw}" `
    + `stroke-linejoin="round"${op < 1 ? ` opacity="${op}"` : ''} data-tip="${esc(meta)}"/>`;

  // ── search ────────────────────────────────────────────────────────────
  // Dim rather than remove. A sunburst's meaning is proportional — pull the
  // non-matches out and every remaining arc silently changes width, so the
  // picture would answer a question nobody asked. Everything keeps its place;
  // only the ink changes.
  const Q = S.q.trim().toLowerCase();
  const has = s => (s || '').toLowerCase().includes(Q);
  const famHit = f => has(f.name);
  const kidHit = (f, k) => !Q || famHit(f) || has(k.schema) || k.states.some(has);
  const anyHit = f => !Q || famHit(f) || f.kids.some(k => kidHit(f, k));
  const DIM = .12, DIMT = .16;
  let matches = 0;

  fams.forEach((f, fi) => {
    const fOn = anyHit(f), fOp = fOn ? 1 : DIM;
    // ring 1 — the family
    parts.push(seg(arc(BANDS[0][0], BANDS[0][1], f.start, f.start + f.span),
      f.fill, '#1a1a1a', 1.4,
      `<span class="r">Ring 1 · Family</span><b>${f.name}</b><br>`
      + `<span class="k">${f.kids.length} concepts · `
      + `${f.weight} source${f.weight === 1 ? '' : 's'}</span>`, fOp));

    f.kids.forEach(k => {
      const on = kidHit(f, k), op = on ? 1 : DIM;
      if (Q && on) matches++;
      const w = `${k.sources} source${k.sources === 1 ? '' : 's'}`;
      const inWhich = k.sourceList.length ? `<br><span class="k">in: ${k.sourceList.join(', ')}</span>` : '';
      // Ring 2 and ring 3 are the SAME concept at two levels, so each says which
      // level it is — otherwise the tooltips are identical and the reader cannot
      // tell which ring answered.
      const oc = opmOf(k.opmType);
      const fill2 = S.colour === 'opm' ? oc.fill : lighten(f.fill, .38);
      const fill3 = S.colour === 'opm' ? lighten(oc.fill, .45) : lighten(f.fill, .68);
      const opmLine = `<br><span class="k">${k.opmType || 'unclassified'}</span>`;
      parts.push(seg(arc(BANDS[1][0], BANDS[1][1], k.start, k.start + k.span),
        fill2, S.colour === 'opm' ? oc.ring : '#1a1a1a', S.colour === 'opm' ? 1.3 : .9,
        `<span class="r">Ring 2 · Concept</span><b>${k.schema}</b><br>`
        + `<span class="k">${f.name} · ${w}`
        + (k.states.length > 1 ? ` · ${k.states.length} states` : '') + `</span>${opmLine}${inWhich}`, op));
      // RING 3 BRANCHES — the states SPLIT the concept's arc between them.
      if (S.rings === 3){
        const vspan = k.span / k.states.length;
        k.states.forEach((st, j) => {
          parts.push(seg(arc(BANDS[2][0], BANDS[2][1],
              k.start + j * vspan, k.start + (j + 1) * vspan),
            fill3, '#1a1a1a', .9,
            `<span class="r">Ring 3 · State</span><b>${st}</b><br>`
            + `<span class="k">a state of ${k.schema} · ${f.name}`
            + (k.states.length > 1 ? ` · 1 of ${k.states.length}` : '') + `</span>`, op));
        });
      }
    });

    // the family boundary, drawn last and heavier so eight groups read as eight
    const [bx0, by0] = pt(BANDS[0][0], ang(f.start));
    const [bx1, by1] = pt(BANDS[S.rings - 1][1], ang(f.start));
    parts.push(`<line x1="${fx(bx0)}" y1="${fx(by0)}" x2="${fx(bx1)}" y2="${fx(by1)}" `
      + `stroke="${f.color}" stroke-width="2.4" stroke-linecap="round"`
      + `${fOn ? '' : ` opacity="${DIM}"`}/>`);
  });

  // ── labels, drawn over every arc so nothing is clipped by a neighbour ──
  fams.forEach((f, fi) => {
    const mid = f.start + f.span / 2, rm = (BANDS[0][0] + BANDS[0][1]) / 2;
    const arcLen = f.span * TAU * rm;
    const op = anyHit(f) ? 1 : DIMT;
    if (arcLen > width(f.name, 13, 650) + 14){
      // Wide enough to curve along the ring, like the reference diagram.
      const deg = mid * 360, bottom = deg > 90 && deg < 270;
      const id = 'fp' + fi;
      defs.push(`<path id="${id}" fill="none" d="${ring(rm + (bottom ? -5 : 4), f.start, f.start + f.span, bottom)}"/>`);
      parts.push(`<text font-size="13" font-weight="650" text-anchor="middle" `
        + `dy="${bottom ? 11 : 0}"${op < 1 ? ` opacity="${op}"` : ''}>`
        + `<textPath href="#${id}" startOffset="50%">${esc(f.name)}</textPath></text>`);
    } else {
      parts.push(radial(f.name, rm, mid, 12, BANDS[0][1] - BANDS[0][0] - 12, 2, 650, arcLen, op));
    }
  });

  fams.forEach(f => f.kids.forEach(k => {
    const mid = k.start + k.span / 2;
    const op = kidHit(f, k) ? 1 : DIMT;
    const rs = (BANDS[1][0] + BANDS[1][1]) / 2;
    parts.push(radial(k.schema, rs, mid, 11.5, BANDS[1][1] - BANDS[1][0] - 14, 2, 600,
      k.span * TAU * rs, op));
    if (S.rings === 3){
      const rv = (BANDS[2][0] + BANDS[2][1]) / 2;
      const vspan = k.span / k.states.length;
      k.states.forEach((st, j) => {
        parts.push(radial(st, rv, k.start + (j + .5) * vspan, 10,
          BANDS[2][1] - BANDS[2][0] - 12, 3, 400, vspan * TAU * rv, op));
      });
    }
  }));

  // the hub
  const rp = S.data.root.props;
  parts.push(`<circle class="seg" cx="${CX}" cy="${CY}" r="${R0}" fill="#93c5fd" `
    + `stroke="#1a1a1a" stroke-width="1.6" data-tip="${esc(
        `<span class="r">Hub · The substrate</span><b>${S.db}</b><br>`
      + `<span class="k">${rp.families} families · ${rp.concepts} concepts · `
      + `${rp.weight} source mentions</span>`)}"/>`);
  const hub = ['RCN Substrate', S.db, `${S.data.root.props.concepts} concepts`];
  hub.forEach((t, i) => parts.push(
    `<text x="${CX}" y="${CY}" text-anchor="middle" dy="${(i - 1) * 19 + 5}" `
    + `font-size="${i === 0 ? 15 : 12}" font-weight="${i === 0 ? 700 : 400}" `
    + `fill="${i === 2 ? '#33415580' : '#1a1a1a'}">${esc(t)}</text>`));

  parts.splice(1, 0, `<defs>${defs.join('')}</defs>`);
  parts.push('</svg>');
  wrapEl.innerHTML = parts.join('');

  const total = fams.reduce((a, f) => a + f.kids.length, 0);
  $('q').classList.toggle('hit', !!Q);
  $('qn').textContent = Q ? `${matches} of ${total}` : '';
  $('qn').style.color = (Q && !matches) ? '#b91c1c' : '#4338ca';
  hookTips();
}

// Text laid along the radius, flipped on the left so it never reads upside
// down. `max` is the RADIAL room; lines stack tangentially.
// `room` is the TANGENTIAL width of the slice at this radius. Lines stack
// tangentially, so it caps how many there can be. Without this the stack
// silently grows into the neighbouring slice — the label still looks fine on
// its own and the diagram quietly becomes unreadable at the thin end.
function radial(txt, r, midFrac, size, max, maxLines, weight, room, op){
  const a = ang(midFrac), deg = a * 180 / Math.PI;
  const flip = deg > 90 || deg < -90;
  const [x, y] = pt(r, a);
  const lh = size * 1.12;
  const fits = Math.floor((room - 2) / lh);
  const lines = wrap(txt, size, max, Math.min(maxLines, fits), weight);
  // Nothing legible fits. Say so with an ellipsis rather than an empty wedge,
  // so the reader knows there IS a label and that hovering will give it.
  if (!lines.length)
    return `<text transform="translate(${fx(x)} ${fx(y)}) rotate(${fx(flip ? deg + 180 : deg)})" `
      + `text-anchor="middle" font-size="${Math.min(size, Math.max(6, room - 2))}" `
      + `font-weight="${weight}" opacity="${.55 * (op == null ? 1 : op)}">…</text>`;
  const top = -(lines.length - 1) * lh / 2;
  const tspans = lines.map((l, i) =>
    `<tspan x="0" y="${fx(top + i * lh + size * .34)}">${esc(l)}</tspan>`).join('');
  return `<text transform="translate(${fx(x)} ${fx(y)}) rotate(${fx(flip ? deg + 180 : deg)})" `
    + `text-anchor="middle" font-size="${size}" font-weight="${weight}"`
    + `${op != null && op < 1 ? ` opacity="${op}"` : ''}>${tspans}</text>`;
}

// ── tooltip ──────────────────────────────────────────────────────────────
// Hover is not a nicety here — it is where a label goes when the wedge is too
// thin to hold it, so every segment carries its FULL text whether the ring
// showed it or not. Click pins it, because a touch screen has no hover and
// because a long label is hard to read while holding the mouse still.
let PINNED = null;
function hookTips(){
  const tip = $('tip');
  const show = (el, x, y) => {
    tip.innerHTML = el.dataset.tip;
    tip.style.opacity = 1;
    const r = tip.getBoundingClientRect();
    tip.style.left = Math.max(6, Math.min(x + 14, innerWidth - r.width - 10)) + 'px';
    tip.style.top  = Math.max(6, Math.min(y + 14, innerHeight - r.height - 10)) + 'px';
  };
  document.querySelectorAll('.seg').forEach(el => {
    el.addEventListener('mousemove', ev => { if (!PINNED) show(el, ev.clientX, ev.clientY); });
    el.addEventListener('mouseleave', () => { if (!PINNED) tip.style.opacity = 0; });
    el.addEventListener('click', ev => {
      ev.stopPropagation();
      PINNED = (PINNED === el) ? null : el;
      if (PINNED) show(el, ev.clientX, ev.clientY);
      else tip.style.opacity = 0;
    });
  });
  PINNED = null; tip.style.opacity = 0;
}
document.addEventListener('click', () => { PINNED = null; $('tip').style.opacity = 0; });

// ── export ───────────────────────────────────────────────────────────────
function svgText(){
  const el = document.querySelector('#wrap svg');
  return '<?xml version="1.0" encoding="UTF-8"?>\n' + el.outerHTML;
}
function save(blob, name){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
$('svg').onclick = () => save(new Blob([svgText()], {type:'image/svg+xml'}),
  `rcn-schema-sunburst-${S.db}.svg`);
$('png').onclick = () => {
  const el = document.querySelector('#wrap svg');
  const w = +el.getAttribute('width'), h = +el.getAttribute('height'), k = 2;
  const img = new Image();
  img.onload = () => {
    const c = document.createElement('canvas');
    c.width = w * k; c.height = h * k;
    const g = c.getContext('2d');
    g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height);
    g.drawImage(img, 0, 0, c.width, c.height);
    c.toBlob(b => save(b, `rcn-schema-sunburst-${S.db}.png`));
  };
  img.onerror = () => status('PNG export failed — use SVG', true);
  img.src = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svgText())));
};

// ── load ─────────────────────────────────────────────────────────────────
async function load(){
  status('loading…');
  const url = `/projection/vocabulary?db=${encodeURIComponent(S.db)}`;
  try {
    const r = await fetch(url, {cache:'no-store'});
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const env = await r.json();
    if (!env.nodes || !env.nodes.length) throw new Error('empty projection');
    S.data = build(env); S.live = true;
    // RESERVED, NOT DISABLED. Source-weighting means agreement only where the
    // sources are people. On a topic graph it means cross-cutting, which is a
    // different claim — so it is not the default there, and the label says which.
    S.sourceKind = (env.nodes[0].props || {}).sourceKind || 'unknown';
    applyKind();
    status(`live · ${S.data.root.props.concepts} concepts · sources are `
         + `${S.sourceKind === 'person' ? 'people' : S.sourceKind}`);
  } catch (e) {
    const fb = window.SUNBURST_FALLBACK;
    if (fb && fb[S.db]){
      S.data = build(fb[S.db]); S.live = false; S.stamp = fb._captured || '';
      status(`offline snapshot${S.stamp ? ' · ' + S.stamp : ''}`, true);
    } else {
      S.data = null;
      status(`no data for ${S.db} — start substrate/api.py`, true);
    }
  }
  render(); foot();
}
function foot(){
  $('foot').innerHTML = S.data
    ? (S.live
        ? 'Generated live from Neo4j by <code>/projection/vocabulary</code>. '
        : 'Baked-in snapshot — <code>python3 substrate/api.py</code> for the live graph. ')
      + 'Arc width = source count: in how many of this graph\u2019s source drawings the concept appears. '
      + 'Causal <code>REL</code> edges are not in this lens: '
      + 'a tree cannot hold a loop — see <code>/projection/causal</code>.'
    : 'Run <code>python3 substrate/api.py</code>, then open <code>http://localhost:8768/tools/schema-sunburst.html</code>.';
}

function applyKind(){
  const person = S.sourceKind === 'person';
  S.weighted = person;
  $('weighted').classList.toggle('on', person);
  $('equal').classList.toggle('on', !person);
  $('weighted').textContent = person ? 'sources' : 'cross-cutting';
  $('weighted').title = person
    ? 'Arc width = how many people recorded the concept. Here that is agreement.'
    : 'Arc width = in how many topic drawings the concept appears. That is reach, NOT agreement.';
}

const mode = (onId, offId, set) => {
  $(onId).onclick = () => { set(true);  $(onId).classList.add('on');  $(offId).classList.remove('on'); render(); };
  $(offId).onclick = () => { set(false); $(offId).classList.add('on'); $(onId).classList.remove('on');  render(); };
};
mode('weighted', 'equal', v => S.weighted = v);
mode('r3', 'r2', v => S.rings = v ? 3 : 2);
mode('cfam', 'copm', v => S.colour = v ? 'family' : 'opm');
$('db').onchange = e => { S.db = e.target.value; load(); };

$('q').addEventListener('input', e => { S.q = e.target.value; render(); });
$('q').addEventListener('keydown', e => {
  if (e.key === 'Escape'){ e.target.value = ''; S.q = ''; render(); }
});
// A search box that eats "/" is worse than no shortcut, so only grab the key
// when focus is not already in a field.
document.addEventListener('keydown', e => {
  if (e.key === '/' && document.activeElement !== $('q')
      && !/^(INPUT|SELECT|TEXTAREA)$/.test(document.activeElement.tagName)){
    e.preventDefault(); $('q').focus();
  }
});

const q = new URLSearchParams(location.search);
if (q.get('db')) { S.db = q.get('db'); $('db').value = S.db; }
load();
</script>
</body>
</html>
