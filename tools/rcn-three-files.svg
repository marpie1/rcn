refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,1 L10,5 L0,9 Z" fill="#8b5cf6"/></marker><marker id="mk7c3aed" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,1 L10,5 L0,9 Z" fill="#7c3aed"/></marker><marker id="mk0E5A4B" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,1 L10,5 L0,9 Z" fill="#0E5A4B"/></marker><marker id="mk8A5F10" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,1 L10,5 L0,9 Z" fill="#8A5F10"/></marker><marker id="mk2C5F8A" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,1 L10,5 L0,9 Z" fill="#2C5F8A"/></marker></defs>
      
      <g id="wardley-layer" transform="translate(-11.41869918699183,128.95732070818184) scale(0.7910569105691057)"/>
      <g id="lop-layer" transform="translate(-11.41869918699183,128.95732070818184) scale(0.7910569105691057)"/>
