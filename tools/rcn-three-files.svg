></g><text x="58" y="149" font-family="system-ui,sans-serif" font-size="11" fill="#0f172a" dominant-baseline="central">derives</text><g transform="translate(12,0)"><line x1="0" y1="175" x2="36" y2="175" stroke="#2C5F8A" stroke-width="2" stroke-dasharray="2 4" marker-end="url(#mk2C5F8A)"/></g><text x="58" y="175" font-family="system-ui,sans-serif" font-size="11" fill="#0f172a" dominant-baseline="central">projected into</text></g></g>
