      <g id="edges-layer" transform="translate(-11.41869918699183,128.95732070818184) scale(0.7910569105691057)"><g id="edge-f1" style="cursor: grab; opacity: 1;"><title>📌 A method names the skills it requires; the registry certifies them. This is the join between the pathway layer and the person layer.</title><path d="M588.2799157477289,69.64316292900068 Q440,4.400000000000006 291.7200842522712,69.64316292900068" fill="none" stroke="#0E5A4B" stroke-width="2.6" marker-end="url(#mk0E5A4B)" pointer-events="none"/><text text-anchor="middle" pointer-events="none"><tspan x="440" y="19.021581464500343" font-size="10" font-style="italic" fill="#0E5A4B">REQUIRES_SKILL</tspan></text><circle cx="440" cy="7.021581464500343" r="4" fill="#f59e0b" stroke="#fff" stroke-width="1" pointer-events="none"/></g><g id="edge-f2" style="cursor: grab; opacity: 1;"><title>📌 Each step names one tool. The tool is the instrument, not the point — the step's question is the point.</title><path d="M771.7200842522711,150.35683707099932 Q920,215.6 1068.2799157477289,150.35683707099932" fill="none" stroke="#0E5A4B" stroke-width="2.6" marker-end="url(#mk0E5A4B)" pointer-events="none"/><text text-anchor="middle" pointer-events="none"><tspan x="920" y="200.97841853549966" font-size="10" font-style="italic" fill="#0E5A4B">USES</tspan></text><circle cx="920" cy="212.97841853549966" r="4" fill="#f59e0b" stroke="#fff" stroke-width="1" pointer-events="none"/></g><g id="edge-f3" style="cursor: grab; opacity: 1;"><title>📌 A tool that IS a method wearing a tool's clothes — A3 Problem Solving, the eVSM cycle. Build it as a tool, give it a method page, and have the two point at each other.</title><path d="M1068.2799157477289,69.64316292900068 Q920,4.400000000000006 771.7200842522711,69.64316292900068" fill="none" stroke="#0E5A4B" stroke-width="2.6" marker-end="url(#mk0E5A4B)" pointer-events="none"/><text text-anchor="middle" pointer-events="none"><tspan x="920" y="19.021581464500343" font-size="10" font-style="italic" fill="#0E5A4B">EMBODIES</tspan></text><circle cx="920" cy="7.021581464500343" r="4" fill="#f59e0b" stroke="#fff" stroke-width="1" pointer-events="none"/></g><g id="edge-d1" style="cursor: grab; opacity: 1;"><title>📌 A Do One earns the first star. A Teach One whose learner then runs it earns the second — the method crossed a person boundary, which is the real test.</title><path d="M215.90633347652505,164.61689261680607 Q261.8,322.2 372.8568507157464,377" fill="none" stroke="#8A5F10" stroke-width="2.2" stroke-dasharray="8 5" marker-end="url(#mk8A5F10)" pointer-events="none"/><text text-anchor="middle" pointer-events="none" transform="rotate(53.5,268.5,311.7)"><tspan x="268.4527640644428" y="311.70647099728774" font-size="10" font-style="italic" fill="#8A5F10">Do One / Teach One</tspan></text><circle cx="262.0274094086928" cy="321.8413028926786" r="4" fill="#f59e0b" stroke="#fff" stroke-width="1" pointer-events="none"/></g><g id="edge-d2" style="cursor: grab; opacity: 1;"><title>📌 Active means at least one credential issued and the teaching chain begun. Ready means a mentor exists. Candidate means nominated, no mentor yet.</title><path d="M247.01812964316616,161.55643030425244 Q481.8,419 775,419.701099952176" fill="none" stroke="#8A5F10" stroke-width="2.2" stroke-dasharray="8 5" marker-end="url(#mk8A5F10)" pointer-events="none"/><text text-anchor="middle" pointer-events="none" transform="rotate(26.1,492.4,372.4)"><tspan x="492.410960445056" y="372.36577518561984" font-size="10" font-style="italic" fill="#8A5F10">mentor + chain</tspan></text><circle cx="489.7485791345656" cy="384.06670359996167" r="4" fill="#f59e0b" stroke="#fff" stroke-width="1" pointer-events="none"/></g><g id="edge-d3" style="cursor: grab; opacity: 1;"><title>📌 Written onto the method as a computed field, never authored. If attestation is high-friction nobody logs runs, and untested becomes indistinguishable from unlogged — that is the risk that would kill the whole signal.</title><path d="M531.8818011257035,377 Q638.2,313.4 668.7365570376721,164.80823680711705" fill="none" stroke="#8A5F10" stroke-width="2.2" stroke-dasharray="8 5" marker-end="url(#mk8A5F10)" pointer-events="none"/><text text-anchor="middle" pointer-events="none" transform="rotate(-57.2,631.2,305.6)"><tspan x="631.2337353840279" y="305.5870904584503" font-size="10" font-style="italic" fill="#8A5F10">marks</tspan></text><circle cx="639.2198326128172" cy="314.54377796289765" r="4" fill="#f59e0b" stroke="#fff" stroke-width="1" pointer-events="none"/></g><g id="edge-d4" style="cursor: grab; opacity: 1;"><title>📌 Also computed. Together the two axes expose different failures, which is why collapsing them would hide exactly what each is built to reveal.</title><path d="M891.1632251720747,377 Q858.2,216.6 755.9919980019083,155.45873730080484" fill="none" stroke="#8A5F10" stroke-width="2.2" stroke-dasharray="8 5" marker-end="url(#mk8A5F10)" pointer-events="none"/><text text-anchor="middle" pointer-events="none" transform="rotate(58.6,851.2,226.7)"><tspan x="851.1875238128699" y="226.65201494742885" font-size="10" font-style="italic" fill="#8A5F10">marks</tspan></text><circle cx="858.053335825786" cy="216.81023536224728" r="4" fill="#f59e0b" stroke="#fff" stroke-width="1" pointer-events="none"/></g><g id="edge-p1" style="cursor: grab; opacity: 1;"><title>📌 Skills and attestations become nodes and edges. The confidence query counts attestations by type and by NDC.</title><path d="M217.05869067202585,164.55914008212636 Q319,490.6 606.3498119592591,625.4394962490263" fill="none" stroke="#2C5F8A" stroke-width="2" stroke-dasharray="2 4" marker-end="url(#mk2C5F8A)" pointer-events="none"/><circle cx="344.4676855754029" cy="464.3366078556269" r="4" fill="#f59e0b" stroke="#fff" stroke-width="1" pointer-events="none"/></g><g id="edge-p2" style="cursor: grab; opacity: 1;"><title>📌 Pathways become ordered step chains. HANDS_OFF_TO edges are what a shortest-path query traverses.</title><path d="M656.1796933253338,164.13706062424146 Q559,385 660.4871065087182,615.6525147925413" fill="none" stroke="#2C5F8A" stroke-width="2" stroke-dasharray="2 4" marker-end="url(#mk2C5F8A)" pointer-events="none"/><circle cx="578.7030561478498" cy="385.97089475574984" r="4" fill="#f59e0b" stroke="#fff" stroke-width="1" pointer-events="none"/></g><g id="edge-p3" style="cursor: grab; opacity: 1;"><title>📌 Tools become nodes. 'What methods use this tool' stops being a script and becomes one hop.</title><path d="M1071.4948073300047,151.53124553544927 Q799,279.4 693.9657529275211,615.3330624855923" fill="none" stroke="#2C5F8A" stroke-width="2" stroke-dasharray="2 4" marker-end="url(#mk2C5F8A)" pointer-events="none"/><circle cx="822.0552555856779" cy="308.04540637094124" r="4" fill="#f59e0b" stroke="#fff" stroke-width="1" pointer-events="none"/></g></g>
      <g id="nodes-layer" transform="translate(-11.41869918699183,128.95732070818184) scale(0.7910569105691057)"><g id="node-reg" transform="translate(200,110)" style="cursor: move; opacity: 1;"><title>📌 v0.1 · 31 skills · 1 live credential. What a person can be certified in.  —  Already exists, dated 1 March 2026, on Models for Seeing Systems. Causal Loop Diagramming is Active — first mentor Kerry Turner, first credential Marc Pierson, 10 December 2025. The most developed of the three files, so it seeds the others rather than being replaced.</title><ellipse cx="0" cy="-46" rx="135" ry="9" fill="#ffffff" stroke="#0E5A4B" stroke-width="3"/><rect x="-135" y="-46" width="270" height="101" fill="#ffffff" stroke="none"/><line x1="-135" y1="-46" x2="-135" y2="55" stroke="#0E5A4B" stroke-width="3"/><line x1="135" y1="-46" x2="135" y2="55" stroke="#0E5A4B" stroke-width="3"/><ellipse cx="0" cy="55" rx="135" ry="9" fill="#ffffff" stroke="#0E5A4B" stroke-width="3"/><text text-anchor="middle" font-size="14" font-weight="500" fill="#0B3B31" pointer-events="none"><tspan x="0" y="0.0">SODOTO Registry SKILLS</tspan></text><circle cx="131" cy="-51" r="4" fill="#f59e0b" stroke="#fff" stroke-width="1" pointer-events="none"/></g><g id="node-meth" transform="translate(680,110)" style="cursor: move; opacity: 1;"><title>📌 Ordered uses of tools. Each step carries question, gate and handoff; each method carries a fallback.  —  Sequence lives here and nowhere else, because a hammer is used in many processes and does a different job in each. Steps carry the question they answer, any gate that must hold first, and the handoff to the next step.</title><ellipse cx="0" cy="-46" rx="135" ry="9" fill="#ffffff" stroke="#0E5A4B" stroke-width="3"/><rect x="-135" y="-46" width="270" height="101" fill="#ffffff" stroke="none"/><line x1="-135" y1="-46" x2="-135" y2="55" stroke="#0E5A4B" stroke-width="3"/><line x1="135" y1="-46" x2="135" y2="55" stroke="#0E5A4B" stroke-width="3"/><ellipse cx="0" cy="55" rx="135" ry="9" fill="#ffffff" stroke="#0E5A4B" stroke-width="3"/><text text-anchor="middle" font-size="14" font-weight="500" fill="#0B3B31" pointer-events="none"><tspan x="0" y="0.0">methods.json PATHWAYS</tspan></text><circle cx="131" cy="-51" r="4" fill="#f59e0b" stroke="#fff" stroke-width="1" pointer-events="none"/></g><g id="node-cat" transform="translate(1160,110)" style="cursor: move; opacity: 1;"><title>📌 id · what · shelf · status · launch · intro · manual · example · deck. What you can open.  —  No methods field. A tool cannot carry sequence. Shelving is a property here, not a folder on disk, because one tool sits on several shelves — the Graph Tool answers Why, How-strategy and How-mechanism.</title><ellipse cx="0" cy="-46" rx="135" ry="9" fill="#ffffff" stroke="#0E5A4B" stroke-width="3"/><rect x="-135" y="-46" width="270" height="101" fill="#ffffff" stroke="none"/><line x1="-135" y1="-46" x2="-135" y2="55" stroke="#0E5A4B" stroke-width="3"/><line x1="135" y1="-46" x2="135" y2="55" stroke="#0E5A4B" stroke-width="3"/><ellipse cx="0" cy="55" rx="135" ry="9" fill="#ffffff" stroke="#0E5A4B" stroke-width="3"/><text text-anchor="middle" font-size="14" font-weight="500" fill="#0B3B31" pointer-events="none"><tspan x="0" y="0.0">catalog.json TOOLS</tspan></text><circle cx="131" cy="-51" r="4" fill="#f59e0b" stroke="#fff" stroke-width="1" pointer-events="none"/></g><g id="node-conf" transform="translate(460,420)" style="cursor: move; opacity: 1;"><title>📌 Values: two stars, one star, none, retired.  —  Derived from Do One and Teach One attestations on the method itself. Because a star is computed from signed credentials it cannot be talked up. Zero stars is a normal, publishable state.</title><rect x="-115" y="-43" width="230" height="86" rx="10" fill="#F3EBDA" stroke="#8A5F10" stroke-width="2.5"/><text text-anchor="middle" font-size="14" font-weight="500" fill="#513809" pointer-events="none"><tspan x="0" y="0.0">CONFIDENCE</tspan></text><circle cx="111" cy="-39" r="4" fill="#f59e0b" stroke="#fff" stroke-width="1" pointer-events="none"/></g><g id="node-trans" transform="translate(900,420)" style="cursor: move; opacity: 1;"><title>📌 Values: Active, Ready, Candidate.  —  Marc's own axis, five months older than the star scheme. Read off whether the method's constituent skills have mentors and teaching chains. Orthogonal to confidence: a method can be proven and untransmissible, or teachable and untested.</title><rect x="-125" y="-43" width="250" height="86" rx="10" fill="#F3EBDA" stroke="#8A5F10" stroke-width="2.5"/><text text-anchor="middle" font-size="14" font-weight="500" fill="#513809" pointer-events="none"><tspan x="0" y="0.0">TRANSMISSIBILITY</tspan></text><circle cx="121" cy="-39" r="4" fill="#f59e0b" stroke="#fff" stroke-width="1" pointer-events="none"/></g><g id="node-neo" transform="translate(680,660)" style="cursor: move; opacity: 1;"><title>📌 Queries it makes cheap: derived back-links, impact analysis before a rename, gap-finding, path-finding, confidence, staleness.  —  If the database is down the storefront still works and the handout still opens. Nothing load-bearing sits only in the graph. Same arrangement as the SODOTO projector.</title><rect x="-115" y="-45" width="230" height="90" rx="14" fill="#EEF1F5" stroke="#2C5F8A" stroke-width="2.5"/><line x1="-97" y1="-45" x2="-97" y2="45" stroke="#2C5F8A" stroke-width="1" opacity=".35"/><line x1="97" y1="-45" x2="97" y2="45" stroke="#2C5F8A" stroke-width="1" opacity=".35"/><text text-anchor="middle" font-size="14" font-weight="500" fill="#1B3B57" pointer-events="none"><tspan x="0" y="0.0">Neo4j</tspan></text><circle cx="111" cy="-41" r="4" fill="#f59e0b" stroke="#fff" stroke-width="1" pointer-events="none"/></g></g>
