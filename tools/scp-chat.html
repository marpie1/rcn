<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prepare for Your Appointment — SCP Chat</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: system-ui, -apple-system, sans-serif;
  font-size: 15px;
  background: #f8f9fa;
  color: #1a1a2e;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* ── Header ─────────────────────────────────────────────────── */
#header {
  background: #1e3a5f;
  color: #fff;
  padding: 10px 14px 9px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  gap: 10px;
}
#header-text { flex: 1; min-width: 0; }
#header h1 {
  font-size: 1rem;
  font-weight: 600;
  letter-spacing: .02em;
}
#patient-label {
  font-size: .78rem;
  color: rgba(255,255,255,.7);
  margin-top: 2px;
}
#print-btn {
  flex-shrink: 0;
  background: rgba(255,255,255,.15);
  color: #fff;
  border: 1px solid rgba(255,255,255,.3);
  border-radius: 5px;
  padding: 5px 11px;
  font-size: .78rem;
  cursor: pointer;
  white-space: nowrap;
  transition: background .15s;
}
#print-btn:hover { background: rgba(255,255,255,.28); }
#print-btn:disabled { opacity: .4; cursor: default; }

/* ── Disclaimer ─────────────────────────────────────────────── */
#disclaimer {
  background: #fff3cd;
  border-bottom: 1px solid #ffc107;
  color: #664d03;
  font-size: .72rem;
  padding: 6px 14px;
  line-height: 1.4;
  flex-shrink: 0;
}

/* ── Messages ────────────────────────────────────────────────── */
#messages {
  flex: 1;
  overflow-y: auto;
  padding: 16px 12px 8px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.msg {
  max-width: 82%;
  line-height: 1.5;
  font-size: .9rem;
}
.msg-user {
  align-self: flex-end;
  background: #2563eb;
  color: #fff;
  border-radius: 16px 16px 4px 16px;
  padding: 9px 14px;
}
.msg-assistant {
  align-self: flex-start;
  background: #fff;
  border: 1px solid #e5e7eb;
  border-radius: 4px 16px 16px 16px;
  padding: 10px 14px;
  color: #1a1a2e;
  box-shadow: 0 1px 3px rgba(0,0,0,.06);
  white-space: pre-wrap;
  word-break: break-word;
}
.msg-assistant em { color: #6b7280; font-style: italic; }

.msg-system {
  align-self: center;
  font-size: .75rem;
  color: #9ca3af;
  font-style: italic;
  text-align: center;
  padding: 2px 0;
}

/* ── Typing indicator ──────────────────────────────────────── */
#typing {
  align-self: flex-start;
  display: none;
  padding: 10px 14px;
  background: #fff;
  border: 1px solid #e5e7eb;
  border-radius: 4px 16px 16px 16px;
  box-shadow: 0 1px 3px rgba(0,0,0,.06);
}
#typing span {
  display: inline-block;
  width: 7px; height: 7px;
  border-radius: 50%;
  background: #94a3b8;
  animation: bounce 1.2s infinite;
  margin: 0 2px;
}
#typing span:nth-child(2) { animation-delay: .2s; }
#typing span:nth-child(3) { animation-delay: .4s; }
@keyframes bounce {
  0%, 80%, 100% { transform: translateY(0); }
  40%           { transform: translateY(-6px); }
}

/* ── Input area ──────────────────────────────────────────────── */
#input-area {
  display: flex;
  gap: 8px;
  padding: 10px 12px;
  background: #fff;
  border-top: 1px solid #e5e7eb;
  flex-shrink: 0;
}
#input {
  flex: 1;
  font: inherit;
  font-size: .9rem;
  border: 1px solid #d1d5db;
  border-radius: 20px;
  padding: 9px 14px;
  resize: none;
  outline: none;
  min-height: 42px;
  max-height: 120px;
  line-height: 1.4;
  overflow-y: auto;
  color: inherit;
}
#input:focus { border-color: #2563eb; }
#send-btn {
  align-self: flex-end;
  background: #2563eb;
  color: #fff;
  border: none;
  border-radius: 50%;
  width: 42px; height: 42px;
  font-size: 1.1rem;
  cursor: pointer;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background .15s;
}
#send-btn:hover { background: #1d4ed8; }
#send-btn:disabled { background: #93c5fd; cursor: default; }

/* ── Status / loading ────────────────────────────────────────── */
#status {
  font-size: .75rem;
  color: #6b7280;
  text-align: center;
  padding: 4px;
  flex-shrink: 0;
  min-height: 20px;
}

/* ── Loading screen ──────────────────────────────────────────── */
#loading-screen {
  position: fixed;
  inset: 0;
  background: #f8f9fa;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 16px;
  z-index: 100;
}
#loading-screen p { color: #6b7280; font-size: .88rem; }
.spinner {
  width: 36px; height: 36px;
  border: 3px solid #e5e7eb;
  border-top-color: #2563eb;
  border-radius: 50%;
  animation: spin .8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div id="loading-screen">
  <div class="spinner"></div>
  <p id="loading-msg">Loading your Shared Care Plan…</p>
</div>

<div id="header">
  <div id="header-text">
    <h1>Prepare for Your Appointment</h1>
    <div id="patient-label">Loading…</div>
  </div>
  <button id="print-btn" disabled title="Print conversation">&#128438; Print</button>
</div>

<div id="disclaimer">
  &#9432; Claude is an AI assistant — not a doctor. Use this conversation to organize your thoughts and questions. Always rely on your care team for medical decisions.
</div>

<div id="messages"></div>
<div id="typing"><span></span><span></span><span></span></div>

<div id="input-area">
  <textarea id="input" rows="1" placeholder="Type your message…"></textarea>
  <button id="send-btn" disabled title="Send">&#9658;</button>
</div>
<div id="status"></div>

<script>
(function () {
  'use strict';

  var PROXY = 'http://localhost:8765';
  var MODEL = 'claude-sonnet-4-6';

  // ── SCP page definitions (mirrors PREVISIT_SECTIONS) ──────────────
  var SECTIONS = [
    { key: 'about',      label: 'Patient',               page: 'about-me',            type: 'scp-about',      limit: 1 },
    { key: 'vitals',     label: 'Recent Vitals',          page: 'vitals',              type: 'scp-vital',      limit: 4 },
    { key: 'diagnoses',  label: 'Active Diagnoses',       page: 'diagnoses',           type: 'scp-diagnosis'            },
    { key: 'next-steps', label: 'Care Plan / Next Steps', page: 'next-steps',          type: 'scp-next-step'            },
    { key: 'symptoms',   label: 'Current Symptoms',       page: 'symptoms',            type: 'scp-symptom',    limit: 3 },
    { key: 'providers',  label: 'Medical Providers',      page: 'providers',           type: 'scp-provider'             },
    { key: 'care-team',  label: 'Care Team',              page: 'care-team',           type: 'scp-care-member'          },
    { key: 'medications',label: 'Medications',            page: 'medications',         type: 'scp-medication'           },
    { key: 'visits',     label: 'Recent Provider Visits', page: 'visits',              type: 'scp-visit'                },
    { key: 'allergies',  label: 'Allergies & Reactions',  page: 'allergies-reactions', type: 'scp-reaction'             },
    { key: 'history',    label: 'Medical History',        page: 'medical-history',     type: 'scp-history'              },
    { key: 'directives', label: 'Medical Directives',     page: 'medical-directives',  type: 'scp-directive'            },
  ];

  // ── Fetch a FedWiki page via proxy ─────────────────────────────────
  function fetchPage(slug) {
    return fetch(PROXY + '/api/wiki-read-page?site=localhost&slug=' + encodeURIComponent(slug))
      .then(function (r) { return r.ok ? r.json() : null; })
      .catch(function () { return null; });
  }

  // ── Item filters (same logic as previsit) ──────────────────────────
  function secItems(sec, pageData) {
    var data = pageData[sec.page];
    if (!data || !data.story) return [];
    var items = data.story.filter(function (i) {
      return i.type === sec.type && i.committed;
    });
    if (sec.key === 'diagnoses') items = items.filter(function (i) { return i.status === 'Active'; });
    if (sec.key === 'next-steps') items = items.filter(function (i) { return i.status !== 'Done'; });
    if (sec.key === 'visits') {
      var cutoff = new Date(); cutoff.setMonth(cutoff.getMonth() - 3);
      var recent = items.filter(function (i) { return i.date && new Date(i.date) >= cutoff; });
      return recent.length >= 3 ? recent : items.slice(0, 3);
    }
    if (sec.limit) items = items.slice(0, sec.limit);
    return items;
  }

  function age(dob) {
    if (!dob) return '';
    var d = new Date(dob), now = new Date();
    if (isNaN(d)) return '';
    var a = now.getFullYear() - d.getFullYear();
    if (now.getMonth() < d.getMonth() ||
        (now.getMonth() === d.getMonth() && now.getDate() < d.getDate())) a--;
    return a;
  }

  // ── Build plain-text system prompt ─────────────────────────────────
  function buildSystemPrompt(pageData) {
    var today = new Date().toLocaleDateString('en-US',
      { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });

    var lines = [];

    function line(label, val) {
      if (val == null || val === '') return;
      lines.push('  ' + label + ': ' + String(val));
    }
    function nl() { lines.push(''); }

    // Patient info
    var aboutPage = pageData['about-me'];
    var patientName = 'the patient';
    var aboutItem = null;
    if (aboutPage && aboutPage.story) {
      aboutItem = aboutPage.story.find(function (i) {
        return i.type === 'scp-about' && i.committed;
      });
      if (aboutItem) patientName = aboutItem.preferred_name || aboutItem.legal_name || 'the patient';
    }

    lines.push('SHARED CARE PLAN — ' + today);
    nl();

    // Pre-visit intent — reason and topics the patient flagged before this visit
    var pvPage = pageData['pre-visit-summary'];
    if (pvPage && pvPage.story) {
      var pvItem = pvPage.story.find(function (i) { return i.type === 'scp-previsit'; });
      if (pvItem && (pvItem.reason_for_visit || (pvItem.visit_topics && pvItem.visit_topics.length))) {
        lines.push('TODAY\'S VISIT');
        if (pvItem.reason_for_visit) line('Reason for visit', pvItem.reason_for_visit);
        if (pvItem.visit_topics && pvItem.visit_topics.length)
          line('Topics to discuss', pvItem.visit_topics.join(', '));
        nl();
      }
    }

    if (aboutItem) {
      var a = aboutItem;
      var ag = age(a.dob);
      lines.push('PATIENT INFORMATION');
      line('Name', a.preferred_name || a.legal_name);
      if (a.preferred_name && a.legal_name && a.preferred_name !== a.legal_name)
        line('Legal Name', a.legal_name);
      line('Age', ag ? ag + ' years  (DOB: ' + a.dob + ')' : a.dob);
      line('Pronouns', a.pronouns);
      line('Preferred Language', a.language);
      line('Phone', a.phone);
      if (a.emergency_contact)
        line('Emergency Contact', a.emergency_contact + (a.emergency_phone ? ' — ' + a.emergency_phone : ''));
      nl();
    }

    SECTIONS.forEach(function (sec) {
      if (sec.key === 'about') return; // already handled
      var items = secItems(sec, pageData);
      lines.push(sec.label.toUpperCase());
      if (!items.length) { lines.push('  (none recorded)'); nl(); return; }

      items.forEach(function (i) {
        switch (sec.type) {
          case 'scp-vital':
            var val = (i.value || '') + (i.unit ? ' ' + i.unit : '');
            var when = (i.date || '') + (i.time ? ' ' + i.time : '');
            lines.push('  • ' + (i.measurement || 'Vital') + ': ' + val + (when ? '  (' + when + ')' : ''));
            break;

          case 'scp-diagnosis':
            var meta = [i.status, i.icd_code ? 'ICD: ' + i.icd_code : '', i.diagnosed_date ? 'Dx: ' + i.diagnosed_date : ''].filter(Boolean).join(', ');
            lines.push('  • ' + (i.condition || 'Diagnosis') + (meta ? '  [' + meta + ']' : ''));
            if (i.notes) lines.push('    Notes: ' + i.notes);
            break;

          case 'scp-next-step':
            var who = i.who ? ' — ' + i.who : '';
            var by  = i.by_when ? ' by ' + i.by_when : '';
            var st  = i.status ? ' (' + i.status + ')' : '';
            lines.push('  • ' + (i.action || '') + who + by + st);
            if (i.notes) lines.push('    Notes: ' + i.notes);
            break;

          case 'scp-symptom':
            var smeta = [i.severity, i.duration ? 'Duration: ' + i.duration : '', i.date].filter(Boolean).join(', ');
            lines.push('  • ' + (i.symptom || 'Symptom') + (smeta ? '  [' + smeta + ']' : ''));
            if (i.action_taken) lines.push('    Action taken: ' + i.action_taken);
            break;

          case 'scp-provider':
            var prole = [i.role, i.specialty].filter(Boolean).join(' / ');
            lines.push('  • ' + (i.name || 'Provider') + (prole ? '  — ' + prole : ''));
            if (i.phone) lines.push('    Phone: ' + i.phone + (i.when_to_call ? ' (' + i.when_to_call + ')' : ''));
            break;

          case 'scp-care-member':
            var crole = i.role === 'Other' ? (i.other_role || 'Other') : (i.role || '');
            lines.push('  • ' + (i.name || 'Care Member') + (crole ? '  — ' + crole : ''));
            if (i.phone) lines.push('    Phone: ' + i.phone);
            if (i.notes) lines.push('    Notes: ' + i.notes);
            break;

          case 'scp-medication':
            var mmeta = [i.med_type, i.prescribed_by ? 'Rx: ' + i.prescribed_by : '', i.started ? 'Started: ' + i.started : ''].filter(Boolean).join(', ');
            lines.push('  • ' + (i.label || 'Medication') + (mmeta ? '  [' + mmeta + ']' : ''));
            if (i.directions) lines.push('    Directions: ' + i.directions);
            if (i.timing && i.timing.length) lines.push('    Timing: ' + i.timing.join(', '));
            if (i.not_prescribed) lines.push('    ⚠ Not as prescribed: ' + i.not_prescribed);
            break;

          case 'scp-visit':
            lines.push('  • ' + (i.date || '') + '  ' + (i.provider || '') + (i.provider_type ? ' (' + i.provider_type + ')' : ''));
            if (i.visit_type) lines.push('    Type: ' + i.visit_type);
            if (i.reason)     lines.push('    Reason: ' + i.reason);
            if (i.outcome)    lines.push('    Outcome: ' + i.outcome);
            if (i.follow_up)  lines.push('    Follow-up: ' + i.follow_up);
            break;

          case 'scp-reaction':
            var rdet = [i.severity, i.reaction].filter(Boolean).join(': ');
            lines.push('  • ' + (i.substance || 'Substance') + (rdet ? '  — ' + rdet : ''));
            if (i.notes) lines.push('    Notes: ' + i.notes);
            break;

          case 'scp-history':
            var hmeta = [i.date, i.provider].filter(Boolean).join(', ');
            lines.push('  • ' + (i.event || 'Event') + (hmeta ? '  [' + hmeta + ']' : ''));
            if (i.notes) lines.push('    Notes: ' + i.notes);
            break;

          case 'scp-directive':
            lines.push('  • ' + (i.directive_type || 'Directive') + (i.date_signed ? ' — Signed ' + i.date_signed : ''));
            if (i.details)           lines.push('    Details: ' + i.details);
            if (i.proxy_name)        lines.push('    Proxy: ' + i.proxy_name + (i.proxy_phone ? ' — ' + i.proxy_phone : ''));
            if (i.document_location) lines.push('    Document: ' + i.document_location);
            break;
        }
      });
      nl();
    });

    var record = lines.join('\n');

    // Build topic instruction if topics were checked
    var pvPage = pageData['pre-visit-summary'];
    var pvItem = pvPage && pvPage.story && pvPage.story.find(function (i) { return i.type === 'scp-previsit'; });
    var hasTopics = pvItem && pvItem.visit_topics && pvItem.visit_topics.length;
    var topicInstruction = hasTopics
      ? 'The patient has flagged specific Visit Topics for today (shown at the top of the care plan). ' +
        'Make sure every checked topic gets covered in your prep conversation — do not let any of them drop. ' +
        'For each topic, draw on the relevant parts of the care plan (e.g. if they checked Pain Management, look at their symptom and medication records). ' +
        'You can address topics in whatever order feels natural, but before the conversation ends, confirm each one has been discussed.\n\n'
      : '';

    return 'You are a compassionate health companion helping ' + patientName + ' prepare for a medical appointment. You have access to their Shared Care Plan — a patient-centered health record they maintain with their care team.\n\n' +
      'Your role:\n' +
      '• Help them organize their thoughts and questions for the appointment\n' +
      '• Explain items in their care plan in plain, friendly language\n' +
      '• Notice patterns or things worth bringing up with their provider\n' +
      '• Help them feel prepared and confident\n\n' +
      topicInstruction +
      'You are NOT a doctor. Do not diagnose, prescribe, or contradict their care team. If they describe a medical emergency, tell them to call 911 or go to the nearest emergency room.\n\n' +
      'Be warm, concise, and human. Use plain language — avoid jargon. The patient may be anxious. Keep responses focused and practical.\n\n' +
      '━━━ PATIENT\'S SHARED CARE PLAN ━━━\n\n' +
      record +
      '\n━━━ END OF CARE PLAN ━━━\n\n' +
      'Begin with a brief, warm greeting using the patient\'s name and ask what\'s on their mind about their upcoming appointment. Keep your opening short — one or two sentences.';
  }

  // ── Chat state ─────────────────────────────────────────────────────
  var messages = [];   // [{role, content}]
  var systemPrompt = '';
  var patientName  = '';
  var streaming    = false;

  // ── DOM refs ───────────────────────────────────────────────────────
  var $msgs     = document.getElementById('messages');
  var $typing   = document.getElementById('typing');
  var $input    = document.getElementById('input');
  var $sendBtn  = document.getElementById('send-btn');
  var $printBtn = document.getElementById('print-btn');
  var $status   = document.getElementById('status');
  var $pLabel   = document.getElementById('patient-label');
  var $loading  = document.getElementById('loading-screen');
  var $loadMsg  = document.getElementById('loading-msg');

  // ── Minimal markdown → HTML (for assistant messages only) ──────────
  function mdToHtml(text) {
    var esc = function(s) {
      return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    };
    var lines = text.split('\n');
    var out = [];
    var inUl = false, inOl = false;
    lines.forEach(function(line) {
      var m;
      // headings
      if ((m = line.match(/^#{1,3}\s+(.*)/))) {
        if (inUl) { out.push('</ul>'); inUl = false; }
        if (inOl) { out.push('</ol>'); inOl = false; }
        out.push('<strong>' + esc(m[1]) + '</strong>');
        return;
      }
      // unordered list
      if ((m = line.match(/^[-*]\s+(.*)/))) {
        if (inOl) { out.push('</ol>'); inOl = false; }
        if (!inUl) { out.push('<ul style="margin:4px 0;padding-left:18px">'); inUl = true; }
        out.push('<li>' + inline(esc(m[1])) + '</li>');
        return;
      }
      // ordered list
      if ((m = line.match(/^\d+\.\s+(.*)/))) {
        if (inUl) { out.push('</ul>'); inUl = false; }
        if (!inOl) { out.push('<ol style="margin:4px 0;padding-left:18px">'); inOl = true; }
        out.push('<li>' + inline(esc(m[1])) + '</li>');
        return;
      }
      // close open lists before normal lines
      if (inUl) { out.push('</ul>'); inUl = false; }
      if (inOl) { out.push('</ol>'); inOl = false; }
      // blank line
      if (line.trim() === '') { out.push('<br>'); return; }
      out.push('<p style="margin:3px 0">' + inline(esc(line)) + '</p>');
    });
    if (inUl) out.push('</ul>');
    if (inOl) out.push('</ol>');
    return out.join('');
  }

  function inline(s) {
    return s
      .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
      .replace(/\*([^*]+)\*/g, '<em>$1</em>')
      .replace(/`([^`]+)`/g, '<code style="background:#f3f4f6;padding:1px 4px;border-radius:3px">$1</code>');
  }

  // ── Render a message bubble ─────────────────────────────────────────
  function addMessage(role, text) {
    var div = document.createElement('div');
    div.className = 'msg msg-' + role;
    if (role === 'assistant') {
      div.innerHTML = mdToHtml(text);
    } else {
      div.textContent = text;
    }
    $msgs.appendChild(div);
    scrollBottom();
    return div;
  }

  function addSystem(text) {
    var div = document.createElement('div');
    div.className = 'msg msg-system';
    div.textContent = text;
    $msgs.appendChild(div);
    scrollBottom();
  }

  function scrollBottom() {
    $msgs.scrollTop = $msgs.scrollHeight;
  }

  // ── Streaming call ─────────────────────────────────────────────────
  async function sendMessage(userText) {
    if (streaming) return;
    streaming = true;
    $sendBtn.disabled = true;

    messages.push({ role: 'user', content: userText });
    addMessage('user', userText);

    $typing.style.display = 'block';
    scrollBottom();
    $status.textContent = 'Claude is thinking…';

    var body = JSON.stringify({
      model: MODEL,
      max_tokens: 1024,
      stream: true,
      system: systemPrompt,
      messages: messages
    });

    var assistantDiv = null;
    var fullText = '';

    try {
      var resp = await fetch(PROXY + '/api/anthropic', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: body
      });

      if (!resp.ok) {
        var err = await resp.text();
        throw new Error('API error ' + resp.status + ': ' + err);
      }

      $typing.style.display = 'none';

      var reader = resp.body.getReader();
      var decoder = new TextDecoder();
      var buf = '';

      while (true) {
        var chunk = await reader.read();
        if (chunk.done) break;
        buf += decoder.decode(chunk.value, { stream: true });
        var lines = buf.split('\n');
        buf = lines.pop();

        for (var li = 0; li < lines.length; li++) {
          var ln = lines[li].trim();
          if (!ln.startsWith('data: ')) continue;
          var raw = ln.slice(6);
          if (raw === '[DONE]') continue;
          try {
            var evt = JSON.parse(raw);
            if (evt.type === 'content_block_delta' &&
                evt.delta && evt.delta.type === 'text_delta') {
              fullText += evt.delta.text;
              if (!assistantDiv) {
                assistantDiv = addMessage('assistant', fullText);
              } else {
                assistantDiv.innerHTML = mdToHtml(fullText);
                scrollBottom();
              }
            }
          } catch (e) { /* skip malformed SSE line */ }
        }
      }

      if (fullText) {
        messages.push({ role: 'assistant', content: fullText });
      }
      $status.textContent = '';

    } catch (err) {
      $typing.style.display = 'none';
      addSystem('Error: ' + err.message);
      $status.textContent = '';
      // Remove the user message we added optimistically
      if (messages[messages.length - 1].role === 'user') messages.pop();
    }

    streaming = false;
    $sendBtn.disabled = false;
    $input.focus();
  }

  // ── Kick off the first Claude message (greeting) ────────────────────
  async function greet() {
    streaming = true;
    $sendBtn.disabled = true;
    $typing.style.display = 'block';
    scrollBottom();
    $status.textContent = 'Claude is preparing…';

    var body = JSON.stringify({
      model: MODEL,
      max_tokens: 256,
      stream: true,
      system: systemPrompt,
      messages: [{ role: 'user', content: 'Hello' }]
    });

    var assistantDiv = null;
    var fullText = '';

    try {
      var resp = await fetch(PROXY + '/api/anthropic', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: body
      });
      if (!resp.ok) throw new Error('API error ' + resp.status);

      $typing.style.display = 'none';

      var reader = resp.body.getReader();
      var decoder = new TextDecoder();
      var buf = '';

      while (true) {
        var chunk = await reader.read();
        if (chunk.done) break;
        buf += decoder.decode(chunk.value, { stream: true });
        var lines = buf.split('\n');
        buf = lines.pop();

        for (var li = 0; li < lines.length; li++) {
          var ln = lines[li].trim();
          if (!ln.startsWith('data: ')) continue;
          var raw = ln.slice(6);
          if (raw === '[DONE]') continue;
          try {
            var evt = JSON.parse(raw);
            if (evt.type === 'content_block_delta' &&
                evt.delta && evt.delta.type === 'text_delta') {
              fullText += evt.delta.text;
              if (!assistantDiv) {
                assistantDiv = addMessage('assistant', fullText);
              } else {
                assistantDiv.innerHTML = mdToHtml(fullText);
                scrollBottom();
              }
            }
          } catch (e) {}
        }
      }

      if (fullText) messages.push({ role: 'assistant', content: fullText });
      $status.textContent = '';

    } catch (err) {
      $typing.style.display = 'none';
      addSystem('Could not reach Claude. Is sofi-proxy.py running at localhost:8765?');
      $status.textContent = 'Connection error — check that sofi-proxy.py is running.';
    }

    streaming = false;
    $sendBtn.disabled = false;
    $printBtn.disabled = false;
    $input.focus();
  }

  // ── Load SCP data and initialise ────────────────────────────────────
  async function init() {
    var slugs = ['about-me', 'pre-visit-summary'];
    SECTIONS.forEach(function (s) {
      if (slugs.indexOf(s.page) === -1) slugs.push(s.page);
    });

    var pageData = {};
    var total = slugs.length;
    var done = 0;

    await Promise.all(slugs.map(async function (slug) {
      $loadMsg.textContent = 'Loading ' + slug + '…';
      pageData[slug] = await fetchPage(slug);
      done++;
    }));

    // Patient name for header
    var aboutPage = pageData['about-me'];
    if (aboutPage && aboutPage.story) {
      var ai = aboutPage.story.find(function (i) {
        return i.type === 'scp-about' && i.committed;
      });
      if (ai) patientName = ai.preferred_name || ai.legal_name || '';
    }

    $pLabel.textContent = patientName
      ? 'Shared Care Plan — ' + patientName
      : 'Shared Care Plan';

    systemPrompt = buildSystemPrompt(pageData);
    $loading.style.display = 'none';

    addSystem('Your Shared Care Plan has been loaded. This conversation is private and not stored.');

    // Start with Claude greeting
    await greet();
  }

  // ── Markdown → HTML (for print) ─────────────────────────────────────
  function inlineMd(s) {
    s = s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    s = s.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    s = s.replace(/\*(.+?)\*/g, '<em>$1</em>');
    s = s.replace(/`(.+?)`/g, '<code>$1</code>');
    return s;
  }

  function mdToHtml(text) {
    var blocks = text.split(/\n{2,}/);
    return blocks.map(function (block) {
      var lines = block.split('\n');
      if (!lines.length) return '';

      // Headings
      var hm = lines[0].match(/^(#{1,4})\s+(.*)/);
      if (hm) {
        var lvl = Math.min(hm[1].length + 1, 4);
        return '<h' + lvl + '>' + inlineMd(hm[2]) + '</h' + lvl + '>';
      }

      // Bullet list — block where every non-empty line starts with - / * / •
      var nonEmpty = lines.filter(function (l) { return l.trim(); });
      var isBullet  = nonEmpty.length && nonEmpty.every(function (l) { return /^\s*[-*•]\s/.test(l); });
      var isOrdered = nonEmpty.length && nonEmpty.every(function (l) { return /^\s*\d+[.)]\s/.test(l); });

      if (isBullet) {
        return '<ul>' + nonEmpty.map(function (l) {
          return '<li>' + inlineMd(l.replace(/^\s*[-*•]\s+/, '')) + '</li>';
        }).join('') + '</ul>';
      }
      if (isOrdered) {
        return '<ol>' + nonEmpty.map(function (l) {
          return '<li>' + inlineMd(l.replace(/^\s*\d+[.)]\s+/, '')) + '</li>';
        }).join('') + '</ol>';
      }

      // Default: paragraph (single newlines become <br> only for multi-line blocks)
      var inner = lines.map(inlineMd).join(lines.length > 1 ? '<br>' : '');
      return '<p>' + inner + '</p>';
    }).join('');
  }

  // ── Print ───────────────────────────────────────────────────────────
  function printChat() {
    var date = new Date().toLocaleString('en-US', {
      weekday: 'long', year: 'numeric', month: 'long', day: 'numeric',
      hour: 'numeric', minute: '2-digit'
    });
    var heading = patientName
      ? 'Appointment Preparation — ' + patientName
      : 'Appointment Preparation Notes';

    function esc(s) {
      return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    var body = messages.map(function (m, idx) {
      if (m.role === 'user') {
        return '<div class="turn turn-user">' +
          '<div class="speaker">You</div>' +
          '<div class="text">' + inlineMd(m.content) + '</div>' +
          '</div>';
      } else {
        return '<div class="turn turn-assistant">' +
          '<div class="speaker">Claude</div>' +
          '<div class="text">' + mdToHtml(m.content) + '</div>' +
          '</div>';
      }
    }).join('');

    var html = '<!DOCTYPE html><html><head><meta charset="utf-8">' +
      '<title>' + esc(heading) + '</title><style>' +
      'body{font-family:Georgia,serif;font-size:11pt;color:#111;margin:0;padding:0}' +
      '.doc{max-width:680px;margin:0 auto;padding:28px 36px}' +
      '.print-btn{display:block;margin:0 auto 22px;padding:8px 28px;font-size:11pt;' +
        'background:#1e3a5f;color:#fff;border:none;border-radius:4px;cursor:pointer}' +
      '.hdr{border-bottom:2px solid #1e3a5f;padding-bottom:10px;margin-bottom:22px}' +
      '.hdr h1{font-size:14pt;font-weight:bold;margin:0 0 3px}' +
      '.hdr .meta{font-size:9pt;color:#666}' +
      '.turn{margin-bottom:16px;page-break-inside:avoid}' +
      '.speaker{font-size:8pt;font-weight:700;text-transform:uppercase;letter-spacing:.08em;' +
        'color:#888;margin-bottom:4px}' +
      '.turn-user .speaker{color:#1d4ed8}' +
      '.turn-user .text{background:#eff6ff;border-left:3px solid #2563eb;' +
        'padding:8px 12px;font-size:10.5pt;border-radius:0 4px 4px 0}' +
      '.turn-assistant .text{font-size:10.5pt;line-height:1.6}' +
      '.turn-assistant .text p{margin:0 0 7px}' +
      '.turn-assistant .text p:last-child{margin-bottom:0}' +
      '.turn-assistant .text ul,.turn-assistant .text ol{margin:0 0 7px;padding-left:20px}' +
      '.turn-assistant .text li{margin-bottom:3px}' +
      '.turn-assistant .text h2{font-size:10.5pt;font-weight:700;margin:10px 0 4px;text-transform:uppercase;letter-spacing:.05em;color:#444}' +
      '.turn-assistant .text h3,.turn-assistant .text h4{font-size:10.5pt;font-weight:700;margin:8px 0 3px}' +
      '.turn-assistant .text code{font-family:monospace;font-size:9.5pt;background:#f3f4f6;padding:1px 4px;border-radius:3px}' +
      '.disclaimer{margin-top:28px;padding-top:12px;border-top:1px solid #ddd;' +
        'font-size:8pt;color:#999;font-style:italic;text-align:center}' +
      '@media print{.print-btn{display:none}}' +
      '</style></head><body><div class="doc">' +
      '<button class="print-btn" onclick="window.print()">Print</button>' +
      '<div class="hdr">' +
        '<h1>' + esc(heading) + '</h1>' +
        '<div class="meta">' + esc(date) + ' &nbsp;·&nbsp; Shared Care Plan</div>' +
      '</div>' +
      body +
      '<div class="disclaimer">This conversation was generated with the assistance of Claude AI and is not medical advice. ' +
        'Always consult your care team for medical decisions.</div>' +
      '</div></body></html>';

    var win = window.open('', '_blank', 'width=760,height=900');
    win.document.write(html);
    win.document.close();
  }

  // ── Input handling ─────────────────────────────────────────────────
  $input.addEventListener('input', function () {
    this.style.height = 'auto';
    this.style.height = Math.min(this.scrollHeight, 120) + 'px';
  });

  $input.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      doSend();
    }
  });

  $sendBtn.addEventListener('click', doSend);

  function doSend() {
    var text = $input.value.trim();
    if (!text || streaming) return;
    $input.value = '';
    $input.style.height = 'auto';
    sendMessage(text);
  }

  // ── Go ─────────────────────────────────────────────────────────────
  $printBtn.addEventListener('click', printChat);

  init().catch(function (err) {
    $loadMsg.textContent = 'Error loading care plan: ' + err.message;
  });

})();
</script>
