<!doctype html>
<meta charset="utf-8">
<title>RCN Table</title>
<!--
═══════════════════════════════════════════════════════════════════════
RCN TABLE — decisions log. Read this before editing.
═══════════════════════════════════════════════════════════════════════

WHAT THIS IS. The table pane. A wiki column cannot hold 189 rows by 34
columns, so the table is "called out" into a full window that stays tied to
the page it came from — the Solo pattern the graph tool already uses.

WHY IT ONLY READS. Sort, filter, select, click through. No cell editing.
A spreadsheet in the wiki is a different and much larger thing, with a real
destructive surface; this is the pane you scan before you pick a row, which
is the job Perspectives' bottom pane actually does.

THE SLUG IS THE SELECTION. Two views are synchronised when they link to the
same slug — that is the whole coordination model, and it needs no message
bus. So asSlug() here MUST stay byte-identical to wiki-client's
lib/page.js:12 and to enrichSVGLinks() in graph-tool-v22.html. A link to
/superior-clinic.html and one to /superiorclinic.html both look right and
will never meet. One rule, three tools; if you change it, change it in all
of them or the join silently fails.

THE AGREEMENT INSPECTOR is the one idea worth stealing outright from Tom
Sawyer Perspectives. Select several rows and the inspector keeps its rows
and changes its values: where the selection agrees it shows the value,
where it differs it shows […]. A widget built to describe one thing
answers "what do these have in common?" for free.

INSPECTOR AND TABLE ARE THE SAME WIDGET, TRANSPOSED. One element with
attributes down the side; many elements with attributes across the top.
Same column spec drives both — do not grow a second implementation.

COLUMNS ARE GATHERED, NOT DECLARED. These sheets are ragged: most columns
are filled for a small minority of rows. Columns under FILL_FLOOR are
hidden by default and counted in the picker rather than dropped, because a
column that is empty here may be the point of some other row.

WARD'S SHAPE, DELIBERATELY. Export writes {columns, data} — item.columns
plus an array of row objects — which is exactly what wiki-plugin-data
already publishes. chart, rollup, reduce and method can then read an RCN
table with no adapter. Reusing his contract costs nothing and buys the
whole downstream ecosystem.
═══════════════════════════════════════════════════════════════════════
-->
<style>

  --accent:#0f766e; --sel:#cdf3ee; --head:#eef1f5;
}
*{box-sizing:border-box}

     height:100vh;display:flex;flex-direction:column;overflow:hidden}
header{display:flex;gap:10px;align-items:center;padding:8px 12px;background:var(--panel);
       border-bottom:1px solid var(--line);flex-wrap:wrap}

<main>
  <div id="tablewrap"><div class="empty">Loading…</div></div>
  <aside>
    <h2 id="inspectorTitle">Inspector</h2>
    <div id="inspector"><div class="empty">Select a row.</div></div>
    <div id="cols"></div>
  </aside>
</main>
<footer id="status"></footer>
<div id="toast"></div>

<script>
'use strict';

// MUST match wiki-client lib/page.js:12 and graph-tool's enrichSVGLinks().
function asSlug(name){
  return String(name).replace(/\s/g,'-').replace(/[^A-Za-z0-9-]/g,'').toLowerCase();
}

// Same resolution order as graph-tool-v22.html. Relative paths only work when
// the tool is served by the substrate itself; from :8765, the wiki popup, or a
// deployed folder they address the wrong host.
var SUBSTRATE_BASE = (function(){
  var q = new URLSearchParams(location.search).get('substrate');
  if(q) return q.replace(/\/+$/,'');
  if(location.port === '8768') return '';
  if(location.protocol === 'file:') return 'http://127.0.0.1:8768';
  if(/(^|\.)localhost$/.test(location.hostname) || location.hostname === '127.0.0.1')
    return 'http://127.0.0.1:8768';
  return '';
})();

// TWO SOURCES, ONE TABLE. ?substrate= names a live api.py; ?src= names a FOLDER
// of the same projections written once by substrate/export.py — index.json,
// table-<kind>.json, geo.json, graph.json. The folder is what travels: a
// steward drops it into their FedWiki site's assets and a reader with no
// account, no key and no Neo4j gets the whole table. Everything below the
// fetch is identical in both modes; api() is the only place that knows. The
// opener can also hand a src over in loadTable, which is how the wiki plugin
// points this popup at the site's own assets.
var SRC = (function(){
  var q = new URLSearchParams(location.search).get('src');
  return q ? q.replace(/\/+$/,'') + '/' : '';
})();
var srcIndex = null;   // index.json, fetched once per folder
var srcGraph = null;   // graph.json, fetched the first time a neighbourhood is asked for

// A THIRD SOURCE, WITH NO SERVER AND NO FOLDER: a spreadsheet opened here.
// One sheet (or CSV) per kind of thing, named for the kind, first column the
// name; an optional sheet called Links with From, Relation, To. It becomes the
// same four projections export.py writes — tables, geo, graph — held in memory,
// so the table, Neighbourhood and Map all work at once, and Publish hands the
// folder back as a zip for the site's assets. This is level 1 in
// substrate/LAYERS-2-3.md: a steward with a spreadsheet and nothing installed.
var MEM = null;        // {database, kinds, tables:{kind:projection}, geo, graph, sourceName}

var FILL_FLOOR = 0.10;      // columns filled for fewer rows than this start hidden
var ITEM_ROW_CAP = 200;     // what a wiki item carries; see decisions log

var state = {
  columns: [], data: [], subject: null, kind: '', db: '',
  visible: {}, sortBy: null, sortDir: 1, selected: new Set(), filter: ''
};

var $ = function(id){ return document.getElementById(id); };

function toast(msg){
  var t = $('toast'); t.textContent = msg; t.style.display = 'block';
  clearTimeout(toast._t); toast._t = setTimeout(function(){ t.style.display='none'; }, 2600);
}
function esc(s){
  return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function fillOf(col){
  var n = 0;
  state.data.forEach(function(r){ if(String(r[col]||'').trim()) n++; });
  return state.data.length ? n/state.data.length : 0;
}

// ── loading ───────────────────────────────────────────────────────────
function getJSON(url){
  return fetch(url).then(function(r){
    if(!r.ok) throw new Error('HTTP '+r.status+' '+url); return r.json();
  });
}
function srcIndexOnce(){
  return srcIndex ? Promise.resolve(srcIndex)
                  : getJSON(SRC + 'index.json').then(function(j){ srcIndex = j; return j; });
}
function api(path){
  if(MEM){
    var b = path.split('?')[0];
    if(b === '/projection') return Promise.resolve({databases:[MEM.database], default:MEM.database});
    if(b === '/projection/tables') return Promise.resolve({database:MEM.database, kinds:MEM.kinds});
    if(b.indexOf('/projection/table/') === 0){
      var k = decodeURIComponent(b.slice('/projection/table/'.length));
      return MEM.tables[k] ? Promise.resolve(MEM.tables[k])
                           : Promise.reject(new Error('no sheet called '+k));
    }
    return Promise.reject(new Error('the spreadsheet cannot answer '+b));
  }
  if(!SRC) return getJSON(SUBSTRATE_BASE + path);
  // The folder answers the same three questions the server does. Names of
  // files come from index.json when it lists them and from the slug rule when
  // it does not, so a hand-made folder with no index still works.
  var bare = path.split('?')[0];
  if(bare === '/projection')
    return srcIndexOnce().then(function(i){ return {databases:[i.database], default:i.database}; });
  if(bare === '/projection/tables')
    return srcIndexOnce().then(function(i){ return {database:i.database, kinds:i.kinds||[]}; });
  if(bare.indexOf('/projection/table/') === 0){
    var kind = decodeURIComponent(bare.slice('/projection/table/'.length));
    return srcIndexOnce().then(function(i){
      var f = (i.files && i.files.tables && i.files.tables[kind]) || ('table-'+asSlug(kind)+'.json');
      return getJSON(SRC + f);
    });
  }
  return Promise.reject(new Error('no file in the folder answers '+bare));
}

function loadDatabases(){
  return api('/projection').then(function(j){
    var sel = $('db');
    sel.innerHTML = (j.databases||[]).map(function(d){
      return '<option'+(d===state.db?' selected':'')+'>'+esc(d)+'</option>'; }).join('');
  });
}

function loadKinds(){
  return api('/projection/tables?db='+encodeURIComponent(state.db)).then(function(j){
    var kinds = j.kinds||[];
    $('kind').innerHTML = kinds.map(function(k){
      return '<option value="'+esc(k.kind)+'"'+(k.kind===state.kind?' selected':'')+'>'
           + esc(k.kind)+' ('+k.rows+')</option>'; }).join('');
    if(kinds.length && !kinds.some(function(k){ return k.kind===state.kind; }))
      state.kind = kinds[0].kind;
    $('kind').value = state.kind;
  });
}

function loadTable(){
  $('tablewrap').innerHTML = '<div class="empty">Loading…</div>';
  return api('/projection/table/'+encodeURIComponent(state.kind)
            +'?db='+encodeURIComponent(state.db)).then(function(j){
    state.columns = j.columns||[]; state.data = j.data||[];
    state.subject = j.subject||null;
    state.selected = new Set(); state.sortBy = null;
    state.visible = {};
    state.columns.forEach(function(c){ state.visible[c] = fillOf(c) >= FILL_FLOOR; });
    if(state.subject) state.visible[state.subject] = true;
    renderColumns(); render(); renderInspector();
  }).catch(function(e){
    $('tablewrap').innerHTML = '<div class="empty">Could not load: '+esc(e.message)
      + '<br><br>' + (SRC ? 'Is there an export folder at '+esc(SRC)+'?'
                          : 'Is the substrate running on 8768?') + '</div>';
  });
}

// ── rendering ─────────────────────────────────────────────────────────
function visibleColumns(){
  return state.columns.filter(function(c){ return state.visible[c]; });
}

function rows(){
  var f = state.filter.trim().toLowerCase(), cols = visibleColumns();
  var out = state.data.filter(function(r){
    if(!f) return true;
    return cols.some(function(c){ return String(r[c]||'').toLowerCase().indexOf(f) >= 0; });
  });
  if(state.sortBy){
    var c = state.sortBy, d = state.sortDir;
    out = out.slice().sort(function(a,b){
      var x = String(a[c]||''), y = String(b[c]||'');
      var nx = parseFloat(x), ny = parseFloat(y);
      if(!isNaN(nx) && !isNaN(ny) && x.trim()!=='' && y.trim()!=='') return (nx-ny)*d;
      return x.localeCompare(y, undefined, {numeric:true}) * d;
    });
  }
  return out;
}

function rowKey(r){ return state.subject ? String(r[state.subject]||'') : JSON.stringify(r); }

// MAPPABLE MEANS A USABLE PAIR, not a present one. These arrive as strings out
// of a spreadsheet, so a blank, a stray word or (0,0) all mean "no location"
// rather than a point off West Africa. rcn-table-map.html applies the same test.
function hasCoord(r){
  var la = parseFloat(String(r.lat == null ? '' : r.lat).trim());
  var lo = parseFloat(String(r.long == null ? '' : r.long).trim());
  return isFinite(la) && isFinite(lo) && la >= -90 && la <= 90
      && lo >= -180 && lo <= 180 && !(la === 0 && lo === 0);
}

function render(){
  var cols = visibleColumns(), rs = rows();
  var html = '<table><thead><tr>' + cols.map(function(c){
    var ind = state.sortBy===c ? ' <span class="ind">'+(state.sortDir>0?'▲':'▼')+'</span>' : '';
    return '<th data-col="'+esc(c)+'" title="'+esc(c)+' — '
         + Math.round(fillOf(c)*100)+'% filled">'+esc(c)+ind+'</th>';
  }).join('') + '</tr></thead><tbody>';

  rs.forEach(function(r, i){
    var k = rowKey(r);
    html += '<tr data-i="'+i+'"'+(state.selected.has(k)?' class="sel"':'')+'>';
    cols.forEach(function(c){
      var v = r[c]==null ? '' : String(r[c]);
      if(c === state.subject && v){
        // The row is a subject: its name is a slug is a page. This is the join.
        html += '<td><a class="subject" data-title="'+esc(v)+'" href="/'
              + esc(asSlug(v))+'.html">'+esc(v)+'</a></td>';
      } else {
        html += '<td title="'+esc(v)+'">'+esc(v)+'</td>';
      }
    });
    html += '</tr>';
  });
  html += '</tbody></table>';
  $('tablewrap').innerHTML = rs.length ? html : '<div class="empty">No rows match.</div>';
  $('count').textContent = rs.length === state.data.length
    ? state.data.length + ' rows'
    : rs.length + ' of ' + state.data.length + ' rows';
  var one = state.selected.size === 1;
  var mappable = rows().filter(hasCoord).length;
  $('mapview').disabled = !mappable;
  $('mapview').title = mappable
    ? 'Show ' + mappable + ' mappable row' + (mappable===1?'':'s') + ' on a map'
    : 'No row in this view carries a lat/long';
  $('neighbourhood').disabled = !one || !state.subject;
  $('neighbourhood').title = one
    ? 'Draw what this row is connected to'
    : 'Select one row to draw its neighbourhood';
  $('status').textContent = state.db + ' · ' + state.kind + ' · '
    + cols.length + ' of ' + state.columns.length + ' columns shown'
    + (state.selected.size ? ' · ' + state.selected.size + ' selected' : '')
    + (MEM ? ' · from ' + MEM.sourceName + ' (not yet published)' : SRC ? ' · from folder' : ' · live records');
  window._rows = rs;
}

function renderColumns(){
  $('cols').innerHTML = '<div style="font-size:11px;color:var(--dim);'
    + 'text-transform:uppercase;letter-spacing:.07em;margin-bottom:5px">Columns</div>'
    + state.columns.map(function(c){
        var pct = Math.round(fillOf(c)*100);
        return '<label title="'+esc(c)+' — '+pct+'% filled"><input type="checkbox" data-col="'
             + esc(c)+'"'+(state.visible[c]?' checked':'')+'>'+esc(c)
             + ' <span style="opacity:.6">'+pct+'%</span></label>';
      }).join('');
}

// THE AGREEMENT VIEW. One selected row reads as a description. Several read as
// a comparison — same rows, values where they agree and […] where they do not.
function renderInspector(){
  var sel = state.data.filter(function(r){ return state.selected.has(rowKey(r)); });
  $('inspectorTitle').textContent = sel.length > 1
    ? 'Inspector — ' + sel.length + ' rows, shared values'
    : 'Inspector';
  if(!sel.length){
    $('inspector').innerHTML = '<div class="empty">Select a row.<br>'
      + '<span style="font-size:11px">Cmd-click to compare several.</span></div>';
    return;
  }
  var html = '<table>';
  state.columns.forEach(function(c){
    var vals = sel.map(function(r){ return r[c]==null ? '' : String(r[c]); });
    var all = vals.every(function(v){ return v === vals[0]; });
    if(all && !vals[0] && sel.length) return;          // agreed-empty tells nobody anything
    var cell = all ? esc(vals[0])
      : '<span class="differ">[…] ' + new Set(vals).size + ' values</span>';
    html += '<tr><th>'+esc(c)+'</th><td>'+cell+'</td></tr>';
  });
  $('inspector').innerHTML = html + '</table>';
}

// ── interaction ───────────────────────────────────────────────────────
$('tablewrap').addEventListener('click', function(ev){
  var a = ev.target.closest('a.subject');
  if(a){
    ev.preventDefault();
    openPage(a.getAttribute('data-title'), ev.shiftKey);
    return;
  }
  var th = ev.target.closest('th');
  if(th){
    var c = th.getAttribute('data-col');
    if(state.sortBy === c) state.sortDir = -state.sortDir;
    else { state.sortBy = c; state.sortDir = 1; }
    render();
    return;
  }
  var tr = ev.target.closest('tr[data-i]');
  if(!tr) return;
  var r = window._rows[+tr.getAttribute('data-i')], k = rowKey(r);
  if(ev.metaKey || ev.ctrlKey){
    if(state.selected.has(k)) state.selected.delete(k); else state.selected.add(k);
  } else {
    state.selected = new Set([k]);
  }
  render(); renderInspector();
});

$('cols').addEventListener('change', function(ev){
  var c = ev.target.getAttribute('data-col');
  if(c){ state.visible[c] = ev.target.checked; render(); }
});
$('search').addEventListener('input', function(){ state.filter = this.value; render(); });
// THE CLICKABLE QUERY. Perspectives opens its Supply Chain canvas EMPTY and
// tells you to right-click a product and run "Display Chain" — the query is a
// named action on an element, never a query box, and its result BECOMES the
// drawing. /projection/<name> is already that shape; giving it the selected row
// as its parameter is what turns a view into an action.
//
// Nothing here is drawn by this tool. It hands the graph tool a URL and the
// graph tool does what it always does, which is why this costs almost nothing.
$('neighbourhood').addEventListener('click', function(){
  var sel = state.data.filter(function(r){ return state.selected.has(rowKey(r)); });
  if(sel.length !== 1 || !state.subject) return;
  var name = String(sel[0][state.subject] || '');
  if(!name) return;
  if(MEM){
    try{
      var g = neighboursFromGraph(MEM.graph, name, 1);
      pendingGraph = {graph:g, title:g.modelName};
      graphWin = window.open(GRAPH_TOOL_URL, 'rcngraph'); if(graphWin) graphWin.focus();
      setTimeout(deliverGraph, 1500);
      toast('Drawing the neighbourhood of ' + name + ' (' + g.nodes.length + ' nodes)');
    }catch(e){ toast('Could not draw: ' + e.message); }
    return;
  }
  if(SRC){ neighbourhoodFromFolder(name); return; }
  var url = SUBSTRATE_BASE + '/tools/graph-tool-v22.html?url='
          + encodeURIComponent('/projection/neighbours/' + encodeURIComponent(name)
                               + '?db=' + encodeURIComponent(state.db));
  window.open(url, 'rcngraph');
  toast('Drawing the neighbourhood of ' + name);
});

// ── neighbours without a server ───────────────────────────────────────
// /projection/neighbours is a walk over 409 nodes and 770 links. That is not a
// database's job; a browser does it in a millisecond from graph.json. This is
// a port of api.py's neighbours_projection — same ring layout, same colours,
// same legend — so the drawing is the one you would have got from the server.
// It reaches the graph tool through the opener handshake the tool already
// has (graphToolReady → loadGraph), because a computed graph has no URL.
var KIND_FILL = {Entity:'#dbeafe', Person:'#dcfce7', Program:'#fef3c7',
                 Theme:'#ede9fe', Promise:'#ffe4e6', Result:'#ccfbf1', Scrum:'#f1f5f9'};
var KIND_EDGE = {Entity:'#2563eb', Person:'#16a34a', Program:'#d97706',
                 Theme:'#7c3aed', Promise:'#e11d48', Result:'#0d9488', Scrum:'#64748b'};

function srcGraphOnce(){
  if(srcGraph) return Promise.resolve(srcGraph);
  return srcIndexOnce().then(function(i){
    return getJSON(SRC + ((i.files && i.files.graph) || 'graph.json'));
  }).then(function(g){ srcGraph = g; return g; });
}

function neighboursFromGraph(g, root, depth){
  depth = Math.max(1, Math.min(depth|0 || 1, 3));
  var byKey = {}, adj = {}, lc = root.toLowerCase(), rootKey = null;
  g.nodes.forEach(function(n){ byKey[n.key] = n; adj[n.key] = []; });
  g.nodes.forEach(function(n){
    if(rootKey === null && (String(n.key).toLowerCase() === lc || String(n.name).toLowerCase() === lc))
      rootKey = n.key;
  });
  if(rootKey === null) throw new Error('no concept matching "'+root+'" in '+g.database);
  g.edges.forEach(function(e){
    if(adj[e.src] && adj[e.tgt]){ adj[e.src].push(e.tgt); adj[e.tgt].push(e.src); }
  });
  // breadth-first: hop = shortest distance, exactly min(length(p)) in Cypher
  var hop = {}; hop[rootKey] = 0; var frontier = [rootKey];
  for(var d = 1; d <= depth && frontier.length; d++){
    var next = [];
    frontier.forEach(function(k){ adj[k].forEach(function(m){
      if(hop[m] === undefined){ hop[m] = d; next.push(m); } }); });
    frontier = next;
  }
  var byHop = {};
  Object.keys(hop).forEach(function(k){ (byHop[hop[k]] = byHop[hop[k]] || []).push(byKey[k]); });
  var ids = {}, nodes = [];
  Object.keys(byHop).map(Number).sort(function(a,b){ return a-b; }).forEach(function(h){
    var group = byHop[h].sort(function(a,b){ return String(a.name).localeCompare(String(b.name)); });
    group.forEach(function(n, i){
      var nid = 'n' + nodes.length; ids[n.key] = nid;
      var x = 620, y = 400;
      if(h > 0){
        var ang = 2*Math.PI*i/Math.max(1, group.length);
        var rad = h * Math.max(250, group.length*175/(2*Math.PI));
        x = Math.round(620 + rad*Math.cos(ang)); y = Math.round(400 + rad*Math.sin(ang)*0.78);
      }
      var kind = n.kind || 'Entity';
      nodes.push({id:nid, label:n.name || n.key, x:x, y:y, w:150, h:56, shape:'roundrect',
        color:KIND_FILL[kind] || '#f1f5f9', borderColor:KIND_EDGE[kind] || '#64748b',
        borderWidth: h === 0 ? 3 : 1.5, fontColor:'#16233b', fontSize:12,
        props:{kind:kind, schemaLabel:n.key, hop:String(h)}});
    });
  });
  var seen = {}, edges = [];
  g.edges.forEach(function(e){
    var sv = ids[e.src], tv = ids[e.tgt]; if(!sv || !tv) return;
    var sig = sv+'>'+tv+'|'+(e.label||''); if(seen[sig]) return; seen[sig] = 1;
    edges.push({id:'e'+edges.length, src:sv, tgt:tv, label:e.label||'', polarity:'none',
      color:'#64748b', width:1.5, fontSize:10, curved:true, dash:'solid', props:{}});
  });
  var kinds = {}; nodes.forEach(function(n){ kinds[n.props.kind] = 1; });
  var rootName = byKey[rootKey].name || rootKey;
  return {version:'1.0',
    modelName: rootName + ' \u2014 neighbourhood, ' + depth + ' hop' + (depth === 1 ? '' : 's'),
    modelNote: 'Computed in the browser from ' + g.database + '/graph.json. The thick border '
             + 'is the row you came from; each ring is one more hop away.',
    canvasBg:'#ffffff', legendVisible:true,
    legendEntries: Object.keys(kinds).sort().map(function(k){
      return {id:'lg_'+k.toLowerCase(), kind:'node', label:k,
              color:KIND_FILL[k] || '#f1f5f9', borderColor:KIND_EDGE[k] || '#64748b', borderWidth:1.5}; }),
    nodes:nodes, edges:edges};
}

// The graph tool sits beside this file when deployed as a folder (the
// self-contained tools/dist build), and beside it in tools/ at home.
var GRAPH_TOOL_URL = new URL('graph-tool-v22.html', location.href).href;
var pendingGraph = null, graphWin = null;
function deliverGraph(){
  if(!pendingGraph || !graphWin || graphWin.closed) return;
  graphWin.postMessage({action:'loadGraph', graphJSON:pendingGraph.graph,
                        pageTitle:pendingGraph.title}, '*');
  pendingGraph = null;
}
window.addEventListener('message', function(ev){
  if(ev.data && ev.data.toolType === 'rcn-graph' && ev.data.action === 'graphToolReady'
     && ev.source === graphWin) deliverGraph();
});
function neighbourhoodFromFolder(name){
  srcGraphOnce().then(function(g){
    var graph = neighboursFromGraph(g, name, 1);
    pendingGraph = {graph:graph, title:graph.modelName};
    graphWin = window.open(GRAPH_TOOL_URL, 'rcngraph');
    if(graphWin) graphWin.focus();
    // A tool already open under this name does not reload, so never says ready
    // again; its listener is still there, so deliver anyway after a beat.
    setTimeout(deliverGraph, 1500);
    toast('Drawing the neighbourhood of ' + name + ' (' + graph.nodes.length + ' nodes)');
  }).catch(function(e){ toast('Could not draw: ' + e.message); });
}

// THE MAP IS A VIEW OF THIS TABLE, not a separate errand. Perspectives makes
// Geographical View and Logical View two tabs of one area over one model; we
// have callouts rather than panes, so it opens beside Neighbourhood off the
// same selection. Rows go over postMessage because a selection can be large,
// and the URL carries db+kind as well so the map can stand on its own if the
// link is sent to someone.
var mapWin = null;
$('mapview').addEventListener('click', function(){
  var shown = rows();
  var url = ((SRC || MEM) ? new URL('rcn-table-map.html', location.href).href
                          : SUBSTRATE_BASE + '/tools/rcn-table-map.html')
          + '?db=' + encodeURIComponent(state.db) + '&kind=' + encodeURIComponent(state.kind)
          + (SRC ? '&src=' + encodeURIComponent(SRC) : '');
  mapWin = window.open(url, 'rcntablemap');
  if(mapWin) mapWin.focus();
  toast('Mapping ' + shown.filter(hasCoord).length + ' rows');
});

window.addEventListener('message', function(ev){
  if(!ev.data || ev.data.toolType !== 'rcn-table-map') return;
  if(ev.data.action === 'mapReady' && ev.source){
    var shown = rows();
    // NAMES, NOT COORDINATES. The map reads geometry, attributes and edges from
    // Neo4j itself, so it cannot drift from the substrate and a link to it works
    // with no table open. All this hands over is which rows are in view and
    // which are selected.
    ev.source.postMessage({action:'loadPoints',
      database:state.db, kind:state.kind,
      names: shown.map(rowKey).filter(Boolean),
      selected: Array.from(state.selected),
      geo: MEM ? MEM.geo : null}, '*');
  }
  if(ev.data.action === 'doInternalLink'){
    // The map has no wiki of its own — it reaches ours through this window.
    openPage(ev.data.title, false);
  }
});

$('clear').addEventListener('click', function(){
  state.selected = new Set(); render(); renderInspector();
});
$('db').addEventListener('change', function(){
  state.db = this.value; loadKinds().then(loadTable);
});
$('kind').addEventListener('change', function(){ state.kind = this.value; loadTable(); });

// ── the wiki, behind the callout ──────────────────────────────────────
// Navigating is the whole point: the table does not update a pane, it moves the
// lineup. Shift-click keeps the lineup, matching FedWiki's own convention.
function openPage(title, keepLineup){
  if(window.opener && !window.opener.closed){
    window.opener.postMessage({toolType:'rcn-table', action:'doInternalLink',
      title:title, keepLineup:!!keepLineup, pageKey:window._pageKey||null}, '*');
    window.opener.focus();
    toast('→ ' + title);
  } else {
    toast('No wiki opened this table — would open /' + asSlug(title) + '.html');
  }
}

$('toWiki').addEventListener('click', function(){
  var cols = visibleColumns(), rs = rows().slice(0, ITEM_ROW_CAP);
  var item = {
    type: 'rcntable', kind: state.kind, database: state.db,
    subject: state.subject, columns: cols,
    data: rs.map(function(r){
      var o = {}; cols.forEach(function(c){ o[c] = r[c]==null ? '' : r[c]; }); return o; }),
    total: state.data.length, fetched: new Date().toISOString().slice(0,10),
    // Only items with `text` are indexed by the wiki server's search.
    text: state.kind + ' — ' + cols.join(', ') + ' — '
        + rs.map(function(r){ return r[state.subject]; }).filter(Boolean).join(', ')
  };
  if(window.opener && !window.opener.closed){
    window.opener.postMessage({toolType:'rcn-table', action:'saveTable', item:item}, '*');
    window.opener.focus();
    toast('Sent ' + item.data.length + ' rows to the wiki item');
  } else {
    navigator.clipboard.writeText(JSON.stringify(item, null, 2));
    toast('No wiki opener — item JSON copied to clipboard');
  }
});

$('csv').addEventListener('click', function(){
  var cols = visibleColumns();
  var q = function(v){ v = String(v==null?'':v); return /[",\n]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v; };
  var out = [cols.map(q).join(',')].concat(rows().map(function(r){
    return cols.map(function(c){ return q(r[c]); }).join(','); })).join('\n');
  var a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([out], {type:'text/csv'}));
  a.download = state.db + '-' + state.kind + '.csv';
  a.click();
  toast('Downloaded ' + a.download);
});

// ── a spreadsheet as the source ───────────────────────────────────────
// Everything below turns sheets into the projections; nothing above knows
// the difference. Column names are kept as written. The first column is the
// subject unless a column is literally called Name. lat/long are recognised
// under their usual spellings so the map works without renaming anything.
var LINK_SHEET = /^(links?|relations?(hips?)?|edges?)$/i;
var LAT_RE = /^(lat|latitude)$/i, LNG_RE = /^(long|lng|lon|longitude)$/i;

function parseCSV(text){
  // RFC 4180, enough of it: quoted fields, doubled quotes, CRLF, and a
  // comma or tab delimiter chosen from the header line.
  var delim = (text.split('\n')[0].split('\t').length > text.split('\n')[0].split(',').length) ? '\t' : ',';
  var rows = [], row = [], field = '', q = false;
  for(var i = 0; i < text.length; i++){
    var c = text[i];
    if(q){
      if(c === '"'){ if(text[i+1] === '"'){ field += '"'; i++; } else q = false; }
      else field += c;
    }else if(c === '"') q = true;
    else if(c === delim){ row.push(field); field = ''; }
    else if(c === '\n' || c === '\r'){
      if(c === '\r' && text[i+1] === '\n') i++;
      row.push(field); rows.push(row); row = []; field = '';
    }else field += c;
  }
  if(field !== '' || row.length){ row.push(field); rows.push(row); }
  return rows.filter(function(r){ return r.some(function(v){ return String(v).trim() !== ''; }); });
}

function loadScript(url){
  return new Promise(function(res, rej){
    var el = document.createElement('script'); el.src = url;
    el.onload = res; el.onerror = function(){ rej(new Error('could not load ' + url)); };
    document.head.appendChild(el);
  });
}

// One workbook or several files -> [{name, rows:[[...]]}]
function readSheets(files){
  return Promise.all(Array.prototype.map.call(files, function(f){
    var stem = f.name.replace(/\.[^.]+$/, '');
    if(/\.(csv|tsv|txt)$/i.test(f.name))
      return f.text().then(function(t){ return [{name:stem, rows:parseCSV(t)}]; });
    var xl = (typeof XLSX !== 'undefined') ? Promise.resolve()
      : loadScript('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js');
    return xl.then(function(){ return f.arrayBuffer(); }).then(function(buf){
      var wb = XLSX.read(buf, {type:'array'});
      return wb.SheetNames.map(function(n){
        return {name:n, rows:XLSX.utils.sheet_to_json(wb.Sheets[n], {header:1, raw:false, defval:''})
                  .filter(function(r){ return r.some(function(v){ return String(v).trim() !== ''; }); })};
      });
    });
  })).then(function(lists){ return [].concat.apply([], lists); });
}

function sheetsToProjections(sheets, database){
  var tables = {}, kinds = [], graphNodes = {}, edges = [], geoNodes = [];
  sheets.forEach(function(sh){
    if(!sh.rows.length) return;
    var header = sh.rows[0].map(function(h){ return String(h).trim(); });
    var body = sh.rows.slice(1);
    if(LINK_SHEET.test(sh.name)){
      var fi = header.findIndex(function(h){ return /^(from|src|source)$/i.test(h); });
      var ri = header.findIndex(function(h){ return /^(relation|label|rel|type)$/i.test(h); });
      var ti = header.findIndex(function(h){ return /^(to|tgt|target)$/i.test(h); });
      if(fi < 0) fi = 0; if(ri < 0) ri = 1; if(ti < 0) ti = 2;
      body.forEach(function(r){
        var a = String(r[fi]||'').trim(), b = String(r[ti]||'').trim();
        if(!a || !b) return;
        [a, b].forEach(function(n){ if(!graphNodes[asSlug(n)]) graphNodes[asSlug(n)] = {key:asSlug(n), name:n, kind:''}; });
        edges.push({src:asSlug(a), tgt:asSlug(b), label:String(r[ri]||'').trim()});
      });
      return;
    }
    var kind = sh.name.trim();
    var ni = header.findIndex(function(h){ return /^name$/i.test(h); }); if(ni < 0) ni = 0;
    var subject = header[ni];
    var lati = header.findIndex(function(h){ return LAT_RE.test(h); });
    var lngi = header.findIndex(function(h){ return LNG_RE.test(h); });
    var data = [];
    body.forEach(function(r){
      var o = {}; header.forEach(function(h, i){ if(h) o[h] = r[i] == null ? '' : String(r[i]); });
      var name = String(o[subject]||'').trim(); if(!name) return;
      data.push(o);
      graphNodes[asSlug(name)] = {key:asSlug(name), name:name, kind:kind};
      if(lati >= 0 && lngi >= 0){
        var la = parseFloat(o[header[lati]]), lo = parseFloat(o[header[lngi]]);
        if(isFinite(la) && isFinite(lo) && la >= -90 && la <= 90 && lo >= -180 && lo <= 180 && !(la === 0 && lo === 0)){
          var g = {key:asSlug(name), name:name, kind:kind, anchor:[la, lo]};
          header.forEach(function(h){ if(h && h !== subject && !LAT_RE.test(h) && !LNG_RE.test(h)) g[h] = o[h]; });
          geoNodes.push(g);
        }
      }
    });
    var cols = header.filter(Boolean);
    tables[kind] = {kind:kind, subject:subject, columns:cols, data:data, total:data.length, database:database};
    kinds.push({kind:kind, rows:data.length});
  });
  kinds.sort(function(a, b){ return b.rows - a.rows; });
  var on = {}; geoNodes.forEach(function(n){ on[n.key] = 1; });
  return {database:database, kinds:kinds, tables:tables,
    graph:{database:database, nodes:Object.keys(graphNodes).map(function(k){ return graphNodes[k]; }), edges:edges},
    geo:{database:database, nodes:geoNodes, total:geoNodes.length,
         edges:edges.filter(function(e){ return on[e.src] && on[e.tgt]; })}};
}

function openSpreadsheet(files){
  if(!files || !files.length) return;
  // The folder is named after the workbook, or the first CSV that is not the
  // Links file. This is the name a wiki item's `database:` line must match.
  var named = Array.prototype.filter.call(files, function(f){ return !LINK_SHEET.test(f.name.replace(/\.[^.]+$/, '')); });
  var stem = asSlug((named[0] || files[0]).name.replace(/\.[^.]+$/, '')) || 'sheet';
  readSheets(files).then(function(sheets){
    var m = sheetsToProjections(sheets, stem);
    if(!m.kinds.length) throw new Error('no sheet with a header row and at least one named row');
    m.sourceName = Array.prototype.map.call(files, function(f){ return f.name; }).join(', ');
    MEM = m; SRC = ''; srcIndex = srcGraph = null;
    state.db = m.database; state.kind = m.kinds[0].kind;
    $('publish').hidden = false; $('tools').hidden = false;
    loadDatabases().then(loadKinds).then(loadTable).then(function(){
      toast('Opened ' + m.sourceName + ': ' + m.kinds.map(function(k){ return k.rows + ' ' + k.kind; }).join(', ')
            + (m.graph.edges.length ? ', ' + m.graph.edges.length + ' links' : '')
            + (m.geo.total ? ', ' + m.geo.total + ' located' : ''));
    });
  }).catch(function(e){ toast('Could not open: ' + e.message); });
}
$('openfile').addEventListener('click', function(){ $('filepick').value = ''; $('filepick').click(); });
$('filepick').addEventListener('change', function(){ openSpreadsheet(this.files); });
document.querySelector('main').addEventListener('dragover', function(e){ e.preventDefault(); });
document.querySelector('main').addEventListener('drop', function(e){
  e.preventDefault(); openSpreadsheet(e.dataTransfer.files);
});

// PUBLISH: the record files, one by one, for the site's assets item. FedWiki
// users add files to an assets item, not folders, and the item's text names
// the folder — slashes allowed (wiki-plugin-assets server: /[\w\/-]*/). So an
// item reading `rcn-table/<database>` takes these files straight in, and an
// item reading `rcn-table` takes the three tool files once per site. No zip:
// it would be one more thing to unpack, and the assets item cannot take it.
// The browser asks once whether this page may download several files.
function downloadText(name, text, type){
  var a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], {type: type || 'application/json'}));
  a.download = name; a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); }, 5000);
}
function memRecords(){
  var db = MEM.database, idx = {database:db, exported:new Date().toISOString(),
    source:'spreadsheet: ' + MEM.sourceName, kinds:MEM.kinds,
    files:{tables:{}, geo:'geo.json', graph:'graph.json'},
    counts:{concepts:MEM.graph.nodes.length, links:MEM.graph.edges.length}};
  var records = {};
  MEM.kinds.forEach(function(k){
    var f = 'table-' + asSlug(k.kind) + '.json'; idx.files.tables[k.kind] = f;
    records[f] = MEM.tables[k.kind];
  });
  records['geo.json'] = MEM.geo; records['graph.json'] = MEM.graph; records['index.json'] = idx;
  return records;
}
$('publish').addEventListener('click', function(){
  if(!MEM) return;
  var records = memRecords(), names = Object.keys(records);
  names.forEach(function(f, i){
    setTimeout(function(){ downloadText(f, JSON.stringify(records[f], null, 1)); }, i * 250);
  });
  toast(names.length + ' files: drop them on an assets item whose text is  rcn-table/' + MEM.database
        + '  — and, once per site, the three tool files on one named  rcn-table');
});

// The three tool files, for a site that does not have them yet. Fetched from
// beside this page — dist/ first for the graph tool, because the plain one
// needs sidecars a flat assets folder cannot serve.
$('tools').addEventListener('click', function(){
  var here = location.href.split('?')[0];
  var want = [
    ['rcn-table.html', [here]],
    ['rcn-table-map.html', [new URL('rcn-table-map.html', here).href]],
    ['graph-tool-v22.html', [new URL('dist/graph-tool-v22.html', here).href, new URL('graph-tool-v22.html', here).href]]
  ];
  function fetchFirst(urls){
    return urls.reduce(function(p, u){
      return p.then(function(t){ return t != null ? t : fetch(u).then(function(r){ return r.ok ? r.text() : null; }).catch(function(){ return null; }); });
    }, Promise.resolve(null));
  }
  var missing = [];
  Promise.all(want.map(function(w, i){
    return fetchFirst(w[1]).then(function(text){
      if(!text){ missing.push(w[0]); return; }
      setTimeout(function(){ downloadText(w[0], text, 'text/html'); }, i * 250);
    });
  })).then(function(){
    toast((3 - missing.length) + ' tool files: drop them on an assets item whose text is  rcn-table'
          + (missing.length ? ' — could not fetch ' + missing.join(', ') : ''));
  });
});

// ── the opener handshake, same shape as the graph tool ────────────────
if(window.opener){
  window.opener.postMessage({toolType:'rcn-table', action:'tableReady'}, '*');
  window.addEventListener('message', function(ev){
    if(!ev.source || ev.source !== window.opener) return;
    if(ev.data && ev.data.action === 'loadTable'){
      window._pageKey = ev.data.pageKey || null;
      if(ev.data.database) state.db = ev.data.database;
      if(ev.data.kind) state.kind = ev.data.kind;
      if(ev.data.src){ SRC = String(ev.data.src).replace(/\/+$/,'') + '/'; srcIndex = srcGraph = null; }
      boot();
    }
  });
}

function boot(){
  var p = new URLSearchParams(location.search);
  state.db = state.db || p.get('db') || 'whatcom';
  state.kind = state.kind || p.get('kind') || '';
  var first = SRC ? srcIndexOnce().then(function(i){ state.db = i.database; return loadDatabases(); })
                  : loadDatabases();
  first.then(loadKinds).then(loadTable).catch(function(e){
    $('tablewrap').innerHTML = '<div class="empty">Could not reach '
      + (SRC ? 'the export folder at ' + esc(SRC) : 'the substrate at ' + esc(SUBSTRATE_BASE || '(relative)'))
      + '<br><br>' + esc(e.message) + '</div>';
  });
}
boot();
</script>
