span x="0" y="0.0">PROCEDURAL LINKS — happen in time</tspan></text></g><g id="node-n18" transform="translate(-230,802)" style="cursor: move; opacity: 1;"><rect x="-85" y="-26" width="170" height="52" rx="2" fill="#ffffff" stroke="#16a34a" stroke-width="2.5"/><text text-anchor="middle" font-size="13" font-weight="500" fill="#0f172a" pointer-events="none"><tspan x="0" y="0.0">Agent</tspan></text></g><g id="node-n19" transform="translate(230,802)" style="cursor: move; opacity: 1;"><ellipse cx="0" cy="0" rx="90" ry="29" fill="#ffffff" stroke="#2563eb" stroke-width="2.5"/><text text-anchor="middle" font-size="13" font-weight="500" fill="#0f172a" pointer-events="none"><tspan x="0" y="0.0">Process</tspan></text></g><g id="node-n21" transform="translate(-230,914)" style="cursor: move; opacity: 1;"><rect x="-85" y="-26" width="170" height="52" rx="2" fill="#ffffff" stroke="#16a34a" stroke-width="2.5"/><text text-anchor="middle" font-size="13" font-weight="500" fill="#0f172a" pointer-events="none"><tspan x="0" y="0.0">Instrument</tspan></text></g><g id="node-n22" transform="translate(230,914)" style="cursor: move; opacity: 1;"><ellipse cx="0" cy="0" rx="90" ry="29" fill="#ffffff" stroke="#2563eb" stroke-width="2.5"/><text text-anchor="middle" font-size="13" font-weight="500" fill="#0f172a" pointer-events="none"><tspan x="0" y="0.0">Process</tspan></text></g><g id="node-n24" transform="translate(-230,1026)" style="cursor: move; opacity: 1;"><rect x="-85" y="-26" width="170" height="52" rx="2" fill="#ffffff" stroke="#16a34a" stroke-width="2.5"/><text text-anchor="middle" font-size="13" font-weight="500" fill="#0f172a" pointer-events="none"><tspan x="0" y="0.0">Object</tspan></text></g><g id="node-n25" transform="translate(230,1026)" style="cursor: move; opacity: 1;"><ellipse cx="0" cy="0" rx="90" ry="29" fill="#ffffff" stroke="#2563eb" stroke-width="2.5"/><text text-anchor="middle" font-size="13" font-weight="500" fill="#0f172a" pointer-events="none"><tspan x="0" y="0.0">Proces