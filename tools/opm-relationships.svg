refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,1 L10,5 L0,9 Z" fill="#8b5cf6"/></marker><marker id="mk7c3aed" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,1 L10,5 L0,9 Z" fill="#7c3aed"/></marker><marker id="mk0f766e" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,1 L10,5 L0,9 Z" fill="#0f766e"/></marker><marker id="mkb45309" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,1 L10,5 L0,9 Z" fill="#b45309"/></marker></defs>
      
      <g id="wardley-layer" transform="translate(0,0) scale(1)"/>
      <g id="lines-layer" transform="translate(0,0) scale(1)"/>
      <g id="edges-layer" transform="translate(0,0) scale(1)"><g id="edge-e4" style="cursor: pointer; opacity: 1;"><title>📌 Aggregation-participation. Drawn whole → part, and the whole is also the sentence subject. Solid triangle at the whole.</title><path d="M-145,90 L145,90" fill="none" stroke="#0f766e" stroke-width="2" marker-end="url(#mk0f766e)" pointer-events="none"/><text text-anchor="middle" pointer-events="none"><tspan x="0" y="104" font-size="13" font-style="italic" fill="#0f766e">Whole consists of Part</tspan></text><circle cx="0" cy="116" r="4" fill="#f59e0b" stroke="#fff" stroke-width="1" pointer-events="none"/></g><g id="edge-e7" style="cursor: pointer; opacity: 1;"><title>📌 Exhibition-characterization. Converse reading: the Feature CHARACTERIZES the Exhibitor. A feature that is an object is an attribute; one that is a process is an operation. This is the only fundamental structural relation that allows all four object/process combinations.</title><path d="M-145,202 L145,202" fill="none" stroke="#0f766e" stroke-width="2" marker-end="url(#mk0f766e)" pointer-events="none"/><text text-anchor="middle" pointer-events="none"><tspan x="0" y="216" font-size="13" font-style="italic" fill="#0f766e">Exhibitor exhibits Feature</tspan></text><circle cx="0" cy="228" r="4" fill="#f59e0b" stroke="#fff" stroke-width="1" pointer-events="none"/></g><g id="edge-e10" style="cursor: pointer; opacity: 1;"><title>📌 Generalization-specialization. Drawn general → specific, but the SPECIFIC is the sentence subject — the words run against the arrow.</title><path d="M-145,314 L145,314" fill="none" stroke="#0f766e" stroke-width="2" stroke-dasharray="8 5" marker-end="url(#mk0f766e)" pointer-events="none"/><text text-anchor="middle" pointer-events="none"><tspan x="0" y="328" font-size="13" font-style="italic" fill="#0f766e">Specific is a General</tspan></text><circle cx="0" cy="340" r="4" fill="#f59e0b" stroke="#fff" stroke-width="1" pointer-events="none"/></g><g id="edge-e13" style="cursor: pointer; opacity: 1;"><title>📌 Classification-instantiation. Drawn class → instance; the INSTANCE is the sentence subject. Answers "which particular one", where is-a-type-of answers "which kind".</title><path d="M-145,426 L145,426" fill="none" stroke="#0f766e" stroke-width="2" stroke-dasharray="8 5" marker-end="url(#mk0f766e)" pointer-events="none"/><text text-anchor="middle" pointer-events="none"><tspan x="0" y="440" font-size="13" font-style="italic" fill="#0f766e">Instance is an instance of Class</tspan></text><circle cx="0" cy="452" r="4" fill="#f59e0b" stroke="#fff" stroke-width="1" pointer-events="none"/></g><g id="edge-e16" style="cursor: pointer; opacity: 1;"><title>📌 Tagged structural link: you supply the phrase, e.g. "communicates via" in the OnStar example. Unidirectional or bidirectional. Use it when no fundamental relation fits — not as a way to avoid choosing one.</title><path d="M-145,538 L145,538" fill="none" stroke="#0f766e" stroke-width="2" marker-end="url(#mk0f766e)" pointer-events="none"/><text text-anchor="middle" pointer-events="none"><tspan x="0" y="552" font-size="13" font-style="italic" fill="#0f766e">A  ‹your words›  B</tspan></text><circle cx="0" cy="564" r="4" fill="#f59e0b" stroke="#fff" stroke-width="1" pointer-events="none"/></g><g id="edge-e20" style="cursor: pointer; opacity: 1;"><title>📌 Agent link — a human or organisation that does it. Filled circle at the process end. Only people and groups are agents.</title><path d="M-145,802 L140,802" fill="none" stroke="#b45309" stroke-width="2" marker-end="url(#mkb45309)" pointer-events="none"/><text text-anchor="middle" pointer-events="none"><tspan x="-2.5" y="816" font-size="13" font-style="italic" fill="#b45309">Agent handles Process</tspan></text><circle cx="-2.5" cy="828" r="4" fill="#f59e0b" stroke="#fff" stroke-width="1" pointer-events="none"/></g><g id="edge-e23" style="cursor: pointer; opacity: 1;"><title>📌 Instrument link — a tool the process needs and does not consume. Drawn instrument → process, but the PROCESS is the sentence subject. Open circle at the process end.</title><path d="M-145,914 L140,914" fill="none" stroke="#b45309" stroke-width="2" stroke-dasharray="8 5" marker-end="url(#mkb45309)" pointer-events="none"/><text text-anchor="middle" pointer-events="none"><tspan x="-2.5" y="928" font-size="13" font-style="italic" fill="#b45309">Process requires Instrument</tspan></text><circle cx="-2.5" cy="940" r="4" fill="#f59e0b" stroke="#fff" stroke-width="1" pointer-events="none"/></g><g id="edge-e26" style="cursor: pointer; opacity: 1;"><title>📌 Consumption link — the object ceases to exist. Drawn object → process; the process is the sentence subject.</title><path d="M-145,1026 L140,1026" fill="none" stroke="#b45309" stroke-width="2" stroke-dasharray="8 5" marker-end="url(#mkb45309)" pointer-events="none"/><text text-anchor="middle" pointer-events="none"><tspan x="-2.5" y="1040" font-size="13" font-style="italic" fill="#b45309">Process consumes Object</tspan></text><circle cx="-2.5" cy="1052" r="4" fill="#f59e0b" stroke="#fff" stroke-width="1" pointer-events="none"/></g><g id="edge-e29" style="cursor: pointer; opacity: 1;"><title>📌 Result link — the object comes into existence.</title><path d="M-140,1138 L145,1138" fill="none" stroke="#b45309" stroke-width="2" marker-end="url(#mkb45309)" pointer-events="none"/><text text-anchor="middle" pointer-events="none"><tspan x="2.5" y="1152" font-size="13" font-style="italic" fill="#b45309">Process yields Object</tspan></text><circle cx="2.5" cy="1164" r="4" fill="#f59e0b" stroke="#fff" stroke-width="1" pointer-events="none"/></g><g id="edge-e32" style="cursor: pointer; opacity: 1;"><title>📌 Effect link — the object survives but changes state. Shorthand for a consumption and a result on the same object; use the state-level pair when the states matter.</title><path d="M-140,1250 L145,1250" fill="none" stroke="#b45309" stroke-width="2" marker-end="url(#mkb45309)" pointer-events="none"/><text text-anchor="middle" pointer-events="none"><tspan x="2.5" y="1264" font-size="13" font-style="italic" fill="#b45309">Process affects Object</tspan></text><circle cx="2.5" cy="1276" r="4" fill="#f59e0b" stroke="#fff" stroke-width="1" pointer-events="none"/></g><g id="edge-e35" style="cursor: pointer; opacity: 1;"><title>📌 Event link — an object entering a state triggers the process.</title><path d="M-145,1362 L140,1362" fill="none" stroke="#b45309" stroke-width="2" marker-end="url(#mkb45309)" pointer-events="none"/><text text-anchor="middle" pointer-events="none"><tspan x="-2.5" y="1376" font-size="13" font-style="italic" fill="#b45309">Object initiates Process</tspan></text><circle cx="-2.5" cy="1388" r="4" fill="#f59e0b" stroke="#fff" stroke-width="1" pointer-events="none"/></g><g id="edge-e38" style="cursor: pointer; opacity: 1;"><title>📌 Invocation link — when A ends it starts B. The one procedural link that runs process to process.</title><path d="M-140,1474 L140,1474" fill="none" stroke="#b45309" stroke-width="2" marker-end="url(#mkb45309)" pointer-events="none"/><text text-anchor="middle" pointer-events="none"><tspan x="0" y="1488" font-size="13" font-style="italic" fill="#b45309">A invokes B</tspan></text><circle cx="0" cy="1500" r="4" fill="#f59e0b" stroke="#fff" stroke-width="1" pointer-events="none"/></g></g>
