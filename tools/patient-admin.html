<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Patient Provisioning — My PHS</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --navy: #1e3a5f;
  --teal: #0f766e;
  --bg:   #f8f9fa;
  --surface: #ffffff;
  --border: #e5e7eb;
  --text: #1a1a2e;
  --muted: #6b7280;
}
body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); font-size: 15px; line-height: 1.5; }
#header { background: var(--navy); color: white; padding: 12px 20px; display: flex; align-items: center; gap: 12px; }
#header h1 { font-size: 16px; font-weight: 600; flex: 1; }
.hbtn { background: rgba(255,255,255,.15); color: white; border: 1px solid rgba(255,255,255,.3); border-radius: 5px; padding: 5px 11px; font-size: 13px; cursor: pointer; text-decoration: none; }
.hbtn:hover { background: rgba(255,255,255,.28); }
main { max-width: 700px; margin: 32px auto; padding: 0 20px 60px; }

/* ── Add form ── */
.card { background: var(--surface); border: 1.5px solid var(--border); border-radius: 10px; padding: 24px; margin-bottom: 28px; }
.card h2 { font-size: 16px; font-weight: 700; color: var(--navy); margin-bottom: 18px; }
.form-row { display: flex; gap: 12px; margin-bottom: 14px; }
.form-group { flex: 1; }
.form-group.narrow { flex: 0 0 180px; }
label { display: block; font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-bottom: 5px; }
input { width: 100%; border: 1.5px solid var(--border); border-radius: 7px; padding: 9px 12px; font: inherit; font-size: 14px; color: var(--text); }
input:focus { outline: none; border-color: var(--teal); }
input.derived { color: var(--muted); background: #f9fafb; }
.btn-primary { background: var(--navy); color: white; border: none; border-radius: 8px; padding: 10px 22px; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; }
.btn-primary:hover { background: #2a4f7c; }
.btn-primary:disabled { opacity: .4; cursor: default; }
#form-result { margin-top: 14px; min-height: 20px; font-size: 13px; }
#form-result.ok { color: var(--teal); }
#form-result.err { color: #dc2626; }

/* ── Success card ── */
.success-card { background: #f0fdf4; border: 1.5px solid #22c55e; border-radius: 8px; padding: 16px 18px; margin-top: 14px; display: none; }
.success-card h3 { font-size: 14px; font-weight: 700; color: #166534; margin-bottom: 10px; }
.link-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 4px; }
.link-row a { display: inline-block; background: var(--teal); color: white; border-radius: 6px; padding: 6px 14px; font-size: 13px; font-weight: 600; text-decoration: none; }
.link-row a:hover { opacity: .88; }
.restart-notice { margin-top: 10px; background: #fef3c7; border: 1px solid #fcd34d; border-radius: 6px; padding: 8px 12px; font-size: 12px; color: #78350f; display: none; }

/* ── Patient list ── */
.section-label { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 10px; }
.patient-row { background: var(--surface); border: 1.5px solid var(--border); border-radius: 8px; padding: 12px 16px; margin-bottom: 8px; display: flex; align-items: center; gap: 12px; }
.patient-name { flex: 1; font-weight: 600; font-size: 15px; }
.patient-slug { font-size: 12px; color: var(--muted); font-family: monospace; }
.patient-links { display: flex; gap: 8px; }
.patient-links a { font-size: 12px; color: var(--teal); font-weight: 600; text-decoration: none; border: 1px solid var(--teal); border-radius: 5px; padding: 3px 9px; }
.patient-links a:hover { background: var(--teal); color: white; }
.empty { font-size: 13px; color: var(--muted); font-style: italic; padding: 8px 0; }
#list-error { font-size: 13px; color: #dc2626; margin-top: 6px; }
</style>
</head>
<body>

<div id="header">
  <h1>Patient Provisioning</h1>
  <a class="hbtn" href="/tools/my-health-picture.html">Health Picture</a>
  <a class="hbtn" href="http://localhost:3000" target="_blank">FedWiki ↗</a>
</div>

<main>

  <div class="card">
    <h2>Add New Patient</h2>
    <div class="form-row">
      <div class="form-group">
        <label for="f-name">Full name</label>
        <input id="f-name" type="text" placeholder="e.g. Rosa Delgado" autocomplete="off" oninput="deriveSlug()">
      </div>
      <div class="form-group narrow">
        <label for="f-slug">Record ID (slug)</label>
        <input id="f-slug" type="text" placeholder="rosa-delgado" autocomplete="off" class="derived" oninput="slugEdited=true">
      </div>
    </div>
    <button class="btn-primary" id="btn-add" onclick="provision()">Create Patient Record</button>
    <div id="form-result"></div>
    <div class="success-card" id="success-card">
      <h3 id="success-name"></h3>
      <div class="link-row" id="success-links"></div>
      <div id="reclaim-box" style="margin-top:12px;display:none">
        <div style="font-size:11px;font-weight:700;color:#166534;letter-spacing:.06em;text-transform:uppercase;margin-bottom:4px">FedWiki Reclaim Code</div>
        <div id="reclaim-code" style="font-family:monospace;font-size:12px;background:#dcfce7;border:1px solid #86efac;border-radius:5px;padding:8px 10px;word-break:break-all;color:#14532d"></div>
        <div style="font-size:11px;color:#166534;margin-top:4px">Enter this code when FedWiki asks you to reclaim the site.</div>
      </div>
      <div class="restart-notice" id="restart-notice">
        FedWiki needs to be restarted to serve this new site. Restart it now, then use the links above.
      </div>
    </div>
  </div>

  <div class="section-label">Existing Patients</div>
  <div id="patient-list"><div class="empty">Loading…</div></div>
  <div id="list-error"></div>

</main>

<script>
var PROXY = window.location.origin;
var slugEdited = false;

// ─── Operator passphrase ─────────────────────────────────────────────────────
// This is an admin tool; the proxy requires the passphrase for these endpoints.
// It is held on this machine only — the proxy never serves it.
var LS_SECRET = 'sodoto-proxy-secret';
var PROXY_SECRET = localStorage.getItem(LS_SECRET) || '';

function authHeaders(extra) {
  var h = extra || {};
  if (PROXY_SECRET) h['Authorization'] = 'Bearer ' + PROXY_SECRET;
  return h;
}

function askForSecret(message) {
  return new Promise(function (resolve) {
    var wrap = document.createElement('div');
    wrap.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;' +
                         'align-items:center;justify-content:center;z-index:9999';
    wrap.innerHTML =
      '<form style="background:#fff;padding:24px;border-radius:8px;max-width:420px;width:90%;' +
      'box-shadow:0 4px 24px rgba(0,0,0,.3)">' +
      '<h3 style="margin:0 0 8px">Patient admin</h3>' +
      '<p style="margin:0 0 12px;font-size:14px">' + message + '</p>' +
      '<input type="password" autocomplete="off" placeholder="Proxy passphrase" ' +
      'style="width:100%;padding:8px;box-sizing:border-box">' +
      '<label style="display:block;margin:10px 0;font-size:13px">' +
      '<input type="checkbox" checked> Remember on this computer</label>' +
      '<button type="submit" style="padding:8px 16px">Continue</button></form>';
    var input = wrap.querySelector('input[type=password]');
    var save  = wrap.querySelector('input[type=checkbox]');
    wrap.querySelector('form').addEventListener('submit', function (e) {
      e.preventDefault();
      var value = input.value.trim();
      if (!value) return input.focus();
      if (save.checked) localStorage.setItem(LS_SECRET, value);
      else              localStorage.removeItem(LS_SECRET);
      wrap.remove();
      resolve(value);
    });
    document.body.appendChild(wrap);
    input.focus();
  });
}

// Send a request, asking for the passphrase if the proxy rejects it.
async function authFetch(url, options) {
  options = options || {};
  if (!PROXY_SECRET) {
    PROXY_SECRET = await askForSecret('Enter the proxy passphrase to manage patient records.');
  }
  var send = function () {
    var o = { method: options.method, body: options.body };
    o.headers = authHeaders(Object.assign({}, options.headers));
    return fetch(url, o);
  };
  var resp = await send();
  if (resp.status === 401) {
    localStorage.removeItem(LS_SECRET);
    PROXY_SECRET = await askForSecret('That passphrase was rejected. Try again.');
    resp = await send();
  }
  return resp;
}
// ─────────────────────────────────────────────────────────────────────────────

function deriveSlug() {
  if (slugEdited) return;
  var name = document.getElementById('f-name').value;
  var slug = name.trim().toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
  var el = document.getElementById('f-slug');
  el.value = slug;
  el.classList.toggle('derived', true);
}

async function provision() {
  var name = document.getElementById('f-name').value.trim();
  var slug = document.getElementById('f-slug').value.trim();
  var result = document.getElementById('form-result');
  var btn = document.getElementById('btn-add');

  result.className = '';
  result.textContent = '';
  document.getElementById('success-card').style.display = 'none';

  if (!name) { result.className = 'err'; result.textContent = 'Please enter a full name.'; return; }
  if (!slug)  { result.className = 'err'; result.textContent = 'Please enter a record ID.'; return; }
  if (!/^[a-z0-9][a-z0-9-]*[a-z0-9]$/.test(slug)) {
    result.className = 'err'; result.textContent = 'Record ID must be lowercase letters, numbers, and hyphens only.'; return;
  }

  btn.disabled = true;
  btn.textContent = 'Creating…';

  try {
    var resp = await authFetch(PROXY + '/api/provision-patient', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: name, slug: slug })
    });
    var data = await resp.json();
    if (!resp.ok || data.error) throw new Error(data.error || 'Server error');

    // Show success
    document.getElementById('success-name').textContent = name + ' — record created';
    var links = document.getElementById('success-links');
    links.innerHTML =
      '<a href="' + data.mhpUrl + '" target="_blank">Health Picture</a>' +
      '<a href="' + data.wikiUrl + '" target="_blank">FedWiki SCP ↗</a>' +
      '<a href="/tools/scp-chat.html?site=' + encodeURIComponent(data.site) + '" target="_blank">Appointment Prep</a>' +
      '<a href="/tools/my-health-choices.html?site=' + encodeURIComponent(data.site) + '" target="_blank">Health Choices</a>' +
      '<a href="/tools/my-support-network.html?site=' + encodeURIComponent(data.site) + '" target="_blank">Support Network</a>';
    if (data.reclaimCode) {
      document.getElementById('reclaim-code').textContent = data.reclaimCode;
      document.getElementById('reclaim-box').style.display = 'block';
    }
    document.getElementById('restart-notice').style.display = data.needsWikiRestart ? 'block' : 'none';
    document.getElementById('success-card').style.display = 'block';

    // Clear form
    document.getElementById('f-name').value = '';
    document.getElementById('f-slug').value = '';
    slugEdited = false;

    // Refresh list
    loadPatients();
  } catch(e) {
    result.className = 'err';
    result.textContent = e.message || 'Failed to create patient record.';
  }

  btn.disabled = false;
  btn.textContent = 'Create Patient Record';
}

async function loadPatients() {
  var list = document.getElementById('patient-list');
  var err  = document.getElementById('list-error');
  err.textContent = '';
  try {
    var resp = await authFetch(PROXY + '/api/list-patients');
    var data = await resp.json();
    if (data.error) throw new Error(data.error);
    var patients = data.patients || [];
    if (!patients.length) {
      list.innerHTML = '<div class="empty">No patients provisioned yet.</div>';
      return;
    }
    list.innerHTML = patients.map(function(p) {
      return '<div class="patient-row">'
        + '<div>'
        + '<div class="patient-name">' + p.name + '</div>'
        + '<div class="patient-slug">' + p.site + '</div>'
        + '</div>'
        + '<div class="patient-links">'
        + '<a href="/tools/my-health-picture.html?person=' + p.slug + '" target="_blank">Health Picture</a>'
        + '<a href="http://' + p.site + ':3000" target="_blank">FedWiki ↗</a>'
        + '<a href="/tools/scp-chat.html?site=' + encodeURIComponent(p.site) + '" target="_blank">Appt Prep</a>'
        + '<a href="/tools/my-health-choices.html?site=' + encodeURIComponent(p.site) + '" target="_blank">Health Choices</a>'
        + '<a href="/tools/my-support-network.html?site=' + encodeURIComponent(p.site) + '" target="_blank">Support Network</a>'
        + '</div>'
        + '</div>';
    }).join('');
  } catch(e) {
    err.textContent = 'Could not load patient list: ' + e.message;
    list.innerHTML = '';
  }
}

// Allow pressing Enter in name field
document.getElementById('f-name').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') document.getElementById('f-slug').focus();
});
document.getElementById('f-slug').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') provision();
});

loadPatients();
</script>
</body>
</html>
