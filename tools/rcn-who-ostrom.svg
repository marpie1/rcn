<svg xmlns="http://www.w3.org/2000/svg" width="1053" height="818" viewBox="0 0 1053 818"><rect width="1053" height="818" fill="#ffffff"/>
      <defs id="svg-defs"><marker id="mk000000" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,1 L10,5 L0,9 Z" fill="#000000"/></marker><marker id="mkc53030" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,1 L10,5 L0,9 Z" fill="#c53030"/></marker><marker id="mkc05621" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,1 L10,5 L0,9 Z" fill="#c05621"/></marker><marker id="mkb7791f" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,1 L10,5 L0,9 Z" fill="#b7791f"/></marker><marker id="mk276749" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,1 L10,5 L0,9 Z" fill="#276749"/></marker><marker id="mk2b4c7e" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,1 L10,5 L0,9 Z" fill="#2b4c7e"/></marker><marker id="mk553c9a" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,1 L10,5 L0,9 Z" fill="#553c9a"/></marker><marker id="mk97266d" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,1 L10,5 L0,9 Z" fill="#97266d"/></marker><marker id="mk234e52" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,1 L10,5 L0,9 Z" fill="#234e52"/></marker><marker id="mk1a202c" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,1 L10,5 L0,9 Z" fill="#1a202c"/></marker><marker id="mk3b82f6" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,1 L10,5 L0,9 Z" fill="#3b82f6"/></marker><marker id="mkf59e0b" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,1 L10,5 L0,9 Z" fill="#f59e0b"/></marker><marker id="mk8b5cf6" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,1 L10,5 L0,9 Z" fill="#8b5cf6"/></marker><marker id="mk7c3aed" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,1 L10,5 L0,9 Z" fill="#7c3aed"/></marker><marker id="mkA83C2E" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,1 L10,5 L0,9 Z" fill="#A83C2E"/></marker><marker id="mk8A5F10" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,1 L10,5 L0,9 Z" fill="#8A5F10"/></marker><marker id="mk5A635E" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,1 L10,5 L0,9 Z" fill="#5A635E"/></marker><marker id="mk333333" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,1 L10,5 L0,9 Z" fill="#333333"/></marker></defs>
      
      <g id="wardley-layer"/>
      <g id="lop-layer"/>
      <g id="lines-layer"/>
      <g id="edges-layer"><g id="edge-h1" style="cursor: pointer; opacity: 1;"><title>📌 HEAVY in Marc's diagram. The first link of the highest-leverage chain in the model.</title><path d="M90,126 L90,214" fill="none" stroke="#A83C2E" stroke-width="4.5" marker-end="url(#mkA83C2E)" pointer-events="none"/><circle cx="64" cy="170" r="4" fill="#f59e0b" stroke="#fff" stroke-width="1" pointer-events="none"/></g><g id="edge-h2" style="cursor: pointer; opacity: 1;"><title>📌 HEAVY. Legal standing determines the strategy space a neighbourhood can see.</title><path d="M90,286 L90,374" fill="none" stroke="#A83C2E" stroke-width="4.5" marker-end="url(#mkA83C2E)" pointer-events="none"/><circle cx="64" cy="330" r="4" fill="#f59e0b" stroke="#fff" stroke-width="1" pointer-events="none"/></g><g id="edge-h3" style="cursor: grab; opacity: 1;"><title>📌 And the perceived strategy space determines whether collective action forms at all. Three links, one claim: much of neighbourhood capacity is foreclosed upstream.</title><path d="M134.8479906814211,374 Q517.8,66.6 950,133.08004426410918" fill="none" stroke="#A83C2E" stroke-width="4.5" marker-end="url(#mkA83C2E)" pointer-events="none"/><circle cx="526.1941984105312" cy="130.3269303755588" r="4" fill="#f59e0b" stroke="#fff" stroke-width="1" pointer-events="none"/></g><g id="edge-h4" style="cursor: grab; opacity: 1;"><title>📌 HEAVY. The second emphasised edge, and it lands on Survival rather than Performance.</title><path d="M786.8819875776397,360 Q868.2,481 950,493.36809176225233" fill="none" stroke="#A83C2E" stroke-width="4.5" marker-end="url(#mkA83C2E)" pointer-events="none"/><circle cx="868.1873915735154" cy="483.8417276553357" r="4" fill="#f59e0b" stroke="#fff" stroke-width="1" pointer-events="none"/></g><g id="edge-hb1" style="cursor: grab; opacity: 1;"><title>📌 Common Understanding feeds Trust.</title><path d="M401.08,193 Q382.6,235 404.16,284" fill="none" stroke="#5A635E" stroke-width="1.8" marker-end="url(#mk5A635E)" pointer-events="none"/><circle cx="363.0582091569253" cy="231.58360299946244" r="4" fill="#f59e0b" stroke="#fff" stroke-width="1" pointer-events="none"/></g><g id="edge-hb2" style="cursor: grab; opacity: 1;"><title>📌 And Trust feeds Common Understanding. The reinforcing pair at the centre of the model.</title><path d="M435.84,284 Q457.4,235 438.92,193" fill="none" stroke="#5A635E" stroke-width="1.8" marker-end="url(#mk5A635E)" pointer-events="none"/><circle cx="476.9417908430747" cy="231.58360299946244" r="4" fill="#f59e0b" stroke="#fff" stroke-width="1" pointer-events="none"/></g><g id="edge-hb3" style="cursor: grab; opacity: 1;"><title>📌 Common Understanding makes conflict resolvable.</title><path d="M455.6808510638298,193 Q552.6,309.8 665,315.327868852459" fill="none" stroke="#5A635E" stroke-width="1.8" marker-end="url(#mk5A635E)" pointer-events="none"/><circle cx="552.3362484106395" cy="311.69577441968056" r="4" fill="#f59e0b" stroke="#fff" stroke-width="1" pointer-events="none"/></g><g id="edge-hb4" style="cursor: grab; opacity: 1;"><title>📌 And resolving conflict builds common understanding. A second reinforcing pair.</title><path d="M726.8085106382979,280 Q627.4,160.2 525,155.1639344262295" fill="none" stroke="#5A635E" stroke-width="1.8" marker-end="url(#mk5A635E)" pointer-events="none"/><circle cx="627.4338558902704" cy="158.9011703198206" r="4" fill="#f59e0b" stroke="#fff" stroke-width="1" pointer-events="none"/></g><g id="edge-hb5" style="cursor: grab; opacity: 1;"><title>📌 The hub reaches the outcomes through decision cost.</title><path d="M394.871875,193 Q326.5,310 398.9625,434" fill="none" stroke="#5A635E" stroke-width="1.8" marker-end="url(#mk5A635E)" pointer-events="none"/><circle cx="331.74558220788344" cy="310.2607252345543" r="4" fill="#f59e0b" stroke="#fff" stroke-width="1" pointer-events="none"/></g><g id="edge-dc1" style="cursor: grab; opacity: 1;"><title>📌 Lower decision cost makes forming possible.</title><path d="M515,465.327868852459 Q810.4,450.8 1024.3191489361702,193" fill="none" stroke="#5A635E" stroke-width="1.8" marker-end="url(#mk5A635E)" pointer-events="none"/><circle cx="799.5576689813047" cy="418.4287503249218" r="4" fill="#f59e0b" stroke="#fff" stroke-width="1" pointer-events="none"/></g><g id="edge-dc2" style="cursor: grab; opacity: 1;"><title>📌 And keeps it working once formed.</title><path d="M515,489.1733181299886 Q770.8,540.8 1001.0075901328273,373" fill="none" stroke="#5A635E" stroke-width="1.8" marker-end="url(#mk5A635E)" pointer-events="none"/><circle cx="767.8773311585348" cy="515.7413388807059" r="4" fill="#f59e0b" stroke="#fff" stroke-width="1" pointer-events="none"/></g><g id="edge-s1" style="cursor: pointer; opacity: 1;"><title>📌 Ostrom's spine, stage one to two. You cannot manage what never properly formed.</title><path d="M1060,193 L1060,287" fill="none" stroke="#333333" stroke-width="4" marker-end="url(#mk333333)" pointer-events="none"/><text text-anchor="middle" pointer-events="none" transform="rotate(90.0,1046.0,240.0)"><tspan x="1046" y="240" font-size="10" font-style="italic" fill="#333333">then</tspan></text><circle cx="1034" cy="240" r="4" fill="#f59e0b" stroke="#fff" stroke-width="1" pointer-events="none"/></g><g id="edge-s2" style="cursor: pointer; opacity: 1;"><title>📌 Stage two to three. Performing well is necessary and not sufficient — survival has its own drivers.</title><path d="M1060,373 L1060,467" fill="none" stroke="#333333" stroke-width="4" marker-end="url(#mk333333)" pointer-events="none"/><text text-anchor="middle" pointer-events="none" transform="rotate(90.0,1046.0,420.0)"><tspan x="1046" y="420" font-size="10" font-style="italic" fill="#333333">then</tspan></text><circle cx="1034" cy="420" r="4" fill="#f59e0b" stroke="#fff" stroke-width="1" pointer-events="none"/></g></g>
      <g id="nodes-layer"><g id="node-gov" transform="translate(90,90)" style="cursor: move; opacity: 1;"><title>📌 External to the neighbourhood, and the origin of the heaviest chain in the model. Much local capacity is decided here before anyone local makes a choice.</title><rect x="-90" y="-36" width="180" height="72" rx="2" fill="#ffffff" stroke="#5A635E" stroke-width="2"/><text text-anchor="middle" font-size="12" font-weight="500" fill="#171B19" pointer-events="none"><tspan x="0" y="0.0">Governmental Agencies</tspan></text><circle cx="86" cy="-32" r="4" fill="#f59e0b" stroke="#fff" stroke-width="1" pointer-events="none"/></g><g id="node-legal" transform="translate(90,250)" style="cursor: move; opacity: 1;"><title>📌 What government grants by way of legal standing and local prerogative. Drawn heavy by Marc on both sides — it receives one heavy edge and sends another.</title><rect x="-90" y="-36" width="180" height="72" rx="2" fill="#ffffff" stroke="#5A635E" stroke-width="2"/><text text-anchor="middle" font-size="12" font-weight="500" fill="#5E1F16" pointer-events="none"><tspan x="0" y="-8.0">Legal Status, Local</tspan><tspan x="0" dy="16">Prerogative</tspan></text><circle cx="86" cy="-32" r="4" fill="#f59e0b" stroke="#fff" stroke-width="1" pointer-events="none"/></g><g id="node-alt" transform="translate(90,410)" style="cursor: move; opacity: 1;"><title>📌 The pivot. What a neighbourhood can even PERCEIVE as available to it. Foreclose this and the collective action never originates — no amount of local energy compensates.</title><rect x="-90" y="-36" width="180" height="72" rx="2" fill="#ffffff" stroke="#5A635E" stroke-width="2"/><text text-anchor="middle" font-size="12" font-weight="500" fill="#5E1F16" pointer-events="none"><tspan x="0" y="-8.0">Perceived Alternative</tspan><tspan x="0" dy="16">Strategies</tspan></text><circle cx="86" cy="-32" r="4" fill="#f59e0b" stroke="#fff" stroke-width="1" pointer-events="none"/></g><g id="node-hub" transform="translate(420,150)" style="cursor: move; opacity: 1;"><title>📌 Highest-degree node in the full 31-variable model — seven in, three out. Nearly every RCN tool that produces a shared picture acts on this one variable, which was not designed.</title><polygon points="90.9,21.5 0.0,43.0 -90.9,21.5 -90.9,-21.5 -0.0,-43.0 90.9,-21.5" fill="#FFF8E1" stroke="#8A5F10" stroke-width="3.5"/><text text-anchor="middle" font-size="13" font-weight="500" fill="#4A3505" pointer-events="none"><tspan x="0" y="0.0">COMMON UNDERSTANDING</tspan></text><circle cx="101" cy="-39" r="4" fill="#f59e0b" stroke="#fff" stroke-width="1" pointer-events="none"/></g><g id="node-trust" transform="translate(420,320)" style="cursor: move; opacity: 1;"><title>📌 Locked in a mutually reinforcing pair with Common Understanding — each feeds the other. Also fed by Similarities, Experience, Group Size and Distance to Resource.</title><polygon points="77.9,18.0 0.0,36.0 -77.9,18.0 -77.9,-18.0 -0.0,-36.0 77.9,-18.0" fill="#FFF8E1" stroke="#8A5F10" stroke-width="3.5"/><text text-anchor="middle" font-size="13" font-weight="500" fill="#4A3505" pointer-events="none"><tspan x="0" y="0.0">TRUST</tspan></text><circle cx="86" cy="-32" r="4" fill="#f59e0b" stroke="#fff" stroke-width="1" pointer-events="none"/></g><g id="node-dcost" transform="translate(420,470)" style="cursor: move; opacity: 1;"><title>📌 The route by which Common Understanding reaches Origin and Performance. Shared understanding is not sentiment here — it is a cost reduction.</title><rect x="-95" y="-36" width="190" height="72" rx="2" fill="#ffffff" stroke="#5A635E" stroke-width="2"/><text text-anchor="middle" font-size="12" font-weight="500" fill="#171B19" pointer-events="none"><tspan x="0" y="0.0">Decision-making Costs</tspan></text><circle cx="91" cy="-32" r="4" fill="#f59e0b" stroke="#fff" stroke-width="1" pointer-events="none"/></g><g id="node-conflict" transform="translate(760,320)" style="cursor: move; opacity: 1;"><title>📌 Feeds Survival on the second heavy edge, and exchanges with Common Understanding in both directions. Groups do not usually die of poor execution; they die of unresolved conflict.</title><rect x="-95" y="-40" width="190" height="80" rx="2" fill="#ffffff" stroke="#5A635E" stroke-width="2"/><text text-anchor="middle" font-size="13" font-weight="500" fill="#5E1F16" pointer-events="none"><tspan x="0" y="0.0">Conflict Resolution</tspan></text><circle cx="91" cy="-36" r="4" fill="#f59e0b" stroke="#fff" stroke-width="1" pointer-events="none"/></g><g id="node-origin" transform="translate(1060,150)" style="cursor: move; opacity: 1;"><title>📌 Green — forming. Driven by Perceived Alternative Strategies, Decision-making Costs, Interdependence and subtractability, Asset Structure, Resource Scarcity. Reds concentrated here mean the collective action never properly originated, and no amount of management will help.</title><rect x="-110" y="-43" width="220" height="86" rx="10" fill="#E8F3EA" stroke="#2F6B3C" stroke-width="3"/><text text-anchor="middle" font-size="13" font-weight="500" fill="#17401F" pointer-events="none"><tspan x="0" y="0.0">ORIGIN will it form?</tspan></text><circle cx="106" cy="-39" r="4" fill="#f59e0b" stroke="#fff" stroke-width="1" pointer-events="none"/></g><g id="node-perf" transform="translate(1060,330)" style="cursor: move; opacity: 1;"><title>📌 Blue — managing. Driven by Enforcement Costs, Decision-making Costs, Dual Enforcement, Technology for Monitoring Resources, Speed of Access to Info. Reds here route to Sofi-VSM.</title><rect x="-110" y="-43" width="220" height="86" rx="10" fill="#E7F0F7" stroke="#2C5F8A" stroke-width="3"/><text text-anchor="middle" font-size="13" font-weight="500" fill="#1B3B57" pointer-events="none"><tspan x="0" y="0.0">PERFORMANCE does it work?</tspan></text><circle cx="106" cy="-39" r="4" fill="#f59e0b" stroke="#fff" stroke-width="1" pointer-events="none"/></g><g id="node-surv" transform="translate(1060,510)" style="cursor: move; opacity: 1;"><title>📌 Red — surviving. Driven above all by Conflict Resolution, plus de facto vs de jure, Small Simple Set of Rules, Larger System of Institutional Support and Rate of Change. Reds here mean conflict work comes first and everything else second.</title><rect x="-110" y="-43" width="220" height="86" rx="10" fill="#F7E9E6" stroke="#A83C2E" stroke-width="3"/><text text-anchor="middle" font-size="13" font-weight="500" fill="#5E1F16" pointer-events="none"><tspan x="0" y="0.0">SURVIVAL will it persist?</tspan></text><circle cx="106" cy="-39" r="4" fill="#f59e0b" stroke="#fff" stroke-width="1" pointer-events="none"/></g></g>
      <g id="triples-layer"/>
