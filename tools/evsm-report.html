<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>eVSM — Respondent Report</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=Libre+Baskerville:ital,wght@0,700;1,400&display=swap');

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --paper:   #f5f2eb;
  --ink:     #1a1a18;
  --muted:   #6b6b60;
  --rule:    #d4cfc4;
  --accent:  #2a5c3f;
  --go:      #4a9e5c;
  --caution: #d4a017;
  --stop:    #c0392b;
  --unknown: #2471a3;
  --unset:   #aaa;
}

body {
  font-family: 'IBM Plex Sans', sans-serif;
  background: #e8e4d8;
  color: var(--ink);
  min-height: 100vh;
}

/* ── LOAD SCREEN ── */
#load-screen {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  min-height: 100vh; padding: 40px;
}
.load-card {
  background: var(--paper); border: 1px solid var(--rule); border-radius: 4px;
  padding: 48px 56px; max-width: 480px; width: 100%; text-align: center;
}
.load-card h1 {
  font-family: 'Libre Baskerville', serif; font-size: 28px; margin-bottom: 4px;
}
.load-card .sub {
  font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--muted);
  letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 32px;
}
.drop-zone {
  border: 2px dashed var(--rule); border-radius: 4px; padding: 40px 24px;
  cursor: pointer; transition: all 0.15s; margin-bottom: 16px;
}
.drop-zone:hover, .drop-zone.drag-over {
  border-color: var(--accent); background: #eef4f0;
}
.drop-zone .icon { font-size: 32px; margin-bottom: 12px; opacity: 0.4; }
.drop-zone p { font-size: 13px; color: var(--muted); line-height: 1.5; }
.drop-zone strong { color: var(--ink); }
#file-input { display: none; }
.load-btn {
  width: 100%; padding: 12px; background: var(--accent); color: #fff;
  border: none; border-radius: 2px; font-family: 'IBM Plex Mono', monospace;
  font-size: 12px; font-weight: 500; letter-spacing: 0.05em; cursor: pointer;
  transition: background 0.15s;
}
.load-btn:hover { background: #1e4530; }
.load-error { color: var(--stop); font-size: 12px; margin-top: 12px; }
.attr {
  font-size: 10px; color: var(--muted); margin-top: 24px; line-height: 1.6;
  font-family: 'IBM Plex Mono', monospace;
}

/* ── REPORT ── */
#report { display: none; }

@media screen {
  #report {
    max-width: 820px; margin: 0 auto; padding: 32px 24px 80px;
  }
  .print-btn {
    position: fixed; bottom: 24px; right: 24px;
    background: var(--accent); color: #fff; border: none; border-radius: 2px;
    padding: 12px 20px; font-family: 'IBM Plex Mono', monospace; font-size: 12px;
    font-weight: 500; letter-spacing: 0.05em; cursor: pointer;
    box-shadow: 0 2px 8px rgba(0,0,0,0.2); transition: background 0.15s;
    z-index: 100;
  }
  .print-btn:hover { background: #1e4530; }
  .load-another-btn {
    position: fixed; bottom: 24px; left: 24px;
    background: var(--paper); color: var(--ink); border: 1px solid var(--rule);
    border-radius: 2px; padding: 12px 20px; font-family: 'IBM Plex Mono', monospace;
    font-size: 12px; font-weight: 500; letter-spacing: 0.05em; cursor: pointer;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1); transition: all 0.15s; z-index: 100;
  }
  .load-another-btn:hover { background: var(--ink); color: var(--paper); }
}

@media print {
  body { background: #fff; }
  .print-btn, .load-another-btn { display: none; }
  #report { display: block !important; padding: 0; max-width: 100%; }
  .sphere-section { page-break-inside: avoid; }
  .edge-block { page-break-inside: avoid; }
}

/* Report header */
.report-header {
  display: grid; grid-template-columns: 1fr auto;
  gap: 24px; align-items: start;
  background: var(--paper); border: 1px solid var(--rule);
  border-radius: 4px; padding: 24px 28px; margin-bottom: 32px;
}
.report-header .meta-block { }
.report-header .meta-row {
  display: grid; grid-template-columns: 110px 1fr; gap: 8px;
  margin-bottom: 6px; align-items: baseline;
}
.report-header .meta-label {
  font-family: 'IBM Plex Mono', monospace; font-size: 10px;
  font-weight: 500; color: var(--muted); text-transform: uppercase;
  letter-spacing: 0.08em;
}
.report-header .meta-value {
  font-size: 13px; font-weight: 600; color: var(--ink);
}
.report-header .meta-value.focal {
  font-size: 12px; font-weight: 400; font-style: italic; line-height: 1.5;
}
.worlds-list {
  margin-top: 4px; display: flex; flex-wrap: wrap; gap: 4px;
}
.world-tag {
  background: #e8e4d8; border: 1px solid var(--rule); border-radius: 2px;
  padding: 2px 8px; font-size: 11px; font-family: 'IBM Plex Mono', monospace;
}
.sofi-logo {
  font-family: 'Libre Baskerville', serif; font-size: 22px; font-weight: 700;
  color: var(--ink); text-align: right; white-space: nowrap;
}
.sofi-logo span {
  display: block; font-family: 'IBM Plex Mono', monospace;
  font-size: 9px; font-weight: 400; color: var(--muted);
  letter-spacing: 0.1em; text-transform: uppercase; margin-top: 2px;
}

/* Sphere section */
.sphere-section {
  background: var(--paper); border: 1px solid var(--rule); border-radius: 4px;
  margin-bottom: 24px; overflow: hidden;
}
.sphere-header {
  display: flex; align-items: center; gap: 14px;
  padding: 14px 20px; border-bottom: 1px solid var(--rule);
}
.sphere-dot {
  width: 14px; height: 14px; border-radius: 50%; flex-shrink: 0;
}
.sphere-title {
  font-family: 'Libre Baskerville', serif; font-size: 15px; font-weight: 700;
  flex: 1;
}
.sphere-id {
  font-family: 'IBM Plex Mono', monospace; font-size: 9px; color: var(--muted);
}
.traffic-summary {
  padding: 10px 20px; border-bottom: 1px solid var(--rule);
  background: rgba(0,0,0,0.02);
}
.traffic-question {
  font-size: 11px; color: var(--muted); margin-bottom: 6px; font-style: italic;
}
.traffic-row {
  display: flex; gap: 16px; flex-wrap: wrap;
}
.traffic-item {
  display: flex; align-items: center; gap: 5px; font-size: 12px;
}
.traffic-swatch {
  width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0;
}
.traffic-label { font-weight: 600; }
.traffic-pct { color: var(--muted); font-size: 11px; }

/* Edge block */
.edge-block {
  padding: 16px 20px; border-bottom: 1px solid var(--rule);
}
.edge-block:last-child { border-bottom: none; }
.edge-statement {
  font-size: 13px; font-weight: 600; margin-bottom: 10px; line-height: 1.4;
}
.edge-statement .impacts {
  font-weight: 400; color: var(--muted); font-size: 12px;
}
.edge-counts {
  display: flex; gap: 20px; margin-bottom: 12px; flex-wrap: wrap;
}
.edge-count-item {
  display: flex; align-items: center; gap: 6px; font-size: 12px;
}
.count-swatch {
  width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
}
.count-label { color: var(--muted); }
.count-n { font-weight: 600; }
.count-pct { color: var(--muted); font-size: 11px; }

.text-boxes {
  display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
  margin-top: 12px;
}
.text-box {
  border: 1px solid var(--rule); border-radius: 2px; padding: 10px 12px;
}
.text-box-label {
  font-family: 'IBM Plex Mono', monospace; font-size: 9px; font-weight: 500;
  text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted);
  margin-bottom: 6px;
}
.text-box-content {
  font-size: 11px; line-height: 1.6; font-style: italic; color: var(--ink);
}
.text-box-content p { margin-bottom: 4px; }
.text-box-content p:last-child { margin-bottom: 0; }
.text-none { color: var(--muted); font-style: italic; font-size: 11px; }

/* Not assessed */
.not-assessed {
  font-size: 11px; color: var(--muted); font-style: italic; padding: 4px 0;
}

/* Status color helpers */
.col-go      { color: var(--go); }
.col-caution { color: var(--caution); }
.col-stop    { color: var(--stop); }
.col-unknown { color: var(--unknown); }
.col-muted   { color: var(--muted); }

.bg-go      { background: var(--go); }
.bg-caution { background: var(--caution); }
.bg-stop    { background: var(--stop); }
.bg-unknown { background: var(--unknown); }
.bg-unset   { background: var(--unset); }

.report-footer {
  margin-top: 32px; padding-top: 16px; border-top: 1px solid var(--rule);
  font-family: 'IBM Plex Mono', monospace; font-size: 9px; color: var(--muted);
  text-align: center; line-height: 1.8;
}
</style>
</head>
<body>

<!-- LOAD SCREEN -->
<div id="load-screen">
  <div class="load-card">
    <h1>eVSM</h1>
    <div class="sub">Respondent Report</div>

    <div class="drop-zone" id="drop-zone">
      <div class="icon">◎</div>
      <p><strong>Drop a response file here</strong><br>
      or click to browse</p>
    </div>
    <input type="file" id="file-input" accept=".json">
    <button class="load-btn" onclick="document.getElementById('file-input').click()">
      Choose Response File
    </button>
    <div class="load-error" id="load-error"></div>
    <div class="attr">
      eVSM Respondent Report v1
    </div>
  </div>
</div>

<!-- REPORT -->
<div id="report"></div>
<button class="print-btn" id="print-btn" style="display:none" onclick="window.print()">
  ⎙ Print / Save PDF
</button>
<button class="load-another-btn" id="load-another-btn" style="display:none"
  onclick="loadAnother()">← Load Another</button>

<script>
// ── EDGE LIST (mirrors survey tool) ──────────────────────────────────────────
const EDGE_LIST = [
  [1,4],[1,3],[1,2],[2,1],[2,3],[2,4],[2,5],[2,6],[2,7],
  [3,1],[3,2],[3,4],[3,5],[3,6],[3,11],
  [4,1],[4,2],[4,3],[4,5],[4,7],[4,11],
  [5,2],[5,3],[5,4],[5,6],[5,7],[5,8],[5,9],[5,11],
  [6,2],[6,3],[6,5],[6,8],[6,7],[6,10],[6,11],
  [7,2],[7,4],[7,5],[7,6],[7,9],[7,11],[7,10],
  [8,5],[8,6],[8,9],[8,10],[8,11],
  [9,5],[9,7],[9,8],[9,10],[9,11],
  [10,6],[10,7],[10,8],[10,9],[10,11],
  [11,3],[11,4],[11,5],[11,6],[11,7],[11,8],[11,9],[11,10]
].map(([tail,head]) => ({tail,head}));

// Edges grouped by source sphere
function edgesFrom(n) {
  return EDGE_LIST.filter(e => e.tail === n);
}

// ── COLOR HELPERS ─────────────────────────────────────────────────────────────
const NODE_STATUS_COLORS = {
  go:      'bg-go',
  caution: 'bg-caution',
  stop:    'bg-stop',
  unsure:  'bg-unknown',
  '':      'bg-unset'
};
const NODE_STATUS_TEXT = {
  go:      'col-go',
  caution: 'col-caution',
  stop:    'col-stop',
  unsure:  'col-unknown',
  '':      'col-muted'
};
const EDGE_COLORS = {
  agree:    'bg-go',
  disagree: 'bg-stop',
  unknown:  'bg-unknown',
  '':       'bg-unset'
};

// ── DRAG AND DROP ─────────────────────────────────────────────────────────────
const dropZone = document.getElementById('drop-zone');
dropZone.addEventListener('click', () => document.getElementById('file-input').click());
dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag-over'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
dropZone.addEventListener('drop', e => {
  e.preventDefault(); dropZone.classList.remove('drag-over');
  const file = e.dataTransfer.files[0];
  if (file) readFile(file);
});
document.getElementById('file-input').addEventListener('change', e => {
  if (e.target.files[0]) readFile(e.target.files[0]);
});

function readFile(file) {
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      const data = JSON.parse(ev.target.result);
      if (!data.assessments || !data.config) throw new Error('Not a valid eVSM response file');
      renderReport(data);
    } catch(err) {
      document.getElementById('load-error').textContent =
        '✗ ' + (err.message || 'Could not read file — is it a valid eVSM response JSON?');
    }
  };
  reader.readAsText(file);
}

function loadAnother() {
  document.getElementById('report').innerHTML = '';
  document.getElementById('report').style.display = 'none';
  document.getElementById('print-btn').style.display = 'none';
  document.getElementById('load-another-btn').style.display = 'none';
  document.getElementById('load-screen').style.display = 'flex';
  document.getElementById('load-error').textContent = '';
  document.getElementById('file-input').value = '';
}

// ── RENDER ────────────────────────────────────────────────────────────────────
function renderReport(data) {
  const { respondent, surveyMeta, config, assessments, meta } = data;
  const labels      = config.nodeLabels       || {};
  const nodeDesc    = config.nodeDescriptions || {};
  const edgeDesc    = config.edgeDescriptions || {};
  const nodeAss     = assessments.nodes || {};
  const edgeAss     = assessments.edges || {};
  const sm          = surveyMeta || {};
  const anon        = !!(sm.anonymousMode);
  const name        = (respondent && respondent.name) ? respondent.name
                    : (respondent && respondent.respondentId) ? `ID: ${respondent.respondentId}`
                    : 'Anonymous';
  const worlds      = (respondent && respondent.worlds) ? respondent.worlds : [];

  const nodeKeys = ['S-1','S-2','S-3','S-4','S-5','S-6','S-7','S-8','S-9','S-10','S-11'];

  // Status label mapping for nodes
  const NODE_LABELS = { go:'Green', caution:'Yellow', stop:'Red', unsure:'Blue', '':'—' };
  const EDGE_LABELS = { agree:'Agree', disagree:'Disagree', unknown:"Don't Know", '':'—' };

  let html = '';

  // ── REPORT HEADER ──
  html += `<div class="report-header">
    <div class="meta-block">`;

  if (sm.enterprise) html += metaRow('Enterprise', sm.enterprise);
  html += metaRow('Respondent', name);
  if (sm.date)       html += metaRow('Date', sm.date);
  if (sm.timeFrame)  html += metaRow('Time Frame', sm.timeFrame);
  if (sm.surveyId)   html += metaRow('Survey ID', sm.surveyId);
  if (worlds.length) {
    html += `<div class="meta-row">
      <span class="meta-label">Worlds</span>
      <div class="worlds-list">${worlds.map(w => `<span class="world-tag">${esc(w)}</span>`).join('')}</div>
    </div>`;
  }
  if (sm.focalPoint) {
    html += `<div class="meta-row" style="margin-top:10px;padding-top:10px;border-top:1px solid var(--rule);">
      <span class="meta-label">Focal Point</span>
      <span class="meta-value focal">${esc(sm.focalPoint).replace(/\n/g,'<br>')}</span>
    </div>`;
  }
  if (meta && meta.exportedAt) {
    html += metaRow('Exported', new Date(meta.exportedAt).toLocaleString());
  }

  html += `</div>
    <div>
      <div class="sofi-logo">eVSM<span>Respondent Report</span></div>
    </div>
  </div>`;

  // ── SPHERE SECTIONS ──
  for (const key of nodeKeys) {
    const num    = parseInt(key.replace('S-',''));
    const label  = (labels[key] || key).replace(/\n/g,' ');
    const desc   = nodeDesc[key] || '';
    const nAss   = nodeAss[key] || {};
    const status = nAss.status || '';
    const dotCls = NODE_STATUS_COLORS[status] || 'bg-unset';

    // Outgoing edges for this sphere
    const outEdges = edgesFrom(num);

    html += `<div class="sphere-section">`;

    // Sphere header
    html += `<div class="sphere-header">
      <div class="sphere-dot ${dotCls}"></div>
      <div class="sphere-title">${esc(label)}</div>
      <div class="sphere-id">${key}</div>
    </div>`;

    // Traffic signal summary for node
    const nodeStatusLabel = NODE_LABELS[status] || '—';
    const nodeStatusCol   = NODE_STATUS_TEXT[status] || 'col-muted';
    html += `<div class="traffic-summary">
      <div class="traffic-question">What best describes the overall state of the <strong>${esc(label)}</strong> sphere?</div>
      <div class="traffic-row">
        <div class="traffic-item">
          <div class="traffic-swatch bg-stop"></div>
          <span class="traffic-label col-stop">Red</span>
          <span class="traffic-pct">${status==='stop'?'100%':'0%'}</span>
        </div>
        <div class="traffic-item">
          <div class="traffic-swatch bg-caution"></div>
          <span class="traffic-label col-caution">Yellow</span>
          <span class="traffic-pct">${status==='caution'?'100%':'0%'}</span>
        </div>
        <div class="traffic-item">
          <div class="traffic-swatch bg-go"></div>
          <span class="traffic-label col-go">Green</span>
          <span class="traffic-pct">${status==='go'?'100%':'0%'}</span>
        </div>
        <div class="traffic-item">
          <div class="traffic-swatch bg-unknown"></div>
          <span class="traffic-label col-unknown">Blue</span>
          <span class="traffic-pct">${status==='unsure'?'100%':'0%'}</span>
        </div>
      </div>
      ${nAss.evidence || nAss.suggestions ? renderNodeText(nAss) : ''}
    </div>`;

    // Edge blocks
    for (const {tail, head} of outEdges) {
      const edgeKey  = `${tail}->${head}`;
      const eAss     = edgeAss[edgeKey] || {};
      const eStatus  = eAss.status || '';
      const eDesc    = edgeDesc[edgeKey] || '';
      const toLabel  = (labels[`S-${head}`] || `S-${head}`).replace(/\n/g,' ');
      const assessed = !!eStatus;

      html += `<div class="edge-block">`;

      // Edge statement
      if (eDesc) {
        html += `<div class="edge-statement">${esc(eDesc)}
          <span class="impacts">— impacts (${esc(toLabel)})</span>
        </div>`;
      } else {
        html += `<div class="edge-statement">
          ${esc(label)} → ${esc(toLabel)}
          <span class="impacts">(${key} → S-${head})</span>
        </div>`;
      }

      if (!assessed) {
        html += `<div class="not-assessed">Not assessed</div>`;
      } else {
        // Counts
        html += `<div class="edge-counts">
          <div class="edge-count-item">
            <div class="count-swatch bg-go"></div>
            <span class="count-label">Agree</span>
            <span class="count-n">${eStatus==='agree'?1:0}</span>
            <span class="count-pct">(${eStatus==='agree'?'100%':'0%'})</span>
          </div>
          <div class="edge-count-item">
            <div class="count-swatch bg-stop"></div>
            <span class="count-label">Disagree</span>
            <span class="count-n">${eStatus==='disagree'?1:0}</span>
            <span class="count-pct">(${eStatus==='disagree'?'100%':'0%'})</span>
          </div>
          <div class="edge-count-item">
            <div class="count-swatch bg-unknown"></div>
            <span class="count-label">Don't Know</span>
            <span class="count-n">${eStatus==='unknown'?1:0}</span>
            <span class="count-pct">(${eStatus==='unknown'?'100%':'0%'})</span>
          </div>
        </div>`;

        // Evidence + Suggestions
        html += renderTextBoxes(eAss.evidence, eAss.suggestions);
      }

      html += `</div>`; // edge-block
    }

    html += `</div>`; // sphere-section
  }

  // Footer
  html += `<div class="report-footer">
    eVSM Respondent Report · Generated ${new Date().toLocaleString()}
  </div>`;

  document.getElementById('report').innerHTML = html;
  document.getElementById('report').style.display = 'block';
  document.getElementById('print-btn').style.display = 'block';
  document.getElementById('load-another-btn').style.display = 'block';
  document.getElementById('load-screen').style.display = 'none';

  document.title = `eVSM Report — ${name}`;
}

function renderNodeText(nAss) {
  if (!nAss.evidence && !nAss.suggestions) return '';
  return renderTextBoxes(nAss.evidence, nAss.suggestions);
}

function renderTextBoxes(evidence, suggestions) {
  if (!evidence && !suggestions) return '';
  return `<div class="text-boxes">
    <div class="text-box">
      <div class="text-box-label">Evidence / Example</div>
      <div class="text-box-content">${formatQuote(evidence)}</div>
    </div>
    <div class="text-box">
      <div class="text-box-label">Suggestions</div>
      <div class="text-box-content">${formatQuote(suggestions)}</div>
    </div>
  </div>`;
}

function formatQuote(text) {
  if (!text || !text.trim()) return '<span class="text-none">None</span>';
  // Split on newlines to separate multiple entries, wrap each in quotes
  return text.trim().split(/\n+/).filter(s=>s.trim()).map(s =>
    `<p>"${esc(s.trim())}"</p>`
  ).join('');
}

function metaRow(label, value) {
  return `<div class="meta-row">
    <span class="meta-label">${label}</span>
    <span class="meta-value">${esc(String(value))}</span>
  </div>`;
}

function esc(s) {
  if (!s) return '';
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── AUTO-LOAD from survey tool (sessionStorage or URL fragment) ───────────────
(function autoLoad() {
  try {
    // Try sessionStorage first (same-origin server context)
    const stored = sessionStorage.getItem('evsm-print-payload');
    if (stored) {
      sessionStorage.removeItem('evsm-print-payload');
      const data = JSON.parse(stored);
      renderReport(data);
      return;
    }
  } catch(e) {}
  try {
    // Try URL fragment (local file fallback)
    const hash = window.location.hash;
    if (hash && hash.startsWith('#data=')) {
      const b64 = hash.slice(6);
      const json = decodeURIComponent(escape(atob(b64)));
      const data = JSON.parse(json);
      renderReport(data);
      return;
    }
  } catch(e) {}
})();
</script>
</body>
</html>
