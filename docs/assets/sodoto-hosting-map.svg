<svg xmlns="http://www.w3.org/2000/svg" width="575" height="906" viewBox="275 -191 575 906" style="font-family:'IBM Plex Sans',system-ui,sans-serif"><rect x="275" y="-191" width="575" height="906" fill="#ffffff"/>
      <defs id="svg-defs"><marker id="mk000000" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,1 L10,5 L0,9 Z" fill="#000000"/></marker><marker id="mkc53030" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,1 L10,5 L0,9 Z" fill="#c53030"/></marker><marker id="mkc05621" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,1 L10,5 L0,9 Z" fill="#c05621"/></marker><marker id="mkb7791f" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,1 L10,5 L0,9 Z" fill="#b7791f"/></marker><marker id="mk276749" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,1 L10,5 L0,9 Z" fill="#276749"/></marker><marker id="mk2b4c7e" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,1 L10,5 L0,9 Z" fill="#2b4c7e"/></marker><marker id="mk553c9a" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,1 L10,5 L0,9 Z" fill="#553c9a"/></marker><marker id="mk97266d" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,1 L10,5 L0,9 Z" fill="#97266d"/></marker><marker id="mk234e52" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,1 L10,5 L0,9 Z" fill="#234e52"/></marker><marker id="mk1a202c" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,1 L10,5 L0,9 Z" fill="#1a202c"/></marker><marker id="mk3b82f6" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,1 L10,5 L0,9 Z" fill="#3b82f6"/></marker><marker id="mkf59e0b" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,1 L10,5 L0,9 Z" fill="#f59e0b"/></marker><marker id="mk8b5cf6" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,1 L10,5 L0,9 Z" fill="#8b5cf6"/></marker><marker id="mk7c3aed" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,1 L10,5 L0,9 Z" fill="#7c3aed"/></marker></defs>
      
      <g id="wardley-layer"/>
      <g id="lines-layer"/>
      <g id="edges-layer"><g id="edge-e8" style="cursor: pointer; opacity: 1;"><title>📌 Done by Marc at development time, not live traffic. He builds the two images and uploads them to the registry. Dashed = out-of-band, not part of the running system.</title><path d="M559.2015177347643,-81.33136094674552 L559.7627118644068,18" fill="none" stroke="#000000" stroke-width="1.5" stroke-dasharray="8 5" marker-end="url(#mk000000)" pointer-events="none"/><text text-anchor="middle" pointer-events="none" transform="rotate(89.7,545.5,-31.6)"><tspan x="545.4823382293928" y="-31.586585690490324" font-size="10" font-style="italic" fill="#000000">build &amp; push images</tspan></text><circle cx="533.482529740656" cy="-31.51879016230538" r="4" fill="#f59e0b" stroke="#fff" stroke-width="1" pointer-events="none"/></g><g id="edge-e9" style="cursor: pointer; opacity: 1;"><title>📌 The WikiCafe server downloads the sofi-proxy image from the registry so it can run it. Happens at deploy/update time, not on every visit.</title><path d="M525.238444979106,102 L440.063330168823,204.9112426035503" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#mk000000)" pointer-events="none"/><text text-anchor="middle" pointer-events="none" transform="rotate(-50.4,471.9,144.5)"><tspan x="471.865737192907" y="144.52922610225735" font-size="10" font-style="italic" fill="#000000">image pulled</tspan></text><circle cx="462.6213225805719" cy="136.87803021695638" r="4" fill="#f59e0b" stroke="#fff" stroke-width="1" pointer-events="none"/></g><g id="edge-e10" style="cursor: pointer; opacity: 1;"><title>📌 The WikiCafe server downloads the FedWiki image from the registry so it can run it — same pull, other container.</title><path d="M597.5068560840025,102 L691.3611846745928,207.09763313609466" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#mk000000)" pointer-events="none"/><text text-anchor="middle" pointer-events="none" transform="rotate(48.2,634.0,163.9)"><tspan x="633.9917400149575" y="163.87398577790708" font-size="10" font-style="italic" fill="#000000">image pulled</tspan></text><circle cx="625.0412139883803" cy="171.8669879577869" r="4" fill="#f59e0b" stroke="#fff" stroke-width="1" pointer-events="none"/></g><g id="edge-e11" style="cursor: pointer; opacity: 1;"><title>📌 The coordinator's browser reaches the issuer tool over secure HTTPS at sodoto.ndcgroup… Caddy answers at the front door and passes it inward.</title><path d="M433.0734287198376,585.7633136094674 L526.5264855558099,465.70414201183434" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#mk000000)" pointer-events="none"/><text text-anchor="middle" pointer-events="none" transform="rotate(-52.1,490.8,534.3)"><tspan x="490.84760078138424" y="534.333121389555" font-size="10" font-style="italic" fill="#000000">HTTPS  sodoto.ndcgroup…</tspan></text><circle cx="500.31700961872184" cy="541.7040301714727" r="4" fill="#f59e0b" stroke="#fff" stroke-width="1" pointer-events="none"/></g><g id="edge-e12" style="cursor: pointer; opacity: 1;"><title>📌 The learner/verifier's browser reaches the portfolios over secure HTTPS at wiki-sodoto.ndcgroup… Caddy answers at the front door and passes it inward.</title><path d="M693.4211313533301,597.8550295857988 L591.5845020874294,465.70414201183434" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#mk000000)" pointer-events="none"/><text text-anchor="middle" pointer-events="none" transform="rotate(52.4,653.6,523.2)"><tspan x="653.5921636315588" y="523.2340381227737" font-size="10" font-style="italic" fill="#000000">HTTPS  wiki-sodoto.ndcgroup…</tspan></text><circle cx="663.0973181268552" cy="515.9092829718796" r="4" fill="#f59e0b" stroke="#fff" stroke-width="1" pointer-events="none"/></g><g id="edge-e13" style="cursor: pointer; opacity: 1;"><title>📌 Inside the server, Caddy forwards requests for sodoto.ndcgroup… to the sofi-proxy container, which listens on port 8765.</title><path d="M522.6534352124677,381.70414201183434 L441.86727484670405,288.9112426035503" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#mk000000)" pointer-events="none"/><text text-anchor="middle" pointer-events="none" transform="rotate(49.0,492.8,326.1)"><tspan x="492.8193829513118" y="326.1149272531393" font-size="10" font-style="italic" fill="#000000">reverse proxy :8765</tspan></text><circle cx="501.8699783127912" cy="318.2354143492367" r="4" fill="#f59e0b" stroke="#fff" stroke-width="1" pointer-events="none"/></g><g id="edge-e14" style="cursor: pointer; opacity: 1;"><title>📌 Inside the server, Caddy forwards requests for wiki-sodoto.ndcgroup… to the FedWiki container, which listens on port 3000.</title><path d="M601.1640631516333,381.70414201183434 L686.658729651753,296.09763313609466" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#mk000000)" pointer-events="none"/><text text-anchor="middle" pointer-events="none" transform="rotate(-45.0,653.8,348.8)"><tspan x="653.8173601479458" y="348.7939094711366" font-size="10" font-style="italic" fill="#000000">reverse proxy :3000</tspan></text><circle cx="662.3081862161624" cy="357.27364252585556" r="4" fill="#f59e0b" stroke="#fff" stroke-width="1" pointer-events="none"/></g><g id="edge-e15" style="cursor: pointer; opacity: 1;"><title>📌 The two containers share one folder on the server's disk (a Docker 'volume'). sofi-proxy writes a badge there as a page file; FedWiki serves that same file. That shared folder is how a write becomes visible on the portfolio. Dashed = filesystem sharing, not network traffic.</title><path d="M500.301775147929,248.27775186617288 L636.1005917159763,250.2311238734721" fill="none" stroke="#000000" stroke-width="1.5" stroke-dasharray="8 5" marker-end="url(#mk000000)" pointer-events="none"/><text text-anchor="middle" pointer-events="none" transform="rotate(0.8,568.0,263.3)"><tspan x="567.9998239499645" y="263.2529897363197" font-size="10" font-style="italic" fill="#000000">writes pages (shared volume)</tspan></text><circle cx="567.8272301082603" cy="275.2517484790317" r="4" fill="#f59e0b" stroke="#fff" stroke-width="1" pointer-events="none"/></g></g>
      <g id="nodes-layer"><g id="node-n1" transform="translate(558.9585798816569,-124.33136094674552)" style="cursor: move; opacity: 1;"><title>📌 Marc's laptop. Its ONLY job is to build the two Docker images and push them to the registry. It is never in the running path — switch it off and the live SODOTO system on WikiCafe keeps working. Not a server; not something users ever touch.</title><rect x="-95" y="-43" width="190" height="86" rx="10" fill="#e5e7eb" stroke="#000000" stroke-width="1.5"/><text text-anchor="middle" font-size="12" font-weight="500" fill="#000000" pointer-events="none"><tspan x="0" y="-8.0">Marc's dev machine (build</tspan><tspan x="0" dy="16">only — not in runtime path)</tspan></text><circle cx="91" cy="-39" r="4" fill="#f59e0b" stroke="#fff" stroke-width="1" pointer-events="none"/></g><g id="node-n2" transform="translate(560,60)" style="cursor: move; opacity: 1;"><title>📌 GitHub Container Registry (GHCR) — a public library of ready-to-run software images hosted by GitHub at ghcr.io. Marc pushes the built images here; the WikiCafe server pulls them from here to run. Think of it as the shelf a packaged app sits on between 'built' and 'running'.</title><rect x="-95" y="-42" width="190" height="84" rx="10" fill="#ddd6fe" stroke="#000000" stroke-width="1.5"/><text text-anchor="middle" font-size="12" font-weight="500" fill="#000000" pointer-events="none"><tspan x="0" y="-8.0">GitHub Container Registry</tspan><tspan x="0" dy="16">ghcr.io/marpie1/*</tspan></text><circle cx="91" cy="-38" r="4" fill="#f59e0b" stroke="#fff" stroke-width="1" pointer-events="none"/></g><g id="node-n3" transform="translate(559.2189349112427,423.70414201183434)" style="cursor: move; opacity: 1;"><title>📌 Caddy — a small web server at the front door of the WikiCafe machine. It handles HTTPS (automatically getting and renewing the TLS certificate from Let's Encrypt, so the padlock works) and routes each web address to the right container behind it. Nothing SODOTO-specific — just secure traffic and routing.</title><rect x="-95" y="-42" width="190" height="84" rx="10" fill="#fde68a" stroke="#000000" stroke-width="1.5"/><text text-anchor="middle" font-size="12" font-weight="500" fill="#000000" pointer-events="none"><tspan x="0" y="-8.0">Caddy — HTTPS / TLS</tspan><tspan x="0" dy="16">(WikiCafe server)</tspan></text><circle cx="91" cy="-38" r="4" fill="#f59e0b" stroke="#fff" stroke-width="1" pointer-events="none"/></g><g id="node-n4" transform="translate(405.301775147929,246.9112426035503)" style="cursor: move; opacity: 1;"><title>📌 sofi-proxy — a small Python web server running as a container. Two jobs: (1) serves the browser tools such as the issuer tool, and (2) writes finished badges into the wiki on the browser's behalf, since a web page can't write wiki files directly. The trusted middleman for writes. Reached at sodoto.ndcgroup…</title><rect x="-95" y="-42" width="190" height="84" rx="10" fill="#a7f3d0" stroke="#000000" stroke-width="1.5"/><text text-anchor="middle" font-size="12" font-weight="500" fill="#000000" pointer-events="none"><tspan x="0" y="-8.0">sofi-proxy issuer tool +</tspan><tspan x="0" dy="16">wiki writes (WikiCafe)</tspan></text><circle cx="91" cy="-38" r="4" fill="#f59e0b" stroke="#fff" stroke-width="1" pointer-events="none"/></g><g id="node-n5" transform="translate(731.1005917159763,251.59763313609466)" style="cursor: move; opacity: 1;"><title>📌 FedWiki — the wiki server, running as a container. It hosts and serves the learner portfolio pages and the badge ledger, and renders each badge with the sodoto-badge plugin, including the client-side Verify button. Reached at wiki-sodoto.ndcgroup…</title><rect x="-95" y="-44.5" width="190" height="89" rx="10" fill="#bfdbfe" stroke="#000000" stroke-width="1.5"/><text text-anchor="middle" font-size="12" font-weight="500" fill="#000000" pointer-events="none"><tspan x="0" y="-8.0">FedWiki portfolios + badge</tspan><tspan x="0" dy="16">ledger (WikiCafe)</tspan></text><circle cx="91" cy="-40.5" r="4" fill="#f59e0b" stroke="#fff" stroke-width="1" pointer-events="none"/></g><g id="node-n6" transform="translate(394.15384615384613,635.7633136094674)" style="cursor: move; opacity: 1;"><title>📌 The coordinator's own web browser, on their own computer. They open the issuer tool over HTTPS, run the See / Do / Teach workflow, and paste the NDC's private key to sign the badge. Signing happens right here in the browser — the key never goes to the server.</title><rect x="-95" y="-50" width="190" height="100" rx="10" fill="#fecaca" stroke="#000000" stroke-width="1.5"/><text text-anchor="middle" font-size="12" font-weight="500" fill="#000000" pointer-events="none"><tspan x="0" y="-8.0">Coordinator browser opens</tspan><tspan x="0" dy="16">issuer tool · signs Ed25519</tspan></text><circle cx="91" cy="-46" r="4" fill="#f59e0b" stroke="#fff" stroke-width="1" pointer-events="none"/></g><g id="node-n7" transform="translate(729.2544378698225,644.3550295857988)" style="cursor: move; opacity: 1;"><title>📌 Any web browser, anywhere. It opens a learner's portfolio page on the wiki and clicks Verify. The signature check runs entirely in that browser, from the badge's DID — no login, no account, no server call. This is what makes a credential verifiable by anyone, forever.</title><rect x="-89.5" y="-46.5" width="179" height="93" rx="10" fill="#fecaca" stroke="#000000" stroke-width="1.5"/><text text-anchor="middle" font-size="12" font-weight="500" fill="#000000" pointer-events="none"><tspan x="0" y="-16.0">Learner / verifier browser</tspan><tspan x="0" dy="16">views portfolio · verifies</tspan><tspan x="0" dy="16">badge</tspan></text><circle cx="85.5" cy="-42.5" r="4" fill="#f59e0b" stroke="#fff" stroke-width="1" pointer-events="none"/></g></g>
      <g id="triples-layer"/>
      <g id="drag-layer"/>
      <g id="legend-layer"/>
    </svg>