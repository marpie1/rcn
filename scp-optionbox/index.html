<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Option Box</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --navy:      #1e3a5f;
  --navy-lt:   #2a4f7c;
  --bg:        #f8f9fa;
  --surface:   #ffffff;
  --border:    #dee2e6;
  --text:      #1a1a2e;
  --muted:     #6c757d;
  --green:     #2d7a4f;
  --green-bg:  #d4edda;
  --red:       #c0392b;
  --red-bg:    #f8d7da;
  --amber:     #d97706;
  --amber-bg:  #fff3cd;
  --orange:    #f59e0b;
  --purple:    #7a5c9e;
}

body {
  font-family: system-ui, -apple-system, sans-serif;
  background: var(--bg);
  color: var(--text);
  font-size: 0.95rem;
  line-height: 1.6;
}

/* ── Header ─────────────────────────────────────────────────────────────── */
#header {
  background: var(--navy);
  color: #fff;
  padding: 0.9rem 1.5rem;
  display: flex;
  align-items: center;
  gap: 1rem;
  position: sticky;
  top: 0;
  z-index: 10;
}

#header a.back {
  color: rgba(255,255,255,0.7);
  text-decoration: none;
  font-size: 0.8rem;
  white-space: nowrap;
}
#header a.back:hover { color: #fff; }

#header-title {
  flex: 1;
  min-width: 0;
}
#header-title h1 { font-size: 1rem; font-weight: 600; }
#header-sub { font-size: 0.75rem; color: rgba(255,255,255,0.65); }

#header-actions { display: flex; gap: 6px; flex-shrink: 0; }

.hbtn {
  background: rgba(255,255,255,0.13);
  color: #fff;
  border: 1px solid rgba(255,255,255,0.28);
  border-radius: 4px;
  padding: 4px 10px;
  font-size: 0.75rem;
  cursor: pointer;
  white-space: nowrap;
}
.hbtn:hover { background: rgba(255,255,255,0.24); }
a.hbtn { text-decoration: none; display: inline-flex; align-items: center; }

/* ── Main ────────────────────────────────────────────────────────────────── */
main { max-width: 1100px; margin: 0 auto; padding: 1.5rem 1rem 4rem; }

/* ── Decision header ─────────────────────────────────────────────────────── */
.decision-header {
  background: var(--surface);
  border: 1px solid var(--border);
  border-left: 5px solid var(--navy);
  border-radius: 0 8px 8px 0;
  padding: 1.25rem 1.5rem;
  margin-bottom: 1rem;
}
.decision-header h2 {
  font-size: 1.3rem;
  font-weight: 700;
  color: var(--navy);
  margin-bottom: 0.4rem;
}
.decision-meta {
  display: flex;
  gap: 1.25rem;
  flex-wrap: wrap;
  font-size: 0.8rem;
  color: var(--muted);
}
.decision-meta span strong { color: var(--text); }

/* ── Population banner ───────────────────────────────────────────────────── */
.population-banner {
  background: #eef3fa;
  border: 1px solid #c5d8f0;
  border-radius: 6px;
  padding: 0.7rem 1rem;
  font-size: 0.9rem;
  color: var(--navy-lt);
  margin-bottom: 1rem;
}

/* ── Icon array legend ───────────────────────────────────────────────────── */
.icon-legend {
  display: flex;
  gap: 1.25rem;
  flex-wrap: wrap;
  font-size: 0.78rem;
  color: var(--muted);
  margin-bottom: 1.25rem;
  padding: 0.5rem 0.75rem;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 6px;
  align-items: center;
}
.legend-item { display: flex; align-items: center; gap: 5px; }
.legend-dot {
  width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0;
}

/* ── Options grid ────────────────────────────────────────────────────────── */
.options-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
  gap: 1rem;
  margin-bottom: 1.5rem;
  align-items: start;
}

/* ── Option card ─────────────────────────────────────────────────────────── */
.option-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  overflow: hidden;
}
.option-card.watchful-waiting {
  border-style: dashed;
  border-color: #adb5bd;
}

.option-header {
  padding: 0.9rem 1rem 0.75rem;
  border-bottom: 1px solid var(--border);
  background: #f5f7fa;
}
.option-type-badge {
  display: inline-block;
  font-size: 0.68rem;
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  border-radius: 3px;
  padding: 2px 6px;
  margin-bottom: 5px;
}
.type-drug             { background: #e8e0f7; color: var(--purple); }
.type-test             { background: #dbeafe; color: #1d4ed8; }
.type-procedure        { background: #fef9c3; color: #854d0e; }
.type-watchful_waiting { background: #f0f0f0; color: var(--muted); }

.option-header h3 {
  font-size: 0.97rem;
  font-weight: 700;
  color: var(--navy);
  line-height: 1.3;
}

/* ── Section headers ─────────────────────────────────────────────────────── */
.section-bar {
  font-size: 0.69rem;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  padding: 5px 12px;
}
.benefits-bar { background: var(--green-bg); color: var(--green); border-top: 2px solid var(--green); }
.harms-bar    { background: var(--red-bg);   color: var(--red);   border-top: 2px solid var(--red);   }
.burden-bar   { background: #f0f0f0;          color: var(--muted); border-top: 1px solid var(--border); }

/* ── Outcome items ───────────────────────────────────────────────────────── */
.outcome-item {
  padding: 12px;
  border-bottom: 1px solid var(--border);
}
.outcome-item:last-child { border-bottom: none; }

.outcome-label {
  font-weight: 600;
  font-size: 0.88rem;
  margin-bottom: 5px;
  color: var(--text);
}

.outcome-sentence {
  font-size: 0.85rem;
  margin-bottom: 8px;
  line-height: 1.5;
}

.icon-array-wrap {
  margin-bottom: 8px;
  overflow-x: auto;
}

.outcome-badges {
  display: flex;
  gap: 5px;
  flex-wrap: wrap;
  margin-bottom: 6px;
}

.badge {
  display: inline-block;
  font-size: 0.72rem;
  font-weight: 700;
  border-radius: 3px;
  padding: 2px 7px;
  letter-spacing: 0.02em;
}
.nnt-badge { background: var(--green-bg); color: var(--green); border: 1px solid var(--green); }
.nnh-badge { background: var(--red-bg);   color: var(--red);   border: 1px solid var(--red);   }

/* RAC badge — colored by severity */
.rac-badge {
  color: #fff;
  font-size: 0.7rem;
  font-weight: 700;
  border-radius: 3px;
  padding: 2px 6px;
  cursor: default;
}
.rac-I   { background: var(--green); }
.rac-II  { background: #ca8a04; }
.rac-III { background: var(--amber); }
.rac-IV  { background: var(--red); }

.cascade-note {
  font-size: 0.8rem;
  color: var(--navy-lt);
  background: #eef3fa;
  border-left: 3px solid var(--navy-lt);
  padding: 6px 9px;
  border-radius: 0 4px 4px 0;
  margin-bottom: 7px;
  line-height: 1.45;
}

/* ── Evidence line ───────────────────────────────────────────────────────── */
.evidence-line {
  font-size: 0.74rem;
  color: var(--muted);
  display: flex;
  gap: 5px;
  flex-wrap: wrap;
  align-items: baseline;
  margin-top: 4px;
}
.ev-chip {
  font-size: 0.67rem;
  font-weight: 700;
  border-radius: 2px;
  padding: 1px 4px;
  background: #e9ecef;
  color: var(--muted);
}
.ev-high     { background: var(--green-bg); color: var(--green); }
.ev-moderate { background: #dbeafe; color: #1d4ed8; }
.ev-low      { background: var(--amber-bg); color: var(--amber); }
.ev-very-low { background: #f0f0f0; color: var(--muted); }
.ev-industry { background: #fef9c3; color: #854d0e; }
.ev-source { font-size: 0.72rem; font-style: italic; }
.pop-caveat {
  font-size: 0.75rem;
  color: var(--amber);
  margin-top: 3px;
}

/* ── Burden section ──────────────────────────────────────────────────────── */
.burden-text {
  padding: 10px 12px;
  font-size: 0.84rem;
  line-height: 1.55;
  color: var(--text);
}

/* ── Unknowns section ────────────────────────────────────────────────────── */
.unknowns-section {
  background: #fff8e6;
  border: 1px solid #f6d860;
  border-radius: 8px;
  padding: 1rem 1.25rem;
  margin-bottom: 1.25rem;
}
.unknowns-section h3 {
  font-size: 0.9rem;
  font-weight: 700;
  color: #854d0e;
  margin-bottom: 0.6rem;
  letter-spacing: 0.01em;
}
.unknown-item {
  font-size: 0.85rem;
  color: var(--text);
  padding: 5px 0 5px 1.1rem;
  border-bottom: 1px solid #f6d860;
  position: relative;
  line-height: 1.5;
}
.unknown-item::before {
  content: "?";
  position: absolute;
  left: 0;
  font-weight: 700;
  color: #ca8a04;
}
.unknown-item:last-child { border-bottom: none; }
.unknown-attr {
  font-size: 0.7rem;
  font-weight: 700;
  color: var(--muted);
  margin-left: 4px;
}

/* ── Drug safety panel ───────────────────────────────────────────────────── */
.drug-safety-bar {
  font-size: 0.69rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
  padding: 5px 12px;
  background: #f5f0fb; color: var(--purple); border-top: 2px solid var(--purple);
}
.drug-safety-body { padding: 10px 12px; }

.boxed-warning {
  background: #fff0f0;
  border: 1.5px solid var(--red);
  border-radius: 5px;
  padding: 8px 10px;
  margin-bottom: 8px;
  font-size: 0.8rem;
  line-height: 1.5;
}
.boxed-warning-label {
  font-size: 0.68rem; font-weight: 700; letter-spacing: 0.06em;
  text-transform: uppercase; color: var(--red); margin-bottom: 4px;
}

.faers-header {
  font-size: 0.78rem; font-weight: 600; color: var(--text); margin-bottom: 5px;
}
.faers-total { font-size: 0.72rem; color: var(--muted); }
.faers-chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 5px; }
.faers-chip {
  font-size: 0.69rem; border-radius: 3px; padding: 2px 6px;
  background: #ede9f8; color: var(--purple); font-weight: 500;
  cursor: default;
}
.faers-chip[data-def]:hover { background: #d8cff5; }

/* Shared floating tooltip — positioned by JS */
#term-tooltip {
  display: none;
  position: fixed;
  width: 240px;
  background: rgba(255,255,255,0.97);
  border: 1px solid #ccc;
  border-radius: 6px;
  box-shadow: 0 4px 14px rgba(0,0,0,0.18);
  padding: 8px 10px;
  font-size: 0.75rem;
  line-height: 1.45;
  color: var(--text);
  z-index: 200;
  pointer-events: none;
  text-align: left;
}
#term-tooltip.has-link { pointer-events: auto; }
.term-tip-title { font-weight: 700; margin-bottom: 3px; color: var(--navy); }
.term-tip-link  { display: block; margin-top: 5px; color: var(--purple); font-size: 0.7rem; }
.drug-safety-note {
  font-size: 0.72rem; color: var(--muted); margin-top: 6px; font-style: italic;
}
.bw-toggle {
  background: none; border: none; color: var(--red); font-size: 0.75rem;
  font-weight: 600; cursor: pointer; padding: 4px 0 0; display: block;
}
.bw-toggle:hover { text-decoration: underline; }

/* ── Disclaimer ──────────────────────────────────────────────────────────── */
.disclaimer {
  font-size: 0.8rem;
  color: var(--muted);
  border-top: 1px solid var(--border);
  padding-top: 1rem;
  margin-top: 0.5rem;
  line-height: 1.55;
}

/* ── Drop overlay ────────────────────────────────────────────────────────── */
#drop-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(30,58,95,0.7);
  color: #fff;
  font-size: 1.5rem;
  font-weight: 600;
  align-items: center;
  justify-content: center;
  z-index: 100;
  pointer-events: none;
}
body.dragging #drop-overlay { display: flex; }

/* ── Print ───────────────────────────────────────────────────────────────── */
@media print {
  #header { position: static; background: var(--navy); -webkit-print-color-adjust: exact; }
  #header-actions, #header a.back { display: none; }
  .options-grid { grid-template-columns: 1fr; }
  main { padding: 0.5rem; }
  .option-card { break-inside: avoid; }
  .unknowns-section, .disclaimer { break-inside: avoid; }
  body { font-size: 0.85rem; }
}
</style>
</head>
<body>

<div id="drop-overlay">Drop JSON to load fact box</div>
<div id="term-tooltip"></div>

<div id="header">
  <a class="back" href="../scp-coupler/">← Coupler</a>
  <div id="header-title">
    <h1>Option Box</h1>
    <div id="header-sub">Benefits and harms in plain numbers</div>
  </div>
  <div id="header-actions">
    <div style="position:relative">
      <button class="hbtn" id="btn-library" onclick="toggleLibrary()">Library ▾</button>
      <div id="library-menu" style="display:none;position:absolute;top:calc(100% + 4px);right:0;
           background:#fff;border:1px solid #ccc;border-radius:6px;min-width:260px;
           box-shadow:0 4px 14px rgba(0,0,0,0.15);z-index:100;overflow:hidden"></div>
    </div>
    <button class="hbtn" id="btn-load" onclick="document.getElementById('file-input').click()">Load JSON</button>
    <button class="hbtn" onclick="window.print()">Print</button>
  </div>
  <input type="file" id="file-input" accept=".json" style="display:none">
</div>

<main>
  <div id="box"></div>
</main>

<script>
// ── Helpers ──────────────────────────────────────────────────────────────────
function esc(s) {
  return String(s ?? '')
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function formatType(t) {
  return { drug:'Drug', test:'Diagnostic test', procedure:'Procedure', watchful_waiting:'Watchful waiting' }[t] || t;
}

function formatGrade(g) {
  return { high:'High evidence', moderate:'Moderate evidence', low:'Low evidence', very_low:'Very low evidence' }[g] || g;
}

function gradeClass(g) {
  return { high:'ev-high', moderate:'ev-moderate', low:'ev-low', very_low:'ev-very-low' }[g] || '';
}

function racClass(severity) {
  return `rac-${severity}`;
}

// ── Icon array (SVG) ─────────────────────────────────────────────────────────
// 3-colour scheme:
//   benefit: amber = still affected; green = prevented; grey = unaffected
//   harm:    orange = baseline harm; red = extra harm from option; grey = unaffected
function iconArray(withOpt, withoutOpt, type, denom) {
  const cols = 40, r = 3, gap = 1, step = r * 2 + gap;
  const rows = Math.ceil(denom / cols);
  const W = cols * step - gap, H = rows * step - gap;

  const lo = Math.min(withOpt, withoutOpt);
  const hi = Math.max(withOpt, withoutOpt);

  // Colour zones — determine the three fills
  let cLo, cMid;
  if (type === 'benefit') {
    cLo  = '#d97706'; // still affected even with this option
    cMid = '#2d7a4f'; // prevented by this option
  } else if (withOpt >= withoutOpt) {
    cLo  = '#f59e0b'; // harmed regardless
    cMid = '#c0392b'; // extra harm caused by this option
  } else {
    cLo  = '#e0e0e0';
    cMid = '#2d7a4f'; // harm row where option actually reduces harm
  }
  const cHi = '#e0e0e0'; // unaffected

  // Build circle markup grouped by colour — one innerHTML parse beats 1000 DOM calls
  const buckets = { [cLo]: [], [cMid]: [], [cHi]: [] };
  for (let i = 0; i < denom; i++) {
    const cx = (i % cols) * step + r;
    const cy = Math.floor(i / cols) * step + r;
    const fill = i < lo ? cLo : i < hi ? cMid : cHi;
    buckets[fill].push(`<circle cx="${cx}" cy="${cy}" r="${r}"/>`);
  }

  const groups = Object.entries(buckets)
    .filter(([, dots]) => dots.length)
    .map(([fill, dots]) => `<g fill="${fill}">${dots.join('')}</g>`)
    .join('');

  const wrap = document.createElement('div');
  wrap.innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" style="display:block;max-width:100%">${groups}</svg>`;
  return wrap.firstChild;
}

// ── Render outcome row ───────────────────────────────────────────────────────
function renderOutcome(o, type, decision) {
  const div = document.createElement('div');
  div.className = 'outcome-item';

  const w  = o.with_option;
  const wo = o.without_option;
  const diff = Math.abs(w - wo);
  const better = w < wo;
  const diffWord = type === 'benefit'
    ? (better ? `<strong>${diff} prevented</strong>` : `<strong>${diff} additional — check data</strong>`)
    : (w > wo  ? `<strong>${diff} additional</strong>` : `<strong>${diff} fewer</strong>`);

  // Natural frequency sentence
  const sentence = `Of ${decision.denominator.toLocaleString()} people over ${esc(decision.time_horizon)}: `
    + `<strong>${w}</strong> with this choice vs <strong>${wo}</strong> without — ${diffWord}.`;

  // NNT/NNH badge
  let nntHtml = '';
  if (type === 'benefit' && o.nnt != null) {
    nntHtml = `<span class="badge nnt-badge" title="Treat ${o.nnt} people for ${esc(decision.time_horizon)} to achieve 1 benefit">NNT ${o.nnt}</span>`;
  } else if (type === 'harm' && o.nnh != null) {
    nntHtml = `<span class="badge nnh-badge" title="${o.nnh} people treated for ${esc(decision.time_horizon)} for each additional harm event">NNH ${o.nnh}</span>`;
  }

  // RAC badge
  let racHtml = '';
  if (o.rac) {
    const title = `Severity ${o.rac.severity} (${['','minor','moderate','major','catastrophic'][['I','II','III','IV'].indexOf(o.rac.severity)+1]}), probability ${o.rac.probability}`;
    racHtml = `<span class="badge rac-badge ${racClass(o.rac.severity)}" title="${title}">RAC ${o.rac.code}</span>`;
  }

  // Cascade note
  const cascadeHtml = o.cascade
    ? `<div class="cascade-note"><strong>If this happens:</strong> ${esc(o.cascade)}</div>`
    : '';

  // Evidence
  let evidHtml = '';
  if (o.evidence) {
    const e = o.evidence;
    const fundingChip = e.funding
      ? `<span class="ev-chip ${e.funding === 'industry' ? 'ev-industry' : ''}">${esc(e.funding)}-funded</span>`
      : '';
    evidHtml = `<div class="evidence-line">
      <span class="ev-chip">${esc(e.basis)}</span>
      <span class="ev-chip ${gradeClass(e.grade)}">${formatGrade(e.grade)}</span>
      ${fundingChip}
      <span class="ev-source">${esc(e.source)}</span>
    </div>`;
    if (e.population_caveat) {
      evidHtml += `<div class="pop-caveat">⚠ ${esc(e.population_caveat)}</div>`;
    }
  }

  div.innerHTML = `
    <div class="outcome-label">${esc(o.outcome)}</div>
    <div class="outcome-sentence">${sentence}</div>
    <div class="icon-array-wrap"></div>
    <div class="outcome-badges">${nntHtml}${racHtml}</div>
    ${cascadeHtml}
    ${evidHtml}
  `;

  div.querySelector('.icon-array-wrap').appendChild(iconArray(w, wo, type, decision.denominator));
  return div;
}

// ── Render option card ───────────────────────────────────────────────────────
function renderOption(opt, decision) {
  const card = document.createElement('div');
  card.className = `option-card${opt.type === 'watchful_waiting' ? ' watchful-waiting' : ''}`;

  // Header
  const hdr = document.createElement('div');
  hdr.className = 'option-header';
  hdr.innerHTML = `
    <div class="option-type-badge type-${esc(opt.type)}">${formatType(opt.type)}</div>
    <h3>${esc(opt.label)}</h3>
  `;
  card.appendChild(hdr);

  // Benefits
  if (opt.benefits && opt.benefits.length) {
    const bar = document.createElement('div');
    bar.className = 'section-bar benefits-bar';
    bar.textContent = 'Benefits';
    card.appendChild(bar);
    for (const b of opt.benefits) card.appendChild(renderOutcome(b, 'benefit', decision));
  }

  // Harms
  if (opt.harms && opt.harms.length) {
    const bar = document.createElement('div');
    bar.className = 'section-bar harms-bar';
    bar.textContent = 'Harms';
    card.appendChild(bar);
    for (const h of opt.harms) card.appendChild(renderOutcome(h, 'harm', decision));
  }

  // Burden
  if (opt.burden) {
    const bar = document.createElement('div');
    bar.className = 'section-bar burden-bar';
    bar.textContent = 'Daily burden & cost';
    card.appendChild(bar);
    const bt = document.createElement('div');
    bt.className = 'burden-text';
    bt.textContent = opt.burden;
    card.appendChild(bt);
  }

  // Drug safety panel — async, appends when cache loads
  if (opt.type === 'drug' && opt.rxnorm) {
    loadDrugData(opt.rxnorm).then(drugData => {
      if (drugData) renderDrugSafety(card, drugData);
    });
  }

  return card;
}

// ── Main render ──────────────────────────────────────────────────────────────
function render(data) {
  const box = document.getElementById('box');
  box.innerHTML = '';

  const { decision, options } = data;
  document.title = `Option Box — ${decision.problem}`;

  // Decision header
  const dh = document.createElement('div');
  dh.className = 'decision-header';
  dh.innerHTML = `
    <h2>${esc(decision.question)}</h2>
    <div class="decision-meta">
      <span>Problem: <strong>${esc(decision.problem)}</strong>${decision.problem_code ? ` <small>(SNOMED ${esc(decision.problem_code)})</small>` : ''}</span>
      <span>Time horizon: <strong>${esc(decision.time_horizon)}</strong></span>
      <span>Denominator: <strong>${decision.denominator.toLocaleString()} people</strong></span>
    </div>
  `;
  box.appendChild(dh);

  // Population banner
  const pb = document.createElement('div');
  pb.className = 'population-banner';
  pb.innerHTML = `Of <strong>${decision.denominator.toLocaleString()} people</strong> with ${esc(decision.problem)} over <strong>${esc(decision.time_horizon)}</strong>…`;
  box.appendChild(pb);

  // Legend
  const legend = document.createElement('div');
  legend.className = 'icon-legend';
  legend.innerHTML = `
    <strong style="color:var(--muted);font-size:0.75rem">Icon arrays:</strong>
    <span class="legend-item"><span class="legend-dot" style="background:#2d7a4f"></span>Benefit — outcome prevented or reduced</span>
    <span class="legend-item"><span class="legend-dot" style="background:#d97706"></span>Still occurs despite treatment</span>
    <span class="legend-item"><span class="legend-dot" style="background:#c0392b"></span>Extra harm caused by this choice</span>
    <span class="legend-item"><span class="legend-dot" style="background:#f59e0b"></span>Occurs with or without treatment</span>
    <span class="legend-item"><span class="legend-dot" style="background:#e0e0e0"></span>Not affected</span>
  `;
  box.appendChild(legend);

  // Options grid
  const grid = document.createElement('div');
  grid.className = 'options-grid';
  for (const opt of options) grid.appendChild(renderOption(opt, decision));
  box.appendChild(grid);

  // Unknowns
  const allUnknowns = [];
  for (const opt of options) {
    for (const u of (opt.unknowns || [])) allUnknowns.push({ option: opt.label, text: u });
  }
  if (allUnknowns.length) {
    const uk = document.createElement('section');
    uk.className = 'unknowns-section';
    uk.innerHTML = '<h3>What we don\'t know</h3>';
    for (const u of allUnknowns) {
      const item = document.createElement('div');
      item.className = 'unknown-item';
      item.innerHTML = `${esc(u.text)} <span class="unknown-attr">[${esc(u.option)}]</span>`;
      uk.appendChild(item);
    }
    box.appendChild(uk);
  }

  // Disclaimer
  const disc = document.createElement('div');
  disc.className = 'disclaimer';
  disc.textContent = 'This fact box presents information to support a conversation with your clinician. It does not make recommendations. Numbers represent averages across groups of people and may not reflect your individual situation. All treatment decisions should be made with a clinician who knows your full medical history.';
  box.appendChild(disc);
}

// ── Drug safety data ─────────────────────────────────────────────────────────
const drugCache = {};  // rxnorm → drug data or null

async function loadDrugData(rxnorm) {
  if (rxnorm in drugCache) return drugCache[rxnorm];
  try {
    const res = await fetch(`data/cache/${encodeURIComponent(rxnorm)}.json`);
    if (!res.ok) { drugCache[rxnorm] = null; return null; }
    drugCache[rxnorm] = await res.json();
  } catch { drugCache[rxnorm] = null; }
  return drugCache[rxnorm];
}

function renderDrugSafety(card, drugData) {
  if (!drugData) return;

  const bar = document.createElement('div');
  bar.className = 'drug-safety-bar';
  bar.textContent = 'Drug Safety (FDA)';
  card.appendChild(bar);

  const body = document.createElement('div');
  body.className = 'drug-safety-body';

  // Boxed warning with read-more toggle
  const bw = drugData.label?.boxed_warning;
  if (bw) {
    const PREVIEW = 320;
    const needsToggle = bw.length > PREVIEW;
    const preview = needsToggle ? bw.slice(0, PREVIEW).trimEnd() + '…' : bw;
    const uid = `bw-${Math.random().toString(36).slice(2)}`;
    const bwEl = document.createElement('div');
    bwEl.className = 'boxed-warning';
    bwEl.innerHTML = `
      <div class="boxed-warning-label">⬛ FDA Boxed Warning</div>
      <div class="bw-text" id="${uid}">${esc(preview)}</div>
      ${needsToggle ? `<button class="bw-toggle" data-uid="${uid}" data-full="${esc(bw)}" data-preview="${esc(preview)}">Read full warning ▾</button>` : ''}
    `;
    body.appendChild(bwEl);
  }

  // FAERS top reactions with MedlinePlus hover definitions
  const faers = drugData.faers;
  if (faers && faers.top_reactions?.length) {
    const defs = faers.term_definitions || {};
    // Filter out known bad MedlinePlus matches (generic terms that return irrelevant topics)
    const BLOCKLIST = new Set(['death', 'off label use', 'drug ineffective']);
    const chips = faers.top_reactions.slice(0, 12).map(r => {
      const def = (!BLOCKLIST.has(r.term) && defs[r.term]?.title) ? defs[r.term] : null;
      const countTip = `${r.count.toLocaleString()} FDA adverse event reports`;
      if (def) {
        return `<span class="faers-chip" data-def="1"
          data-title="${esc(def.title)}"
          data-summary="${esc(def.summary || '')}"
          data-url="${esc(def.url || '')}"
          data-count="${esc(countTip)}">${esc(r.term)}</span>`;
      }
      return `<span class="faers-chip" title="${countTip}">${esc(r.term)}</span>`;
    }).join('');
    const total = faers.total_reports ? `${faers.total_reports.toLocaleString()} total FDA adverse event reports` : '';
    body.innerHTML += `
      <div class="faers-header">Most-reported adverse events <span class="faers-total">${esc(total)}</span></div>
      <div class="faers-chips">${chips}</div>
      <div class="drug-safety-note">Source: FDA FAERS. Frequency reflects reports, not causation. Hover a chip for plain-language definition.</div>
    `;
  }

  card.appendChild(body);
}

// ── Term tooltip (viewport-aware) ────────────────────────────────────────────
const TOOLTIP = document.getElementById('term-tooltip');
const TIP_PAD = 8; // min px from viewport edge

document.addEventListener('mouseover', e => {
  const chip = e.target.closest('.faers-chip[data-def]');
  if (!chip) return;

  const { title, summary, url, count } = chip.dataset;
  TOOLTIP.innerHTML =
    `<div class="term-tip-title">${esc(title)}</div>` +
    (summary ? `<div>${esc(summary)}</div>` : '') +
    `<div style="font-size:0.68rem;color:var(--muted);margin-top:4px">${esc(count)}</div>` +
    (url ? `<a class="term-tip-link" href="${esc(url)}" target="_blank" rel="noopener">MedlinePlus ↗</a>` : '');

  TOOLTIP.className = url ? 'has-link' : '';
  TOOLTIP.style.display = 'block';

  // Position above the chip, then clamp to viewport
  const rect = chip.getBoundingClientRect();
  const tw = TOOLTIP.offsetWidth;
  const th = TOOLTIP.offsetHeight;
  const vw = window.innerWidth;

  let left = rect.left + rect.width / 2 - tw / 2;
  let top  = rect.top - th - 8;

  // Clamp horizontally
  left = Math.max(TIP_PAD, Math.min(left, vw - tw - TIP_PAD));
  // If no room above, flip below
  if (top < TIP_PAD) top = rect.bottom + 8;

  TOOLTIP.style.left = left + 'px';
  TOOLTIP.style.top  = top  + 'px';
});

document.addEventListener('mouseout', e => {
  const chip = e.target.closest('.faers-chip[data-def]');
  if (!chip) return;
  // If moving into the tooltip itself (has-link), keep it visible
  if (TOOLTIP.classList.contains('has-link') && TOOLTIP.contains(e.relatedTarget)) return;
  TOOLTIP.style.display = 'none';
});

TOOLTIP.addEventListener('mouseleave', () => { TOOLTIP.style.display = 'none'; });

// Read-more toggle for boxed warnings
document.addEventListener('click', e => {
  const btn = e.target.closest('.bw-toggle');
  if (!btn) return;
  const uid  = btn.dataset.uid;
  const el   = document.getElementById(uid);
  const expanded = btn.dataset.expanded === '1';
  if (expanded) {
    el.textContent = btn.dataset.preview;
    btn.textContent = 'Read full warning ▾';
    btn.dataset.expanded = '0';
  } else {
    el.textContent = btn.dataset.full;
    btn.textContent = 'Collapse ▴';
    btn.dataset.expanded = '1';
  }
});

// ── Library picker ───────────────────────────────────────────────────────────
const libraryMenu = document.getElementById('library-menu');
let libraryOpen = false;

function toggleLibrary() {
  libraryOpen ? closeLibrary() : openLibrary();
}

async function openLibrary() {
  libraryOpen = true;
  libraryMenu.style.display = 'block';
  if (libraryMenu.childElementCount) return;  // already populated

  libraryMenu.innerHTML = '<div style="padding:8px 12px;font-size:0.75rem;color:#999">Loading…</div>';
  try {
    const res = await fetch('data/nnt-library/index.json');
    const items = await res.json();
    libraryMenu.innerHTML = items.map(item => `
      <button onclick="loadLibraryItem('${esc(item.file)}');closeLibrary()"
        style="display:block;width:100%;text-align:left;padding:9px 14px;
               background:none;border:none;border-bottom:1px solid #eee;
               font-size:0.83rem;cursor:pointer;color:#1a1a2e;line-height:1.3"
        onmouseover="this.style.background='#f5f0fb'"
        onmouseout="this.style.background='none'">
        ${esc(item.label)}
      </button>`).join('');
  } catch {
    libraryMenu.innerHTML = '<div style="padding:8px 12px;font-size:0.75rem;color:#c00">Could not load library</div>';
  }
}

function closeLibrary() {
  libraryOpen = false;
  libraryMenu.style.display = 'none';
}

async function loadLibraryItem(file) {
  try {
    const res = await fetch(file);
    const data = await res.json();
    render(data);
  } catch (e) {
    alert('Could not load ' + file + ': ' + e.message);
  }
}

document.addEventListener('click', e => {
  if (libraryOpen && !e.target.closest('#btn-library') && !e.target.closest('#library-menu')) {
    closeLibrary();
  }
});

// ── File loading ─────────────────────────────────────────────────────────────
function loadJSON(text, filename) {
  let data;
  try { data = JSON.parse(text); } catch (e) { alert(`JSON error in ${filename}: ${e.message}`); return; }
  render(data);
}

document.getElementById('file-input').addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => loadJSON(ev.target.result, file.name);
  reader.readAsText(file);
  e.target.value = '';
});

// Drag-drop anywhere on the page
document.addEventListener('dragover', e => { e.preventDefault(); document.body.classList.add('dragging'); });
document.addEventListener('dragleave', e => { if (!e.relatedTarget) document.body.classList.remove('dragging'); });
document.addEventListener('drop', e => {
  e.preventDefault();
  document.body.classList.remove('dragging');
  const file = e.dataTransfer.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => loadJSON(ev.target.result, file.name);
  reader.readAsText(file);
});
