name: Build and push SCP Docker images

on:
  push:
    branches: [master]
    paths:
      - 'scp/**'
      - 'deploy/scp/**'
      - 'sofi-proxy.py'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push rcn-scp-wiki (FedWiki + SCP plugins)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deploy/scp/Dockerfile.fedwiki
          push: true
          tags: ghcr.io/marpie1/rcn-scp-wiki:latest

      - name: Build and push rcn-scp-groove (Groove workspace)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deploy/scp/Dockerfile.groove
          push: true
          tags: ghcr.io/marpie1/rcn-scp-groove:latest

      - name: Build and push rcn-scp-proxy (sofi-proxy)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deploy/scp/Dockerfile.sofi-proxy
          push: true
          tags: ghcr.io/marpie1/rcn-scp-proxy:latest
