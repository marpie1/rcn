# My PHS — home install.
#
# One person, one computer, no TLS, no domain, no shared registry.
#
# Everything sits behind one gate. Caddy is the only container that publishes
# a port, it publishes on 127.0.0.1 only, and it asks for the passphrase before
# anything reaches the wiki, My Health Picture, or My Health Choices.
#
#   cp .env.example .env          # your own Anthropic key
#   ./set-passphrase.sh           # choose the passphrase
#   docker compose up -d --build
#   open http://localhost:8766
#
# The Anthropic key in .env is the person's own. Nothing routes through RCN.

services:

  # The gate. The only way in.
  gate:
    image: caddy:latest
    ports:
      # Same ports the tools already use, so no URL changes anywhere.
      # 127.0.0.1 means this computer only — not the wifi, not the internet.
      - "127.0.0.1:8766:8766"
      - "127.0.0.1:8770:8770"
      - "127.0.0.1:3000:3000"
    environment:
      - GATE_USER=${GATE_USER:-me}
      - GATE_PASSWORD_HASH=${GATE_PASSWORD_HASH:?run ./set-passphrase.sh first}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - coupler
      - optionbox
      - fedwiki
    restart: unless-stopped

  # My Health Picture — the coupler UI and API.
  coupler:
    image: rcn-home-coupler:latest
    build:
      context: ../..                          # repo root (coupler-proxy.py is there)
      dockerfile: deploy/home/Dockerfile.coupler
    expose:
      - "8766"                                # reachable from the gate only
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - WIKI_URL=http://fedwiki:3000          # pages go through the wiki's API
    volumes:
      - coupler-data:/app/scp-coupler/data    # people.json, frames, records
      - wiki-data:/root/.wiki                 # read-side page scans
    depends_on:
      - fedwiki
    restart: unless-stopped

  # My Health Choices — static NNT/NNH library.
  # Same image as the coupler (it already carries scp-optionbox/), so this
  # is a command override rather than a second Dockerfile.
  optionbox:
    image: rcn-home-coupler:latest
    working_dir: /app/scp-optionbox
    command: ["python3", "-m", "http.server", "8770"]
    expose:
      - "8770"
    depends_on:
      - coupler                               # ensures the shared image is built
    restart: unless-stopped

  # FedWiki — the person's own health record, 19 SCP plugins installed.
  fedwiki:
    build:
      context: ../..                          # repo root (scp/plugins/ is there)
      dockerfile: deploy/scp/Dockerfile.fedwiki
    # A fresh volume has no ~/.wiki/config.json, so both of these must be
    # explicit — otherwise the wiki runs single-site and read-only.
    #   --farm            per-person sites at <person>.localhost
    #   --security_legacy unclaimed sites writable over HTTP; without it every
    #                     page write 403s and nothing reaches the search index.
    # security_legacy is why the gate matters: it makes the wiki editable by
    # anyone who can reach it, and the gate is what decides who can.
    command: ["wiki", "--port", "3000", "--farm", "--security_legacy"]
    expose:
      - "3000"
    volumes:
      - wiki-data:/root/.wiki                 # same volume the coupler writes to
    restart: unless-stopped

volumes:
  coupler-data:   # health records — back this up; it is the only copy
  wiki-data:      # FedWiki pages — back this up too
