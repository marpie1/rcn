services:

  # FedWiki — hosts Shared Care Plan pages
  fedwiki:
    image: ghcr.io/marpie1/rcn-scp-wiki:latest
    volumes:
      - wiki-data:/root/.wiki
    restart: unless-stopped

  # Groove — collaborative care plan workspace
  groove:
    image: ghcr.io/marpie1/rcn-scp-groove:latest
    volumes:
      - groove-data:/app/server/data
    restart: unless-stopped

  # sofi-proxy — serves browser tools and proxies API calls
  sofi-proxy:
    image: ghcr.io/marpie1/rcn-scp-proxy:latest
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - SODOTO_PROXY_SECRET=${SODOTO_PROXY_SECRET}
      - PROXY_URL=https://${PROXY_DOMAIN}
    volumes:
      - wiki-data:/root/.wiki
      - sodoto-data:/root/.sodoto
    restart: unless-stopped

  # Caddy — reverse proxy with automatic TLS via Let's Encrypt
  caddy:
    image: caddy:latest
    environment:                              # Caddyfile reads these as {env.*}
      - ACME_EMAIL=${ACME_EMAIL}
      - WIKI_DOMAIN=${WIKI_DOMAIN}
      - GROOVE_DOMAIN=${GROOVE_DOMAIN}
      - PROXY_DOMAIN=${PROXY_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - fedwiki
      - groove
      - sofi-proxy
    restart: unless-stopped

volumes:
  wiki-data:    # FedWiki pages — patient Shared Care Plan data
  groove-data:  # Groove workspace databases
  sodoto-data:  # sofi-proxy shared registry
  caddy-data:   # TLS certificates (do not delete — avoids Let's Encrypt rate limits)
  caddy-config:
