# RCN steward stack — a workbench on one person's computer.
#
# Three things Marc runs by hand, as one `docker compose up`: Neo4j, the
# substrate (api.py — the projections, and the tools it serves), and a
# FedWiki with the RCN plugins. Level 2 in substrate/LAYERS-2-3.md.
#
#   cp .env.example .env            # choose a Neo4j password
#   docker compose up -d
#   open http://localhost:3000      # the wiki
#   open http://localhost:8768      # the substrate: what it can answer
#   open http://localhost:7474      # Neo4j Browser, for the curious
#
# Load your records (put the files in ./records first):
#   docker compose exec substrate python3 substrate/load_whatcom.py --src /records/whatcom
# Publish them as a folder for a site (lands in ./export/rcn-table/):
#   docker compose exec substrate python3 substrate/export.py --bundle whatcom
#
# Everything publishes on 127.0.0.1: this computer only — not the wifi, not the
# internet. There is no gate because there is no one else. The files in
# ./records are the truth; Neo4j is derived from them and can be thrown away
# and rebuilt by running the loader again (decision 17, substrate/tool-inventory.md).
#
# One codebase, same rule as deploy/home: anything that differs between this
# and a laptop or WikiCafe lives here or in .env, never in an `if` in the Python.

services:

  neo4j:
    # ${NEO4J_IMAGE} defaults to Enterprise under its developer terms — the same
    # edition Neo4j Desktop installs, for one person's own machine. The loaders
    # need CREATE DATABASE (whatcom, rcngeo, vna, aspects16 are separate
    # databases), which Community does not have: Community is one database per
    # instance. A shared or NDC server must not run Enterprise on these terms;
    # see the README for what that means for level 3.
    image: ${NEO4J_IMAGE:-neo4j:5.26-enterprise}
    ports:
      - "127.0.0.1:7474:7474"                  # HTTP — Neo4j Browser, and what db.py speaks
      - "127.0.0.1:7687:7687"                  # Bolt — for Desktop or other clients, optional
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env}
      - NEO4J_ACCEPT_LICENSE_AGREEMENT=${NEO4J_ACCEPT_LICENSE_AGREEMENT:-yes}
      - NEO4J_server_memory_heap_max__size=1G
    volumes:
      - neo4j-data:/data                       # derived; rebuildable from ./records
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  substrate:
    image: rcn-steward-substrate:latest
    build:
      context: ../..                           # repo root
      dockerfile: deploy/steward/Dockerfile.substrate
    ports:
      - "127.0.0.1:8768:8768"
    environment:
      - HOST=0.0.0.0
      - PORT=8768
      - NEO4J_HTTP=http://neo4j:7474
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
      - NEO4J_DATABASE=neo4j
    volumes:
      - ./records:/records:ro                  # your files — the truth
      - ./export:/app/substrate/export         # what export.py writes, on your disk
    depends_on:
      neo4j:
        condition: service_healthy
    restart: unless-stopped

  fedwiki:
    # The same image WikiCafe runs, so a table item behaves the same here and
    # there. On localhost the Rcntable popup reads the live substrate above;
    # anywhere else it reads the site's /assets/rcn-table/ folder.
    image: ghcr.io/marpie1/rcn-sodoto-wiki:latest
    # --farm: per-person sites at <name>.localhost. --security_legacy: an
    # unclaimed site is writable over HTTP, which is what you want on a machine
    # only you can reach; it is also why nothing here is published beyond it.
    command: ["wiki", "--port", "3000", "--farm", "--security_legacy"]
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - wiki-data:/root/.wiki
    restart: unless-stopped

volumes:
  neo4j-data:
  wiki-data:      # your pages — back this up
