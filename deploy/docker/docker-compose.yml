services:

  # sofi-proxy — serves the SODOTO issuer tool and proxies wiki write calls
  sofi-proxy:
    image: ghcr.io/marpie1/rcn-sodoto-proxy:latest
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - SODOTO_PROXY_SECRET=${SODOTO_PROXY_SECRET}
      - PROXY_URL=${PROXY_URL}
      - WIKI_SITE=${WIKI_SITE}
      # DID ownership (shape A). Leave unset for today's single-site friends deploy.
      # Flip to 1 in the coordinated rollout: badge-sets-owner + the TLS ask gate.
      # - SODOTO_DID_OWNERSHIP=1
    volumes:
      - wiki-data:/root/.wiki                 # shares pages with FedWiki
      - sodoto-data:/root/.sodoto             # people-registry.json
    restart: unless-stopped

  # FedWiki — hosts learner credential portfolios
  fedwiki:
    image: ghcr.io/marpie1/rcn-sodoto-wiki:latest
    # DID ownership (shape A, per-person sites). Both UNSET == today's single-site
    # friends launch. Flip both in the coordinated rollout (needs the wildcard DNS
    # record + Caddy on-demand block already in the Caddyfile):
    # environment:
    #   - WIKI_FARM=1
    #   - SECURITY_TYPE=did
    volumes:
      - wiki-data:/root/.wiki                 # same volume as sofi-proxy
    restart: unless-stopped

  # Caddy — reverse proxy with automatic TLS via Let's Encrypt
  caddy:
    image: caddy:latest
    environment:                              # Caddyfile reads these as {env.*}
      - ACME_EMAIL=${ACME_EMAIL}
      - SODOTO_DOMAIN=${SODOTO_DOMAIN}
      - WIKI_DOMAIN=${WIKI_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - sofi-proxy
      - fedwiki
    restart: unless-stopped

volumes:
  wiki-data:    # FedWiki pages — learner portfolios and the badge ledger
  sodoto-data:  # sofi-proxy people registry
  caddy-data:   # TLS certificates (do not delete — avoids Let's Encrypt rate limits)
  caddy-config:
