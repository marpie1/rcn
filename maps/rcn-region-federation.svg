      <g id="nodes-layer" transform="translate(0,57.232038834951425) scale(1.245631067961165)"><g id="node-n1" transform="translate(140,90)" style="cursor: move; opacity: 1;"><title>📌 Each steward owns one region.</title><rect x="-100" y="-26" width="200" height="52" rx="10" fill="#1e293b" stroke="#0f172a" stroke-width="2"/><text text-anchor="middle" font-size="12" font-weight="500" fill="#ffffff" pointer-events="none"><tspan x="0" y="-8.0">Regional steward (MI · AZ ·</tspan><tspan x="0" dy="16">WA)</tspan></text><circle cx="96" cy="-22" r="4" fill="#f59e0b" stroke="#fff" stroke-width="1" pointer-events="none"/></g><g id="node-n2" transform="translate(140,210)" style="cursor: move; opacity: 1;"><title>📌 Add NDCs, boundaries, locations; edit issue parcels.</title><rect x="-100" y="-26" width="200" height="52" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/><text text-anchor="middle" font-size="12" font-weight="500" fill="#1e3a8a" pointer-events="none"><tspan x="0" y="-8.0">Edit in RCN Map + Issue</tspan><tspan x="0" dy="16">Editor</tspan></text><circle cx="96" cy="-22" r="4" fill="#f59e0b" stroke="#fff" stroke-width="1" pointer-events="none"/></g><g id="node-n3" transform="translate(140,330)" style="cursor: move; opacity: 1;"><title>📌 rcn-map-data.json + issue-data/*.json.</title><rect x="-100" y="-26" width="200" height="52" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text text-anchor="middle" font-size="12" font-weight="500" fill="#334155" pointer-events="none"><tspan x="0" y="-8.0">Export region bundle + issue</tspan><tspan x="0" dy="16">JSON</tspan></text><circle cx="96" cy="-22" r="4" fill="#f59e0b" stroke="#fff" stroke-width="1" pointer-events="none"/></g><g id="node-n4" transform="translate(140,450)" style="cursor: move; opacity: 1;"><title>📌 Paste/upload as asset or data item. Marc's rule: signing/publishing is the human's action.</title><rect x="-100" y="-28" width="200" height="56" rx="10" fill="#fffbeb" stroke="#fcd34d" stroke-