="-8.0">Your neighborhood (or a</tspan><tspan x="0" dy="16">named roster page)</tspan></text><circle cx="101" cy="-33" r="4" fill="#f59e0b" stroke="#fff" stroke-width="1" pointer-events="none"/></g><g id="node-origin" transform="translate(1010,760)" style="cursor: move; opacity: 1;"><title>📌 §3 snapshot-vs-live. Default is the fork (offline, provenanced). Opt a region into 'follow' and the map re-fetches origin on load.</title><rect x="-95" y="-37" width="190" height="74" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2" stroke-dasharray="8 5"/><text text-anchor="middle" font-size="12" font-weight="500" fill="#0f172a" pointer-events="none"><tspan x="0" y="-8.0">origin URL "follow origin"</tspan><tspan x="0" dy="16">(opt-in)</tspan></text><circle cx="91" cy="-33" r="4" fill="#f59e0b" stroke="#fff" stroke-width="1" pointer-events="none"/></g><g id="node-discover" transform="translate(470,620)" style="cursor: move; opacity: 1;"><title>📌 Scans the chosen source, finds pages carrying an rcnregion item, fetches each. Graceful skip if unreachable.</title><rect x="-110" y="-37" width="220" height="74" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/><text text-anchor="middle" font-size="12" font-weight="500" fill="#0f172a" pointer-events="none"><tspan x="0" y="-8.0">discoverRegionsFromWiki()</tspan><tspan x="0" dy="16">NEW — Phase 3</tspan></text><circle cx="106" cy="-33" r="4" fill="#f59e0b" stroke="#fff" stroke-width="1" pointer-events="none"/></g><g id="node-manifest" transform="translate(150,620)" style="cursor: move; opacity: 1;"><title>📌 Today's path. Stays the default and the zero-FedWiki fallback — no flag-day cutover.</title><rect x="-100" y="-37" width="200" height="74" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><text text-anchor="middle" font-size="12" font-weight="500" fill="#0f172a" pointer-events="none"><tspan x="0" y="-8.0">loadRegions() regions.json</tspan><tspan x="0" dy="16">manifest</tspan></text><circle cx="96" cy="-33" r="4" fill="#f59e0b" stroke="#fff" stroke-width="1" pointer-events="none"/></g><g id="node-federated" transform="translate(470,760)" style="cursor: move; opacity: 1;"><title>📌 Both discovery paths feed the same array. Dedupe by region + origin.</title><rect x="-100" y="-28" width="200" height="56" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/><text text-anchor="middle" font-size="13" font-weight="500" fill="#0f172a" pointer-events="none"><tspan x="0" y="0.0">federatedRegions[]</tspan></text><circle cx="96" cy="-24" r="4" fill="#f59e0b" stroke="#fff" stroke-width="1" pointer-events="none"/></g><g id="node-render" transform="translate(470,880)" style="cursor: move; opacity: 1;"><title>📌 UNCHANGED. Only how regions are FOUND changes, never how they draw.</title><rect x="-110" y="-37" width="220" height="74" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/><text text-anchor="middle" font-size="12" font-weight="500" fill="#0f172a" pointer-events="none"><tspan x="0" y="-8.0">renderFederatedRegions()</tspan><tspan x="0" dy="16">read-only · namespaced</tspan></text><circle cx="106" cy="-33" r="4" fill="#f59e0b" stroke="#fff" stroke-width="1" pointer-events="none"/></g><g id="node-your_map" transform="translate(470,1010)" style="cursor: move; opacity: 1;"><title>📌 Federated regions appear as read-only namespaced overlay layers, exactly as today.</title><rect x="-95" y="-33" width="190" height="66" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2"/><text text-anchor="middle" font-size="13" font-weight="500" fill="#0f172a" pointer-events="none"><tspan x="0" y="-8.5">Your RCN Map region</tspan><tspan x="0" dy="17">overlay</tspan></text><circle cx="91" cy="-29" r="4" fill="#f59e0b" stroke="#fff" stroke-width="1" pointer-events="none"/></g></g>
