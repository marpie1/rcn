      <g id="nodes-layer" transform="translate(121.72222222222223,-9.535014005602193) scale(0.7945845004668534)"><g id="node-map_steward" transform="translate(150,80)" style="cursor: move; opacity: 1;"><title>📌 Any steward running rcn_map.html with their own NDCs, pins and boundaries.</title><rect x="-95" y="-28" width="190" height="56" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text text-anchor="middle" font-size="13" font-weight="500" fill="#0f172a" pointer-events="none"><tspan x="0" y="0.0">Steward's RCN Map</tspan></text><circle cx="91" cy="-24" r="4" fill="#f59e0b" stroke="#fff" stroke-width="1" pointer-events="none"/></g><g id="node-bundle" transform="translate(150,210)" style="cursor: move; opacity: 1;"><title>📌 Exactly today's ⬇ Export my data output — same keys renderFederatedRegions() already reads.</title><rect x="-105" y="-37" width="210" height="74" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text text-anchor="middle" font-size="12" font-weight="500" fill="#0f172a" pointer-events="none"><tspan x="0" y="-8.0">Region bundle ndcs · locations</tspan><tspan x="0" dy="16">· polygons · corrections</tspan></text><circle cx="101" cy="-33" r="4" fill="#f59e0b" stroke="#fff" stroke-width="1" pointer-events="none"/></g><g id="node-publish" transform="translate(150,345)" style="cursor: move; opacity: 1;"><title>📌 Already built (2026-07-25). Phase 2 adds a 'copy as rcnregion item' button beside the manifest download.</title><rect x="-95" y="-28" width="190" height="56" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text text-anchor="middle" font-size="13" font-weight="500" fill="#0f172a" pointer-events="none"><tspan x="0" y="0.0">Publish regions panel</tspan></text><circle cx="91" cy="-24" r="4" fill="#f59e0b" stroke="#fff" stroke-width="1" pointer-events="none"/></g><g id="node-region_page" transform="translate(150,480)" style="cursor: move; opacity: 1;"><title>📌 Phase 1: wiki-plugin-rcnregion. Publishing stays the human's 